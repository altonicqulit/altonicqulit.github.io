:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --d1:#4f9a78; --d2:#4a7db3; --d3:#c09235; --d4:#c25a50; --d5:#7f63b3;
  --bg:#f5f4f0; --surface:#ffffff; --raise:#fbfaf7; --ink:#1b1b1d; --ink2:#66666c; --ink3:#9a9aa0;
  --line:rgba(20,20,25,.10); --line2:rgba(20,20,25,.18); --accent:#1b1b1d; --onaccent:#f5f4f0;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px -12px rgba(0,0,0,.12);
  --serif:"CMU Serif","Latin Modern Roman","Computer Modern",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111112; --surface:#18181a; --raise:#1d1d20; --ink:#ebebe8; --ink2:#a2a2a8; --ink3:#6f6f76;
    --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.18); --accent:#ebebe8; --onaccent:#111112;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#111112; --surface:#18181a; --raise:#1d1d20; --ink:#ebebe8; --ink2:#a2a2a8; --ink3:#6f6f76;
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.18); --accent:#ebebe8; --onaccent:#111112;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .3s,color .3s}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
img,svg{max-width:100%}
.wrap{max-width:1160px;margin:0 auto;padding:18px clamp(18px,4vw,44px) 90px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 0 10px;border-bottom:1px solid var(--line)}
.brand{background:none;border:0;cursor:pointer;padding:6px 0;font-size:21px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:baseline;gap:10px}
.brand small{font-weight:400;font-size:14px;color:var(--ink2);font-style:italic}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;transition:border-color .2s}
.iconbtn:hover{border-color:var(--line2)}
.eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}

/* reveal on scroll */
.rv{opacity:0;transform:translateY(34px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1);transition-delay:var(--dl,0ms)}
.rv.in{opacity:1;transform:none}

/* hero */
.hero{min-height:min(78vh,720px);display:flex;flex-direction:column;justify-content:center;padding:60px 0 40px}
.hero h1{font-weight:700;font-size:clamp(46px,9.5vw,118px);line-height:.95;letter-spacing:-.035em;margin:18px 0 26px}
.hero h1 em{font-weight:400;color:var(--ink2)}
.hero p{font-size:clamp(17px,2vw,21px);color:var(--ink2);max-width:46ch;margin:0}
.stats{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:38px;padding-top:22px;border-top:1px solid var(--line)}
.stat{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink2)}
.stat b{width:9px;height:9px;border-radius:50%;background:var(--c)}
.stat strong{color:var(--ink);font-weight:700}
.scrollcue{margin-top:46px;font-size:14px;color:var(--ink3);display:flex;align-items:center;gap:10px}
.scrollcue i{width:1px;height:38px;background:linear-gradient(var(--ink3),transparent);animation:cue 2.4s ease-in-out infinite}
@keyframes cue{0%,100%{transform:scaleY(.4);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}}

/* chapter rows */
.row{display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(18px,3vw,40px);align-items:center;padding:clamp(40px,8vh,90px) 0;border-top:1px solid var(--line)}
.row.rev .chbtn{order:2}
.chbtn{display:block;text-align:left;width:100%;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:clamp(24px,3.5vw,40px);box-shadow:var(--shadow);transition:transform .45s cubic-bezier(.2,.8,.2,1),border-color .25s}
.chbtn:hover{transform:translateY(-4px);border-color:var(--line2)}
.chbtn .eyebrow{display:flex;justify-content:space-between}
.chbtn h2{font-size:clamp(34px,5.4vw,60px);line-height:1;letter-spacing:-.03em;margin:16px 0 18px;font-weight:700}
.chbtn .meta{display:flex;gap:18px;flex-wrap:wrap;color:var(--ink2);font-size:15px;margin-bottom:22px}
.chbtn .meta strong{color:var(--ink)}
.dist{display:flex;height:6px;border-radius:9px;overflow:hidden;gap:2px;background:var(--line)}
.dist i{display:block;background:var(--c)}
.opench{margin-top:24px;display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.opench span{transition:transform .3s}
.chbtn:hover .opench span{transform:translateX(5px)}
.previews .eyebrow{margin-bottom:12px}
.pv{display:block;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:16px 4px 16px 18px;cursor:pointer;position:relative;transition:background .2s}
.pv:last-child{border-bottom:1px solid var(--line)}
.pv::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:3px;border-radius:3px;background:var(--c)}
.pv:hover{background:var(--surface)}
.pv .ph{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--ink2);margin-bottom:5px}
.pv .ph b{font-weight:700;color:var(--ink)}
.pv .pt{max-height:3.2em;overflow:hidden;-webkit-mask:linear-gradient(#000 55%,transparent);mask:linear-gradient(#000 55%,transparent);font-size:16px}
.pv .pt .parts,.pv .pt .opts{display:none}
.empty{border:1px dashed var(--line2);border-radius:22px;padding:56px 24px;text-align:center;color:var(--ink2)}
@media (max-width:860px){.row{grid-template-columns:1fr}.row.rev .chbtn{order:0}}
.foot{border-top:1px solid var(--line);padding-top:26px;margin-top:20px;color:var(--ink3);font-size:14px}

/* chapter view */
.back{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:15px}
.back:hover{border-color:var(--line2)}
.chhead{padding:34px 0 26px}
.chhead h2{font-weight:700;font-size:clamp(40px,7vw,80px);line-height:1;letter-spacing:-.035em;margin:12px 0 14px}
.chhead p{color:var(--ink2);margin:0 0 18px}
.bigdist{display:flex;height:34px;border-radius:10px;overflow:hidden;gap:2px;margin-bottom:24px}
.bigdist button{border:0;background:var(--c);cursor:pointer;color:#fff;font-size:14px;font-weight:700;min-width:26px;white-space:nowrap;overflow:hidden;transition:opacity .25s,filter .2s}
.bigdist button.off{opacity:.25}
.bigdist button:hover{filter:brightness(1.08)}
.bigdist .bn{display:none}@media (min-width:640px){.bigdist .bn{display:inline}}
.toolbar{position:relative;z-index:6;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px;margin-bottom:22px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
@media (min-width:760px) and (min-height:700px){.toolbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px)}}
.search{flex:1 1 220px;display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--raise)}
.search:focus-within{border-color:var(--line2)}
.search input{flex:1;border:0;background:none;outline:none;min-width:0}
.dd{position:relative}
.ddb{height:42px;display:inline-flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--raise);cursor:pointer;white-space:nowrap}
.ddb:hover,.dd.open .ddb{border-color:var(--line2)}
.ddb .n{display:none;min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:var(--onaccent);font-size:12px;font-weight:700;padding:0 6px;align-items:center;justify-content:center}
.ddb .n.on{display:inline-flex}
.ddb svg{transition:transform .25s}
.dd.open .ddb svg{transform:rotate(180deg)}
.ddp{position:absolute;top:calc(100% + 6px);left:0;min-width:240px;max-width:min(340px,86vw);max-height:min(360px,60vh);overflow:auto;background:var(--surface);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);padding:8px;opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .2s,transform .2s}
.dd.right .ddp{left:auto;right:0}
.dd.open .ddp{opacity:1;transform:none;pointer-events:auto}
.ddp label{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:15px}
.ddp label:hover{background:var(--raise)}
.ddp input{width:17px;height:17px;accent-color:var(--ink);flex:none}
.ddp label b{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}

"text": "Let $A, B, C$ be non-empty sets in a universal set $U$, with measure $m(X)$ meaning the number of elements. Given $m(A) = 8,\\ m(B) = 6,\\ m(C) = 4,\\ m(A \\cap B \\cap C) = 1$, which statements must be true?<div class='opts'><span>(a) $m(A \\cap B \\cap C^c) \\le 5$</span><span>(b) $m(A^c \\cap B \\cap C) \\le 2$</span><span>(c) $m(A \\cup B \\cup C)_{\\max} = 19$</span><span>(d) $m((A\\cup B\\cup C)^c) \\ge m(U) - 17$</span></div>",

"text": "$m(A\\cap B\\cap C^c) = m(A\\cap B) - 1 \\le m(B) - 1 = 5$. True."

"solution": {

"text": "$\\Delta_x = \\Delta_y = \\Delta_z = 0$, and the first equation is twice the third — infinitely many (any $q$)"
},
{
"title": "q = 3, p ≠ 2",
"text": "$\\Delta_x = 6 - 3p \\ne 0$ — no solution"
}
],
"answer": "(i) $p \\ne 2, q \\ne 3$ (ii) $p = 2$ (iii) $q = 3, p \\ne 2$"
},
"id": "dt-030",
"number": "30"
},
{
"difficulty": 3,
"topics": [
"System of linear equations"
],
"type": "Find the value",
"text": "Find $\\alpha$ for which $\\alpha x + y + z = \\alpha - 1$, $x + \\alpha y + z = \\alpha - 1$, $x + y + \\alpha z = \\alpha - 1$ has (i) infinitely many solutions (ii) no solution.",
"solution": {
"steps": [
{
"title": "Δ",
"text": "$\\alpha^3 - 3\\alpha + 2 = (\\alpha - 1)^2(\\alpha + 2)$"
},
{
"title": "α = 1",
"text": "All three equations become $x + y + z = 0$: infinitely many"
},
{
"title": "α = −2",
"text": "Adding gives $0 = -9$: inconsistent"
}
],
"answer": "(i) α = 1 (ii) α = −2"
},
"id": "dt-031",
"number": "31"
},
{
"difficulty": 3,
"topics": [
"System of linear equations"
],
"type": "MCQ",
"text": "Let $a, \\lambda, \\mu \\in R$ and $\\lambda x + 2y = a$, $\\mu x - 2y = 3$. Which are correct?<div class='opts'><span>(a) If $a = -3$, infinitely many solutions for all $\\lambda, \\mu$</span><span>(b) If $a \\ne -3$, unique solution for all $\\lambda, \\mu$</span><span>(c) If $\\lambda + \\mu = 0$, infinitely many solutions for $a = -3$</span><span>(d) If $\\lambda + \\mu = 0$, no solution for $a \\ne -3$</span></div>",
"solution": {
"steps": [
{
"title": "Add the equations",
"text": "$(\\lambda + \\mu)x = a + 3$"
},
{
"title": "Cases",
"text": "$\\lambda + \\mu \\ne 0$: unique. $\\lambda + \\mu = 0$: infinite if $a = -3$, none otherwise"
}
],
"answer": "(C) and (D)"
},
"id": "dt-032",
"number": "32"
},
{
"difficulty": 3,
"topics": [
"System of linear equations"
],
"type": "Concept",
"text": "Show that $x + 2y + 3z = 1$, $x + 2y + 3z = 2$, $x + 2y + 3z = 3$ has no solution even though $\\Delta = \\Delta_x = \\Delta_y = \\Delta_z = 0$.",
"solution": {
"steps": [
{
"title": "All determinants vanish",
"text": "Every row of the coefficient matrix is $(1, 2, 3)$, so each determinant has equal rows"
},
{
"title": "Geometry",
"text": "Three parallel planes — they never meet"
}
],
"answer": "No solution",
"tip": "For 3 variables, $\\Delta = \\Delta_x = \\Delta_y = \\Delta_z = 0$ does not guarantee infinitely many solutions — check consistency directly."
},
"id": "dt-033",
"number": "33"
},
{
"difficulty": 3,
"topics": [
"System of linear equations"
],
"type": "Find the value",
"text": "If $px + by + cz = 0$, $ax + qy + cz = 0$, $ax + by + rz = 0$ has a non-trivial solution, find $\\frac p{p-a} + \\frac q{q-b} + \\frac r{r-c}$.",
"solution": {
"steps": [
{
"title": "Homogeneous",
"text": "Non-trivial solution ⇔ $\\Delta = 0$"
},
{
"title": "Simplify",
"text": "$R_2 - R_1$, $R_3 - R_1$ and expand: $(p-a)(q-b)(r-c)\\left[\\frac p{p-a} + \\frac b{q-b} + \\frac c{r-c}\\right] = 0$"
},
{
"title": "Convert",
"text": "$\\frac b{q-b} = \\frac q{q-b} - 1$, $\\frac c{r-c} = \\frac{r}{r-c} - 1$"
}
],
"answer": "2",
"tip": "A homogeneous system always has the trivial solution; it has others exactly when $\\Delta = 0$."
},
"id": "dt-034",
"number": "34"
},
{
"difficulty": 2,
"topics": [
"PYQs & applications"
],
"type": "MCQ",
"text": "When $\\begin{vmatrix}\\cos2x&\\sin^2x&\\cos4x\\\\\\sin^2x&\\cos2x&\\cos^2x\\\\\\cos4x&\\cos^2x&\\cos2x\\end{vmatrix}$ is expanded in powers of $\\sin x$, the constant term is<div class='opts'><span>(a) 1</span><span>(b) 0</span><span>(c) −1</span><span>(d) 2</span></div>",
"solution": {
"steps": [
{
"title": "Constant term = value at sin x = 0",
"text": "Put $x = 0$: $\\begin{vmatrix}1&0&1\\\\0&1&1\\\\1&1&1\\end{vmatrix} = 0 - 0 + (0 - 1)$"
}
],
"answer": "(c) −1",
"tip": "Constant term of a polynomial in $t$ = its value at $t = 0$."
},
"id": "dt-035",
"number": "35"
},
{
"difficulty": 4,
"topics": [
"System of linear equations"
],
"type": "MCQ",
"text": "The system $-kx + 3y - 14z = 25$, $-15x + 4y - kz = 3$, $-4x + y + 3z = 4$ is consistent for all $k$ in the set (JEE 2022)<div class='opts'><span>(a) R</span><span>(b) $R - \\{-11, 13\\}$</span><span>(c) $R - \\{13\\}$</span><span>(d) $R - \\{-11, 11\\}$</span></div>",
"solution": {
"steps": [
{
"title": "Δ",
"text": "$-k(12 + k) - 3(-45 - 4k) - 14(1) = 121 - k^2$, zero at $k = \\pm11$"
},
{
"title": "Check those k",
"text": "$k = 11$: $\\Delta_x = 598 \\ne 0$; $k = -11$: $\\Delta_x = 312 \\ne 0$ — both inconsistent"
}
],
"answer": "(d)"
},
"id": "dt-036",
"number": "36"
},
{
"difficulty": 1,
"topics": [
"Standard determinants"
],
"type": "Concept",
"text": "Evaluate $\\begin{vmatrix}0&-a&b\\\\a&0&-c\\\\-b&c&0\\end{vmatrix}$ and $\\begin{vmatrix}a&h&g\\\\h&b&f\\\\g&f&c\\end{vmatrix}$.",
"solution": {
"steps": [
{
"title": "Skew-symmetric, odd order",
"text": "Transposing gives $(-1)^3\\Delta = -\\Delta$, so $\\Delta = 0$"
},
{
"title": "Symmetric",
"text": "Expand: $abc + 2fgh - af^2 - bg^2 - ch^2$"
}
],
"answer": "0; $abc + 2fgh - af^2 - bg^2 - ch^2$"
},
"id": "dt-037",
"number": "37"
}
]
},
{
"id": "coordinate-geometry",
"number": 9,
"title": "Coordinate Geometry",
"questions": [
{
"difficulty": 1,
"topics": [
"Coordinate systems"
],
"type": "Concept",
"text": "Convert the polar point $(3, \\pi)$ to Cartesian form.",
"solution": {
"steps": [
{
"title": "Formulas",
"text": "$x = r\\cos\\theta,\\ y = r\\sin\\theta$; $r^2 = x^2 + y^2$, $\\tan\\theta = \\frac yx$"
}
],
"answer": "$(-3, 0)$"
},
"id": "cg-001",
"number": "1"
},
{
"difficulty": 2,
"topics": [
"Distance formula"
],
"type": "Find the value",
"text": "Find the third vertex of an equilateral triangle with two vertices $A(0, 0)$ and $B(\\sqrt3, 1)$.",
"solution": {
"steps": [
{
"title": "Equal sides",
"text": "$AB^2 = 4 = x^2 + y^2 = (x - \\sqrt3)^2 + (y - 1)^2$"
},
{
"title": "Subtract",
"text": "$2\\sqrt3x + 2y = 4 \\Rightarrow y = 2 - \\sqrt3x$"
},
{
"title": "Solve",
"text": "$x^2 + (2 - \\sqrt3x)^2 = 4 \\Rightarrow x(x - \\sqrt3) = 0$"
}
],
"answer": "$(0, 2)$ or $(\\sqrt3, -1)$",
"tip": "AB makes 30° with the x-axis, so C is AB rotated by ±60° about A."
},
"id": "cg-002",
"number": "2"
},
{
"difficulty": 2,
"topics": [
"Section formula"
],
"type": "Find the value",
"text": "In what ratio do (i) the $x$-axis (ii) the $y$-axis divide the segment joining $A(3, -4)$ and $B(5, 6)$?",
"solution": {
"steps": [
{
"title": "Section formula",
"text": "Take ratio $k : 1$: $P = \\left(\\frac{5k+3}{k+1}, \\frac{6k-4}{k+1}\\right)$"
},
{
"title": "(i)",
"text": "$y = 0 \\Rightarrow k = \\frac23$"
},
{
"title": "(ii)",
"text": "$x = 0 \\Rightarrow k = -\\frac35$ (negative ⇒ external)"
}
],
"answer": "(i) 2 : 3 internally (ii) 3 : 5 externally",
"tip": "Unknown ratios are taken as $k : 1$; a negative $k$ means external division."
},
"id": "cg-003",
"number": "3"
},
{
"difficulty": 2,
"topics": [
"Section formula"
],
"type": "Find the value",
"text": "In what ratio does the line $2x + y - 3 = 0$ divide the segment joining $A(-1, 2)$ and $B(3, 5)$?",
"solution": {
"steps": [
{
"title": "Point",
"text": "$P = \\left(\\frac{3k-1}{k+1}, \\frac{5k+2}{k+1}\\right)$"
},
{
"title": "On the line",
"text": "$2(3k - 1) + (5k + 2) - 3(k + 1) = 0 \\Rightarrow 8k = 3$"
}
],
"answer": "3 : 8 internally"
},
"id": "cg-004",
"number": "4"
},
{
"difficulty": 1,
"topics": [
"Section formula"
],
"type": "Find the value",
"text": "For $A(2, 0)$ and $B(8, 0)$, find $Q$ dividing $AB$ externally in the ratio 2 : 1.",
"solution": {
"steps": [
{
"title": "External formula",
"text": "$Q = \\left(\\frac{mx_2 - nx_1}{m - n}, \\frac{my_2 - ny_1}{m - n}\\right) = \\left(\\frac{16 - 2}{1}, 0\\right)$"
}
],
"answer": "$(14, 0)$"
},
"id": "cg-005",
"number": "5"
}
]
}
]
}

<script>
(() => {
const LEVELS=[{n:1,name:"Novice",c:"var(--d1)"},{n:2,name:"Rookie",c:"var(--d2)"},{n:3,name:"Intermediate",c:"var(--d3)"},{n:4,name:"Advanced",c:"var(--d4)"},{n:5,name:"Expert",c:"var(--d5)"}];
const L=n=>LEVELS[n-1];
const DATA=JSON.parse(document.getElementById('atlas-data').textContent);
const chapters=DATA.chapters||[];
chapters.forEach(c=>(c.questions||[]).forEach(q=>{q._ch=c.title;q._chn=c.number;q._cid=c.id;}));
const ALL={id:'all',title:'All questions',questions:chapters.flatMap(c=>c.questions||[])};
const base=ch=>ch.id==='all'?'#/all':'#/ch/'+encodeURIComponent(ch.id);
const view=document.getElementById('view'), overlay=document.getElementById('overlay'), sheet=document.getElementById('sheet');
const state={}; const fs=id=>state[id]||(state[id]={q:"",lv:new Set(),chs:new Set(),topics:new Set(),types:new Set(),diag:false,sort:"num"});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip=s=>String(s??'').replace(/<[^>]+>/g,' ').replace(/\$+/g,' ');
const typeset=el=>{ if(!el) return; if(window.MathJax&&MathJax.typesetPromise) MathJax.typesetPromise([el]).catch(()=>{}); else setTimeout(()=>typeset(el),300); };
const counts=qs=>LEVELS.map(l=>qs.filter(q=>q.difficulty===l.n).length);
const go=h=>{location.hash=h;};
const hasDiag=q=>!!(q.diagram||q.solution?.diagram);
const pips=n=>`<span class="pips">${[1,2,3,4,5].map(i=>`<i class="${i<=n?'f':''}"></i>`).join('')}</span>`;
const chev=`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>`;

/* theme */
const root=document.documentElement;
try{const t=localStorage.getItem('atlas-theme'); if(t) root.dataset.theme=t;}catch(e){}
document.getElementById('theme').onclick=()=>{const dark=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches; root.dataset.theme=dark?'light':'dark'; try{localStorage.setItem('atlas-theme',root.dataset.theme);}catch(e){}};
document.getElementById('home').onclick=()=>go('#/');
document.getElementById('allbtn').onclick=()=>go('#/all');
document.getElementById('testbtn').onclick=()=>go('#/test');

/* scroll reveal: fades in and out both ways */
let io=null;
function observe(){
  if(io) io.disconnect();
  if(!('IntersectionObserver' in window)){document.querySelectorAll('.rv').forEach(e=>e.classList.add('in'));return;}
  io=new IntersectionObserver(es=>es.forEach(e=>e.target.classList.toggle('in',e.isIntersecting&&e.intersectionRatio>0.12)),{threshold:[0,0.12,0.3],rootMargin:'-4% 0px -8% 0px'});
  document.querySelectorAll('.rv').forEach(e=>io.observe(e));
}

/* pick showcase questions: hardest first, distinct topics, prefer ones with tips/diagrams */
function picks(ch,n=3){
  const qs=[...(ch.questions||[])].sort((a,b)=>(b.difficulty-a.difficulty)||((b.solution?.tip?1:0)+(hasDiag(b)?1:0))-((a.solution?.tip?1:0)+(hasDiag(a)?1:0))||strip(a.text).length-strip(b.text).length);
  const out=[],seen=new Set();
  for(const q of qs){const t=(q.topics||[])[0]; if(out.length<n&&!seen.has(t)){out.push(q);seen.add(t);}}
  for(const q of qs){if(out.length<n&&!out.includes(q)) out.push(q);}
  return out.sort((a,b)=>a.difficulty-b.difficulty);
}

/* HOME */
function renderHome(){
  const all=chapters.flatMap(c=>c.questions||[]); const k=counts(all);
  view.innerHTML=`
  <section class="hero">
    <div class="eyebrow rv">Worked problems · ${chapters.length} chapters</div>
    <h1 class="rv" style="--dl:80ms">Every problem,<br><em>in its place.</em></h1>
    <p class="rv" style="--dl:160ms">A catalogue of the questions in your maths notes, sorted by difficulty and topic, each with a step-by-step solution.</p>
    <div class="stats rv" style="--dl:240ms"><span class="stat"><strong>${all.length}</strong> problems</span>${LEVELS.map((l,i)=>`<span class="stat" style="--c:${l.c}"><b></b>${l.name} <strong>${k[i]}</strong></span>`).join('')}</div>
    <div class="rv" style="--dl:300ms;margin-top:34px"><button class="reveal" id="herobtn" style="width:auto;padding:0 26px;margin:0">Browse all ${all.length} questions →</button> <button class="back" id="herotest" style="height:52px;padding:0 22px;margin-left:8px">Take a mock test</button></div>
    <div class="scrollcue rv" style="--dl:360ms"><i></i>Or scroll to explore the chapters</div>
  </section>
  ${chapters.length?chapters.map((c,ci)=>{
    const qs=c.questions||[]; const kk=counts(qs); const tot=qs.length||1;
    const topics=new Set(qs.flatMap(q=>q.topics||[])).size;
    return `<section class="row ${ci%2?'rev':''}">
      <button class="chbtn rv" data-ch="${esc(c.id)}">
        <div class="eyebrow"><span>Chapter ${String(c.number??ci+1).padStart(2,'0')}</span><span>${topics} topics</span></div>
        <h2>${esc(c.title)}</h2>
        <div class="meta"><span><strong>${qs.length}</strong> problems</span><span><strong>${qs.filter(hasDiag).length}</strong> with diagrams</span>${c.formulas?`<span>Formula sheet</span>`:''}</div>
        <div class="dist">${kk.map((v,i)=>v?`<i style="--c:${LEVELS[i].c};flex:${v/tot}"></i>`:'').join('')}</div>
        <div class="opench">Open chapter <span>→</span></div>
      </button>
      <div class="previews">
        <div class="eyebrow rv" style="--dl:60ms">From this chapter</div>
        ${picks(c).map((q,j)=>{const l=L(q.difficulty);return `<button class="pv rv" style="--c:${l.c};--dl:${120+j*90}ms" data-ch="${esc(c.id)}" data-q="${esc(q.id)}">
          <div class="ph"><span><b>Problem ${esc(q.number)}</b> · ${esc((q.topics||[])[0]||'')}</span><span>${l.name}</span></div>
          <div class="pt">${q.text}</div></button>`}).join('')}
      </div></section>`}).join('')
  :`<div class="empty rv">No chapters yet. Share a chapter PDF in the chat to add it here.</div>`}
  <section class="row" style="grid-template-columns:1fr"><button class="chbtn rv" id="testcard"><div class="eyebrow"><span>Practice</span><span>Timed · exam-style</span></div><h2>Take a mock test</h2><div class="meta"><span>Choose chapters and topics, set difficulty from 1 to 10, then get a full analysis with solutions.</span></div><div class="opench">Set up a test <span>→</span></div></button></section>
  <section class="row" style="grid-template-columns:1fr"><button class="chbtn rv" id="allcard"><div class="eyebrow"><span>Everything</span><span>${chapters.length} chapters</span></div><h2>All questions</h2><div class="meta"><span><strong>${all.length}</strong> problems in one place, with filters for chapter, difficulty, topic and type</span></div><div class="dist">${k.map((v,i)=>v?`<i style="--c:${LEVELS[i].c};flex:${v/(all.length||1)}"></i>`:'').join('')}</div><div class="opench">Browse all <span>→</span></div></button></section>
  <footer class="foot rv">Math Atlas · ${all.length} problems across ${chapters.length} chapters</footer>`;
  view.querySelector('#herobtn').onclick=()=>go('#/all'); view.querySelector('#herotest').onclick=()=>go('#/test'); const ac=view.querySelector('#allcard'); if(ac) ac.onclick=()=>go('#/all'); const tc=view.querySelector('#testcard'); if(tc) tc.onclick=()=>go('#/test');
  view.querySelectorAll('.chbtn').forEach(b=>b.onclick=()=>go('#/ch/'+encodeURIComponent(b.dataset.ch)));
  view.querySelectorAll('.pv').forEach(b=>b.onclick=()=>go(`#/ch/${encodeURIComponent(b.dataset.ch)}/q/${encodeURIComponent(b.dataset.q)}`));
  observe(); typeset(view);
}

/* CHAPTER */
function filtered(ch){
  const f=fs(ch.id), term=f.q.trim().toLowerCase();
  const qs=(ch.questions||[]).filter(q=>(!f.lv.size||f.lv.has(q.difficulty))&&(!f.chs.size||f.chs.has(q._cid))&&(!f.topics.size||(q.topics||[]).some(t=>f.topics.has(t)))&&(!f.types.size||f.types.has(q.type))&&(!f.diag||hasDiag(q))&&(!term||(String(q.number)+' '+strip(q.text)+' '+(q.topics||[]).join(' ')+' '+(q.type||'')+' '+(ch.id==='all'?q._ch:'')).toLowerCase().includes(term)));
  const byNum=(a,b)=>((a._chn||0)-(b._chn||0))||String(a.number).localeCompare(String(b.number),undefined,{numeric:true});
  const sorts={num:byNum,easy:(a,b)=>a.difficulty-b.difficulty||byNum(a,b),hard:(a,b)=>b.difficulty-a.difficulty||byNum(a,b),topic:(a,b)=>(a.topics?.[0]||'').localeCompare(b.topics?.[0]||'')||byNum(a,b)};
  return qs.sort(sorts[f.sort]);
}
function dd(key,label,items,right){
  return `<div class="dd ${right?'right':''}" data-k="${key}"><button class="ddb" type="button" aria-haspopup="true">${label} <span class="n"></span>${chev}</button>
  <div class="ddp" role="menu">${items}<hr><div class="ddfoot"><button class="link ddclr" type="button">Clear</button><button class="link ddok" type="button">Done</button></div></div></div>`;
}
let curCh=null;
function renderChapter(ch){
  curCh=ch; const isAll=ch.id==='all'; const f=fs(ch.id); const qs=ch.questions||[]; const k=counts(qs); const tot=qs.length||1;
  const cnt=(arr,get)=>{const m={};arr.forEach(q=>get(q).forEach(v=>m[v]=(m[v]||0)+1));return m;};
  const tc=cnt(qs,q=>q.topics||[]), yc=cnt(qs,q=>q.type?[q.type]:[]);
  const topics=Object.keys(tc).sort(), types=Object.keys(yc).sort();
  view.innerHTML=`
  <div class="chhead"><button class="back" id="back">← All chapters</button>
    <div class="eyebrow" style="margin-top:28px">${isAll?'Everything':'Chapter '+String(ch.number??'').padStart(2,'0')}</div>
    <h2>${esc(ch.title)}</h2>
    <p>${qs.length} problems across ${isAll?chapters.length+' chapters and ':''}${topics.length} topics. Select a band to filter by difficulty.</p>
    ${ch.formulas?`<button class="back" id="tofs">Formula sheet ↓</button>`:''}</div>
  <div class="bigdist" id="bands">${k.map((v,i)=>v?`<button data-lv="${i+1}" style="--c:${LEVELS[i].c};flex:${v/tot}" title="${LEVELS[i].name}: ${v}"><span class="bn">${LEVELS[i].name} </span>${v}</button>`:'').join('')}</div>
  <div class="toolbar">
    <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="srch" type="search" placeholder="Search problems" value="${esc(f.q)}" aria-label="Search problems"></label>
    ${dd('lv','Difficulty',LEVELS.filter((l,i)=>k[i]).map(l=>`<label style="--c:${l.c}"><input type="checkbox" value="${l.n}"><b></b>${l.name}<small>${k[l.n-1]}</small></label>`).join(''))}
    ${isAll?dd('chs','Chapter',chapters.map(c=>`<label><input type="checkbox" value="${esc(c.id)}">${esc(c.title)}<small>${(c.questions||[]).length}</small></label>`).join('')):''}
    ${dd('topics','Topic',topics.map(t=>`<label><input type="checkbox" value="${esc(t)}">${esc(t)}<small>${tc[t]}</small></label>`).join(''))}
    ${dd('types','Type',types.map(t=>`<label><input type="checkbox" value="${esc(t)}">${esc(t)}<small>${yc[t]}</small></label>`).join('')+`<hr><label><input type="checkbox" value="__diag">Has diagram<small>${qs.filter(hasDiag).length}</small></label>`,true)}
    <select id="sort" aria-label="Sort problems"><option value="num">In order</option><option value="easy">Easiest first</option><option value="hard">Hardest first</option><option value="topic">By topic</option></select>
    <div class="countrow"><span id="count"></span><button class="link" id="clr" hidden>Clear all filters</button></div>

const rnd=n=>Math.floor(Math.random()*n);

function prepQ(q){
  const ans=q.solution?.answer||''; if(q.type==='Proof'||/proved/i.test(strip(ans))) return null;

    if(spans.length>=3&&letters.length) return {kind:letters.length>1?'multi':'single',q,stem:q.text.replace(om[0],''),options:spans.map(s=>({key:s[1],html:s[2]})),correct:letters};

const SWAPS=[['\\lt','\\gt'],['\\le','\\ge'],['+','-'],['\\sin','\\cos'],['\\tan','\\cot'],['\\sec','\\text{cosec}'],['AP','HP'],['GP','AP'],['HP','GP'],['\\cup','\\cap'],['[','('],[']',')'],['even','odd'],['all','no']];
function mutate(s){
  const nums=[...s.matchAll(/\d+(\.\d+)?/g)].filter(m=>!/[a-zA-Z#&]/.test(s[m.index-1]||' ')||/[a-zA-Z]/.test(s[m.index-1])&&/\\(frac|sqrt|times)$/.test(s.slice(0,m.index)));

    const sameC=pool.filter(p=>p.gen&&p!==item&&p.q._cid===item.q._cid);
    for(const src of [shuffle(sameT),shuffle(sameC)]) for(const p of src){ const a=normAns(p.ansHTML); if(out.length<4&&!out.includes(a)) out.push(a);}

  box.querySelectorAll('.topt').forEach(b=>b.onclick=()=>{
    if(it.kind==='multi'){const s=new Set(R.draft[R.cur]??R.ans[R.cur]??[]); s.has(b.dataset.k)?s.delete(b.dataset.k):s.add(b.dataset.k); setDraft([...s].sort());}
    else setDraft(b.dataset.k);
    const v=R.draft[R.cur]; box.querySelectorAll('.topt').forEach(x=>{const on=it.kind==='multi'?v.includes(x.dataset.k):v===x.dataset.k;x.classList.toggle('on',on);x.setAttribute('aria-checked',on);});
  });
  const ni=box.querySelector('#numv'); if(ni) ni.oninput=()=>setDraft(ni.value.trim()===''?null:ni.value.trim());
  const filled=v=>v!=null&&!(Array.isArray(v)&&!v.length)&&v!=='';
  const commit=()=>{const v=R.draft[R.cur]!==null?R.draft[R.cur]:R.ans[R.cur]; R.ans[R.cur]=filled(v)?v:null; R.draft[R.cur]=null;};
  box.querySelector('#save').onclick=()=>{commit(); R.status[R.cur]=R.ans[R.cur]!=null?'a':'na'; move(R.cur+1);};
  box.querySelector('#mark').onclick=()=>{commit(); R.status[R.cur]=R.ans[R.cur]!=null?'amr':'mr'; move(R.cur+1);};
  box.querySelector('#clear').onclick=()=>{R.ans[R.cur]=null; R.draft[R.cur]=null; R.status[R.cur]='na'; renderTQ(); renderPal();};
  box.querySelector('#prev').onclick=()=>move(R.cur-1);
  typeset(box); box.scrollTop=0;
}
function move(i){const R=TEST.run; R.draft[R.cur]=null; if(i<0) i=0; if(i>=R.items.length){renderPal(); askSubmit(); return;} R.cur=i; if(R.status[i]==='nv') R.status[i]='na'; renderTQ(); renderPal(); view.querySelector('#pal').classList.remove('show'); window.scrollTo({top:0,behavior:'smooth'});}
const ST={nv:'Not visited',na:'Not answered',a:'Answered',mr:'Marked for review',amr:'Answered & marked'};
function renderPal(){
  const R=TEST.run, c={nv:0,na:0,a:0,mr:0,amr:0}; R.status.forEach(s=>c[s]++);
  view.querySelector('#pal').innerHTML=`<div class="eyebrow">Question palette</div>
    <div class="pgrid">${R.items.map((it,i)=>`<button class="pq s-${R.status[i]} ${i===R.cur?'cur':''}" data-i="${i}" aria-label="Question ${i+1}, ${ST[R.status[i]]}">${i+1}</button>`).join('')}</div>
    <div class="legend2">${Object.keys(ST).map(k=>`<span><i class="pq s-${k} mini"></i>${ST[k]} <b>${c[k]}</b></span>`).join('')}</div>
    <button class="reveal" id="submit2">Submit test</button>`;
  view.querySelectorAll('.pq[data-i]').forEach(b=>b.onclick=()=>move(+b.dataset.i));
  view.querySelector('#submit2').onclick=askSubmit;
}
function askSubmit(){
  const R=TEST.run, m=view.querySelector('#tmodal'); const c={nv:0,na:0,a:0,mr:0,amr:0}; R.status.forEach(s=>c[s]++);
  m.hidden=false; m.innerHTML=`<div class="tbox"><h3>Submit the test?</h3><p>Answered <b>${c.a+c.amr}</b> · Not answered <b>${c.na+c.nv}</b> · Marked without answer <b>${c.mr}</b>. Time left <b>${fmt((R.deadline-Date.now())/1000)}</b>.</p><p class="note">Questions marked for review with a saved answer are evaluated.</p><div class="tact"><button class="back" id="cancel">Keep working</button><span class="sp"></span><button class="reveal" id="confirm" style="width:auto;height:44px;margin:0;padding:0 20px">Submit</button></div></div>`;
  m.querySelector('#cancel').onclick=()=>{m.hidden=true;}; m.querySelector('#confirm').onclick=finish;
}
function evalItem(it,a){
  if(a==null) return {res:'un',marks:0};
  if(it.kind==='num'){const v=parseFloat(String(a).replace('−','-')); return Math.abs(v-it.value)<0.01?{res:'c',marks:4}:{res:'w',marks:-1};}
  if(it.kind==='single') return a===it.correct[0]?{res:'c',marks:4}:{res:'w',marks:-1};
  const sel=new Set(a), cor=new Set(it.correct); if([...sel].some(k=>!cor.has(k))) return {res:'w',marks:-2};
  if(sel.size===cor.size) return {res:'c',marks:4}; return {res:'p',marks:sel.size};
}
function finish(){
  const R=TEST.run; if(!R||R.done) return; R.done=true; clearInterval(tick);
  const rows=R.items.map((it,i)=>({it,a:R.ans[i],t:R.time[i],...evalItem(it,R.ans[i])}));
  TEST.result={rows,mins:R.mins,diff:R.diff,used:Math.min(R.mins*60,(Date.now()-R.started)/1000)};
  go('#/test/result');
}
function showAns(it,a){
  if(a==null) return '<i>Not answered</i>';
  if(it.kind==='num') return esc(a);
  const ks=Array.isArray(a)?a:[a]; return ks.map(k=>`(${k.toUpperCase()}) ${it.options.find(o=>o.key===k)?.html||''}`).join('<br>');
}
function corrAns(it){ if(it.kind==='num') return esc(it.value); return it.correct.map(k=>`(${k.toUpperCase()}) ${it.options.find(o=>o.key===k)?.html||''}`).join('<br>'); }
function renderResult(){
  document.body.classList.remove('testing');
  const Rs=TEST.result; if(!Rs){go('#/test');return;}
  const rows=Rs.rows, n=rows.length, max=4*n, score=rows.reduce((s,r)=>s+r.marks,0);
  const cnt=k=>rows.filter(r=>r.res===k).length, att=n-cnt('un');
  const acc=att?Math.round(cnt('c')/att*100):0;
  const group=(keyf)=>{const m={};rows.forEach(r=>{const k=keyf(r);(m[k]||(m[k]={c:0,p:0,w:0,un:0,marks:0,n:0,t:0}));m[k][r.res]++;m[k].marks+=r.marks;m[k].n++;m[k].t+=r.t;});return m;};
  const bars=(m,colorf)=>Object.entries(m).map(([k,v])=>`<div class="brow"><div class="bl"><span>${colorf?`<b style="background:${colorf(k)}"></b>`:''}${esc(k)}</span><small>${v.marks>0?'+':''}${v.marks} / ${4*v.n} · ${fmt(v.t)}</small></div><div class="bar">${['c','p','w','un'].map(s=>v[s]?`<i class="r-${s}" style="flex:${v[s]}" title="${v[s]}"></i>`:'').join('')}</div></div>`).join('');
  const byLvl=group(r=>L(r.it.q.difficulty).name), byTop=group(r=>(r.it.q.topics||['Other'])[0]), byCh=group(r=>r.it.q._ch);
  const maxT=Math.max(...rows.map(r=>r.t),1);
  const verdict=score/max>=.75?'Excellent work':score/max>=.5?'Solid attempt':score/max>=.25?'Room to grow':'Keep practising';
  view.innerHTML=`
  <div class="chhead"><button class="back" id="back">← Home</button>
    <div class="eyebrow" style="margin-top:28px">Test analysis · level ${Rs.diff}/10</div><h2>${verdict}</h2>
    <p>${n} questions · time used ${fmt(Rs.used)} of ${Rs.mins}:00</p></div>
  <div class="rgrid">
    <div class="card big"><div class="eyebrow">Score</div><div class="score">${score}<small> / ${max}</small></div><div class="dist" style="height:8px;margin-top:14px"><i style="--c:var(--d1);flex:${Math.max(score,0)}"></i><i style="--c:var(--line);flex:${max-Math.max(score,0)}"></i></div></div>
    <div class="card kp"><div><b>${cnt('c')}</b><span>Correct</span></div><div><b>${cnt('p')}</b><span>Partial</span></div><div><b>${cnt('w')}</b><span>Incorrect</span></div><div><b>${cnt('un')}</b><span>Unattempted</span></div><div><b>${acc}%</b><span>Accuracy</span></div><div><b>${fmt(Rs.used/n)}</b><span>Avg time / Q</span></div></div>
  </div>
  <div class="rkey"><span><i class="r-c"></i>Correct</span><span><i class="r-p"></i>Partial</span><span><i class="r-w"></i>Incorrect</span><span><i class="r-un"></i>Unattempted</span></div>
  <div class="rgrid">
    <div class="card"><div class="eyebrow">By difficulty</div>${bars(byLvl,k=>LEVELS.find(l=>l.name===k).c)}</div>
    <div class="card"><div class="eyebrow">By chapter</div>${bars(byCh)}</div>
    <div class="card" style="grid-column:1/-1"><div class="eyebrow">By topic</div>${bars(byTop)}</div>
    <div class="card" style="grid-column:1/-1"><div class="eyebrow">Time per question</div><div class="tchart">${rows.map((r,i)=>`<div class="tc" title="Q${i+1}: ${fmt(r.t)}"><i class="r-${r.res}" style="height:${Math.max(4,r.t/maxT*100)}%"></i><span>${i+1}</span></div>`).join('')}</div></div>
  </div>
  <div class="eyebrow" style="margin:34px 0 12px">Question review</div>
  <div class="review">${rows.map((r,i)=>{const it=r.it,l=L(it.q.difficulty),sol=it.q.solution||{};const lab={c:'Correct',p:'Partially correct',w:'Incorrect',un:'Unattempted'}[r.res];
    return `<details class="rv-q" style="--c:${l.c}"><summary><span class="rq-n">Q${i+1}</span><span class="rq-tag r-${r.res}t">${lab}</span><span class="rq-m">${r.marks>0?'+':''}${r.marks}</span><span class="rq-meta">${esc(it.q._ch)} · ${l.name} · ${fmt(r.t)}</span></summary>
      <div class="rq-b"><div class="qfull">${it.stem}</div>
        ${it.kind!=='num'?`<div class="topts rvw">${it.options.map(o=>{const mine=Array.isArray(r.a)?r.a.includes(o.key):r.a===o.key, ok=it.correct.includes(o.key);return `<div class="topt ${ok?'good':''} ${mine&&!ok?'bad':''}"><span class="ok">${o.key.toUpperCase()}</span><span class="ot">${o.html}</span>${mine?'<em>Your choice</em>':''}</div>`}).join('')}</div>`:`<p>Your answer: <b>${showAns(it,r.a)}</b> · Correct: <b>${corrAns(it)}</b></p>`}
        <div class="sol"><h3>Solution</h3><ol class="steps">${(sol.steps||[]).map((s,j)=>`<li style="--i:${j}">${s.title?`<strong class="st">${s.title}</strong>`:''}<div>${s.text}</div></li>`).join('')}</ol>
        ${sol.tip?`<div class="tip"><span>Key tip</span><div>${sol.tip}</div></div>`:''}${sol.diagram?`<figure class="diagram">${sol.diagram}</figure>`:''}
        <div class="answer"><span>Answer</span><div>${sol.answer||corrAns(it)}</div></div></div>
        <button class="link" data-open="${esc(it.q._cid)}|${esc(it.q.id)}">Open in ${esc(it.q._ch)} →</button></div></details>`}).join('')}</div>
  <div class="tact" style="margin-top:28px"><button class="back" id="newt">New test</button><span class="sp"></span><button class="reveal" id="again" style="width:auto;padding:0 22px;margin:0">Retake with same settings</button></div>`;
  view.querySelector('#back').onclick=()=>go('#/');
  view.querySelector('#newt').onclick=()=>go('#/test');
  view.querySelector('#again').onclick=()=>{const cfg=TEST.cfg; const items=buildTest(cfg); const n=items.length; TEST.run={items,cur:0,ans:Array(n).fill(null),draft:Array(n).fill(null),status:Array(n).fill('nv'),time:Array(n).fill(0),deadline:Date.now()+cfg.mins*60000,mins:cfg.mins,diff:cfg.diff,done:false,started:Date.now()}; TEST.run.status[0]='na'; go('#/test/run');};
  view.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const [c,q]=b.dataset.open.split('|'); go(`#/ch/${encodeURIComponent(c)}/q/${encodeURIComponent(q)}`);});
  view.querySelectorAll('.rv-q').forEach(d=>d.addEventListener('toggle',()=>{if(d.open&&!d._ts){d._ts=1;typeset(d);}}));
}

/* ROUTER */
let last=null;
const swap=fn=>{view.style.animation='none'; void view.offsetWidth; view.style.animation=''; fn(); window.scrollTo({top:0});};
function route(){
  const p=location.hash.replace(/^#\/?/,'').split('/').map(decodeURIComponent);
  if(p[0]==='test'){ closeQuestion(); const key='test'+(p[1]||''); last=key;
    if(p[1]==='run') swap(renderTestRun); else if(p[1]==='result') swap(renderResult); else swap(renderTestSetup); return; }
  document.body.classList.remove('testing');
  if((p[0]==='ch'&&p[1])||p[0]==='all'){ const ch=p[0]==='all'?ALL:chapters.find(c=>c.id===p[1]); if(!ch){go('#/');return;}
    const r=p[0]==='all'?p.slice(1):p.slice(2);
    if(last!==ch.id){swap(()=>renderChapter(ch)); last=ch.id;}
    if(r[0]==='q'&&r[1]) openQuestion(ch,r[1]); else closeQuestion();
  } else { closeQuestion(); if(last!=='__home'){swap(renderHome); last='__home';} }
}
window.addEventListener('hashchange',route); route();
})();
</script>
</body>
