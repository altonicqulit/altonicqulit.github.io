<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Apps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #050714;
    --ink: #E8ECFF;
    --mute: #8A93B8;
    --line: rgba(160, 175, 255, 0.14);
    --ease: cubic-bezier(.7, 0, .2, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: 100%; }
  body {
    min-height: 100%;
    background: var(--void);
    color: var(--ink);
    font-family: Manrope, system-ui, sans-serif;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Background: nebula clouds + deep space canvas ---------- */
  .aurora { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .blob {
    position: absolute; border-radius: 50%;
    filter: blur(110px); opacity: .3; mix-blend-mode: screen;
    animation: pulse 14s ease-in-out infinite, drift 40s ease-in-out infinite alternate;
  }
  .b1 { width: 62vmax; height: 62vmax; left: -20vmax; top: -24vmax; background: #1F5CFF; }
  .b2 { width: 50vmax; height: 50vmax; right: -16vmax; top: 6vh;    background: #8B3DFF; animation-delay: -5s, -12s; }
  .b3 { width: 46vmax; height: 46vmax; left: 22vw; bottom: -28vmax; background: #00B4C7; animation-delay: -9s, -22s; }
  .b4 { width: 34vmax; height: 34vmax; right: 8vw; bottom: 4vh;     background: #FF3D8B; opacity: .16; animation-delay: -3s, -30s; }
  @keyframes pulse {
    0%, 100% { opacity: .16; transform: scale(1); }
    50%      { opacity: .34; transform: scale(1.14); }
  }
  @keyframes drift {
    from { translate: 0 0; }
    to   { translate: 7vw -5vh; }
  }
  #field { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  .vignette {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 38%, rgba(2, 3, 10, .8) 100%);
  }

  /* ---------- Layout ---------- */
  main {
    position: relative; z-index: 3;
    max-width: 1100px; margin: 0 auto;
    padding: max(12vh, 72px) clamp(20px, 5vw, 48px) 64px;
    padding-top: calc(max(12vh, 72px) + env(safe-area-inset-top, 0px));
    padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px));
    min-height: 100vh; display: flex; flex-direction: column;
  }
  h1 {
    font-family: Unbounded, sans-serif; font-weight: 700;
    font-size: clamp(44px, 11vw, 132px); line-height: .95; letter-spacing: -.03em;
    background: linear-gradient(100deg, #FFFFFF 20%, #A9C4FF 55%, #C79BFF 90%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 28px rgba(120, 140, 255, .35));
  }
  .sub {
    margin-top: 20px; max-width: 46ch;
    color: var(--mute); font-size: clamp(15px, 1.6vw, 18px); line-height: 1.6;
    opacity: 0; animation: fadeIn 1s .9s forwards;
  }
  @keyframes fadeIn { to { opacity: 1; } }

  /* ---------- App rows ---------- */
  .apps { list-style: none; margin-top: clamp(48px, 9vh, 96px); border-bottom: 1px solid var(--line); }
  .app {
    --h: 200;
    position: relative; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 24px;
    padding: clamp(22px, 3.5vw, 36px) clamp(8px, 2vw, 20px);
    border-top: 1px solid var(--line);
    color: inherit; text-decoration: none; overflow: hidden; outline: none;
    clip-path: inset(0 100% 0 0);
    animation: wipe 1.1s var(--ease) forwards;
    transition: opacity .5s var(--ease), filter .5s var(--ease), transform .6s var(--ease);
    backdrop-filter: blur(2px);
  }
  @keyframes wipe { to { clip-path: inset(0 0 0 0); } }

  /* cursor spotlight */
  .app::before {
    content: ""; position: absolute; inset: 0; z-index: -1; opacity: 0;
    background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 50%), hsla(var(--h), 100%, 60%, .18), transparent 60%);
    transition: opacity .4s;
  }
  /* glowing scan line */
  .app::after {
    content: ""; position: absolute; left: 0; top: -1px; height: 2px; width: 100%;
    background: linear-gradient(90deg, transparent, hsl(var(--h), 100%, 65%), transparent);
    box-shadow: 0 0 16px hsl(var(--h), 100%, 60%);
    transform: scaleX(0); transform-origin: left; transition: transform .7s var(--ease);
  }
  .app:hover::before, .app:focus-visible::before { opacity: 1; }
  .app:hover::after, .app:focus-visible::after { transform: scaleX(1); }

  .app-name {
    display: block;
    font-family: Unbounded, sans-serif; font-weight: 300;
    font-size: clamp(28px, 6.2vw, 76px); line-height: 1; letter-spacing: -.02em;
    transition: transform .6s var(--ease), letter-spacing .6s var(--ease), color .4s, text-shadow .4s;
  }
  .app:hover .app-name, .app:focus-visible .app-name {
    color: hsl(var(--h), 100%, 78%);
    text-shadow: 0 0 24px hsla(var(--h), 100%, 60%, .7), 0 0 60px hsla(var(--h), 100%, 50%, .4);
    transform: translateX(14px); letter-spacing: .01em;
  }
  .app-desc { display: block; margin-top: 12px; color: var(--mute); font-size: 15px; line-height: 1.5; max-width: 52ch; }
  .app-note { color: hsl(var(--h), 70%, 70%); }

  .ring { width: clamp(44px, 6vw, 64px); height: auto; flex-shrink: 0; overflow: visible; }
  .ring .orbit { fill: none; stroke: hsla(var(--h), 100%, 70%, .5); stroke-width: 1.2; stroke-dasharray: 3 6; transform-origin: center; animation: spin 14s linear infinite; }
  .ring .core { fill: hsl(var(--h), 100%, 70%); transform-origin: center; transform: scale(.35); transition: transform .5s var(--ease), filter .5s; }
  .app:hover .ring .orbit, .app:focus-visible .ring .orbit { animation-duration: 2.5s; stroke: hsl(var(--h), 100%, 72%); }
  .app:hover .ring .core, .app:focus-visible .ring .core { transform: scale(1); filter: drop-shadow(0 0 8px hsl(var(--h), 100%, 60%)); }
  @keyframes spin { to { transform: rotate(360deg); } }

  .app:focus-visible { box-shadow: inset 0 0 0 2px hsl(var(--h), 100%, 70%); border-radius: 6px; }

  footer { margin-top: auto; padding-top: 56px; color: var(--mute); font-size: 13px; opacity: .7; }

  /* ---------- Launch transition ---------- */
  body.launching .app:not(.chosen) { opacity: 0; filter: blur(10px); transform: translateX(-60px) scale(.96); }
  body.launching h1, body.launching .sub, body.launching footer { opacity: 0; filter: blur(8px); transition: all .5s var(--ease); }
  .app.chosen .app-name { transform: translateX(14px) scale(1.06); }

  .portal {
    position: fixed; inset: 0; z-index: 50; pointer-events: none;
    background:
      radial-gradient(circle at var(--x) var(--y), hsl(var(--h), 100%, 82%) 0%, hsl(var(--h), 95%, 55%) 18%, hsl(var(--h), 80%, 22%) 48%, var(--void) 80%);
    clip-path: circle(0 at var(--x) var(--y));
    transition: clip-path .9s var(--ease) .15s;
  }
  .portal.on { clip-path: circle(160vmax at var(--x) var(--y)); }
  .portal-name {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px;
    font-family: Unbounded, sans-serif; font-weight: 700;
    font-size: clamp(36px, 10vw, 140px); color: #fff;
    text-shadow: 0 0 40px hsla(var(--h), 100%, 70%, .9);
    opacity: 0; transform: scale(.7); letter-spacing: .4em; filter: blur(12px);
    transition: all .8s var(--ease) .45s;
  }
  .portal.on .portal-name { opacity: 1; transform: scale(1); letter-spacing: -.02em; filter: blur(0); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .app { clip-path: none; }
    .sub { opacity: 1; }
  }
</style>
</head>
<body>

<div class="aurora" aria-hidden="true">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
</div>
<canvas id="field" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>

<main>
  <h1 id="title" data-text="My apps">My apps</h1>
  <p class="sub">Different apps to help with JEE prep and more</p>

  <ul class="apps" id="apps"></ul>

  <footer>Apps update here automatically. If something looks out of date, refresh the page.</footer>
</main>

<div class="portal" id="portal" aria-hidden="true"><div class="portal-name" id="portalName"></div></div>

<script>
/* =========================================================
   EDIT YOUR APPS HERE
   name: shown on the page
   desc: one line about what it does
   href: folder name for apps in this repo ("math-atlas/"),
         or a full link for apps hosted elsewhere
   hue:  glow colour, 0–360 (190 cyan, 275 violet, 330 pink,
         150 green, 38 amber)
   note: optional small extra line
   ========================================================= */
const APPS = [
  { name: "Kinetix",    desc: "Probelms from Physics Tutorials and other places", href: "phy_problem_book", hue: 190 },
  { name: "Math Atlas", desc: "Collection of questions for Math",                 href: "math_atlas",       hue: 275 },
  { name: "Atom Map",   desc: "The ultimate mind map for chemistry",              href: "ult_mind_map",     hue: 275 },
  // { name: "New app", desc: "What it does.", href: "new-app/", hue: 330 },
];

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- Build the list ---------- */
const list = document.getElementById("apps");
APPS.forEach((app, i) => {
  const li = document.createElement("li");
  const a = document.createElement("a");
  a.className = "app";
  a.href = app.href;
  a.style.setProperty("--h", app.hue);
  a.style.animationDelay = (0.5 + i * 0.15) + "s";
  a.innerHTML = `
    <span>
      <span class="app-name"></span>
      <span class="app-desc"></span>
    </span>
    <svg class="ring" viewBox="0 0 64 64" aria-hidden="true">
      <circle class="orbit" cx="32" cy="32" r="28"/>
      <circle class="core" cx="32" cy="32" r="9"/>
    </svg>`;
  a.querySelector(".app-name").textContent = app.name;
  const desc = a.querySelector(".app-desc");
  desc.textContent = app.desc;
  if (app.note) {
    const n = document.createElement("span");
    n.className = "app-note";
    n.textContent = " " + app.note + ".";
    desc.appendChild(n);
  }
  a.addEventListener("pointermove", e => {
    const r = a.getBoundingClientRect();
    a.style.setProperty("--mx", (e.clientX - r.left) + "px");
    a.style.setProperty("--my", (e.clientY - r.top) + "px");
  });
  a.addEventListener("click", e => launch(e, app, a));
  li.appendChild(a);
  list.appendChild(li);
});

/* ---------- Title decode effect ---------- */
(function scramble() {
  const el = document.getElementById("title");
  const final = el.dataset.text;
  el.setAttribute("aria-label", final);
  if (reduce) return;
  const glyphs = "∑∫∞∂πλΔΩ01ABCDEFGHJKLMNPRSTUVXYZ";
  let frame = 0;
  const total = final.length * 4 + 12;
  (function tick() {
    let out = "";
    for (let i = 0; i < final.length; i++) {
      const lock = i * 4 + 12;
      out += (frame >= lock || final[i] === " ") ? final[i] : glyphs[Math.floor(Math.random() * glyphs.length)];
    }
    el.textContent = out;
    if (++frame <= total) requestAnimationFrame(tick);
  })();
})();

/* =========================================================
   DEEP SPACE
   A parallax starfield, drifting asteroids, the occasional
   rocket, and now and then a stranded astronaut.
   Tune the numbers in SPACE below.
   ========================================================= */
const SPACE = {
  stars:        260,   // how many stars
  asteroidEvery: [7, 16],   // seconds between asteroids (min, max)
  maxAsteroids:  4,
  rocketEvery:  [34, 70],   // seconds between rockets
  astronautEvery: [50, 110] // seconds between astronauts
};

const cv = document.getElementById("field");
const cx = cv.getContext("2d");
let W, H, warp = 0, mouseX = 0, mouseY = 0, last = 0;

function size() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W + "px"; cv.style.height = H + "px";
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
size();
addEventListener("resize", size);
addEventListener("pointermove", e => { mouseX = e.clientX / W - .5; mouseY = e.clientY / H - .5; });

const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

/* ---------- stars (three parallax depths) ---------- */
const stars = Array.from({ length: SPACE.stars }, () => {
  const depth = Math.random();
  return {
    x: Math.random(), y: Math.random(),
    z: depth,                                   // 0 = far, 1 = near
    r: .4 + depth * 1.5,
    tw: Math.random() * Math.PI * 2,            // twinkle phase
    tws: rnd(.6, 2.2),
    hue: pick([210, 210, 210, 196, 44, 280]),   // mostly white-blue, a few warm
    sat: Math.random() < .25 ? 60 : 12
  };
});
// warp coordinates, used only during the launch animation
const warpStars = Array.from({ length: 140 }, () => ({
  x: Math.random() * 2 - 1, y: Math.random() * 2 - 1, z: Math.random() * .9 + .1
}));

function drawStars(t) {
  const px = mouseX * 26, py = mouseY * 26;
  for (const s of stars) {
    const sx = s.x * W - px * s.z, sy = s.y * H - py * s.z;
    const flicker = .55 + .45 * Math.sin(t * s.tws + s.tw);
    const a = (.25 + s.z * .7) * flicker;
    cx.fillStyle = `hsla(${s.hue}, ${s.sat}%, 88%, ${a})`;
    cx.beginPath(); cx.arc(sx, sy, s.r, 0, 7); cx.fill();
    if (s.z > .82) {                              // brightest few get a glow + cross flare
      cx.fillStyle = `hsla(${s.hue}, ${s.sat}%, 80%, ${a * .18})`;
      cx.beginPath(); cx.arc(sx, sy, s.r * 5, 0, 7); cx.fill();
    }
  }
}
function drawWarp() {
  const cxm = W / 2, cym = H / 2;
  for (const s of warpStars) {
    s.z -= .028;
    if (s.z <= .02) { s.x = Math.random() * 2 - 1; s.y = Math.random() * 2 - 1; s.z = 1; }
    const sx = cxm + (s.x / s.z) * W * .5, sy = cym + (s.y / s.z) * H * .5;
    const pz = s.z + .22;
    const tx = cxm + (s.x / pz) * W * .5, ty = cym + (s.y / pz) * H * .5;
    cx.strokeStyle = `rgba(200, 218, 255, ${Math.min(1, (1 - s.z) * 1.5) * .8})`;
    cx.lineWidth = 1.5;
    cx.beginPath(); cx.moveTo(tx, ty); cx.lineTo(sx, sy); cx.stroke();
  }
}

/* ---------- drifting things ---------- */
const drifters = [];

// a path that enters from one edge and leaves by the other side
function entry(margin = 140) {
  const side = Math.floor(Math.random() * 4);
  if (side === 0) return { x: -margin,     y: rnd(0, H),  vx:  1, vy: rnd(-.35, .35) };
  if (side === 1) return { x: W + margin,  y: rnd(0, H),  vx: -1, vy: rnd(-.35, .35) };
  if (side === 2) return { x: rnd(0, W),   y: -margin,    vx: rnd(-.35, .35), vy:  1 };
  return                 { x: rnd(0, W),   y: H + margin, vx: rnd(-.35, .35), vy: -1 };
}

function spawnAsteroid() {
  const e = entry();
  const r = rnd(9, 42);
  const n = 9 + Math.floor(Math.random() * 5);
  const shape = Array.from({ length: n }, (_, i) => {
    const a = i / n * Math.PI * 2;
    const rad = r * rnd(.68, 1.18);
    return [Math.cos(a) * rad, Math.sin(a) * rad];
  });
  const craters = Array.from({ length: 2 + Math.floor(Math.random() * 3) }, () => ({
    x: rnd(-r * .5, r * .5), y: rnd(-r * .5, r * .5), r: rnd(r * .1, r * .26)
  }));
  const sp = rnd(7, 22) / (r > 26 ? 1.8 : 1);       // big rocks drift slower
  drifters.push({
    kind: "asteroid", x: e.x, y: e.y, vx: e.vx * sp, vy: e.vy * sp,
    r, shape, craters, rot: Math.random() * 7, spin: rnd(-.25, .25),
    depth: rnd(.35, 1), fade: 0
  });
}

function spawnRocket() {
  const dir = Math.random() < .5 ? 1 : -1;
  const y = rnd(H * .12, H * .88);
  const tilt = rnd(-.16, .16);
  drifters.push({
    kind: "rocket",
    x: dir === 1 ? -180 : W + 180, y,
    vx: dir * rnd(120, 210), vy: tilt * 40,
    ang: dir === 1 ? tilt : Math.PI - tilt,
    scale: rnd(.7, 1.15), puffs: [], t: 0, fade: 0
  });
}

function spawnAstronaut() {
  const e = entry(120);
  const sp = rnd(10, 26);
  drifters.push({
    kind: "astronaut", x: e.x, y: e.y, vx: e.vx * sp, vy: e.vy * sp,
    rot: Math.random() * 7, spin: rnd(-.5, .5), scale: rnd(.55, 1),
    t: Math.random() * 10, fade: 0
  });
}

/* ---------- renderers ---------- */
function drawAsteroid(o) {
  cx.save();
  cx.translate(o.x, o.y); cx.rotate(o.rot);
  const g = cx.createLinearGradient(-o.r, -o.r, o.r, o.r);
  g.addColorStop(0, `rgba(118, 126, 158, ${.95 * o.fade})`);
  g.addColorStop(1, `rgba(34, 38, 60, ${.95 * o.fade})`);
  cx.fillStyle = g;
  cx.beginPath();
  o.shape.forEach(([px, py], i) => i ? cx.lineTo(px, py) : cx.moveTo(px, py));
  cx.closePath(); cx.fill();
  cx.strokeStyle = `rgba(175, 195, 255, ${.3 * o.fade})`;
  cx.lineWidth = 1; cx.stroke();
  cx.fillStyle = `rgba(16, 19, 34, ${.5 * o.fade})`;
  o.craters.forEach(c => { cx.beginPath(); cx.arc(c.x, c.y, c.r, 0, 7); cx.fill(); });
  cx.restore();
}

function drawRocket(o) {
  // exhaust puffs trailing behind
  cx.save();
  o.puffs.forEach(p => {
    cx.fillStyle = `rgba(150, 170, 255, ${p.life * .16 * o.fade})`;
    cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 7); cx.fill();
  });
  cx.restore();

  cx.save();
  cx.translate(o.x, o.y); cx.rotate(o.ang); cx.scale(o.scale, o.scale);
  cx.globalAlpha = o.fade;

  // flame
  const flick = .75 + Math.sin(o.t * 30) * .25;
  const fl = cx.createLinearGradient(-24, 0, -64 * flick, 0);
  fl.addColorStop(0, "rgba(255, 236, 170, .95)");
  fl.addColorStop(.45, "rgba(255, 138, 60, .7)");
  fl.addColorStop(1, "rgba(255, 60, 40, 0)");
  cx.fillStyle = fl;
  cx.beginPath();
  cx.moveTo(-22, -7); cx.quadraticCurveTo(-52 * flick, 0, -22, 7); cx.closePath(); cx.fill();

  // fins
  cx.fillStyle = "#C8406A";
  cx.beginPath(); cx.moveTo(-18, -6); cx.lineTo(-30, -17); cx.lineTo(-10, -9); cx.closePath(); cx.fill();
  cx.beginPath(); cx.moveTo(-18, 6);  cx.lineTo(-30, 17);  cx.lineTo(-10, 9);  cx.closePath(); cx.fill();

  // body
  const bg = cx.createLinearGradient(0, -10, 0, 10);
  bg.addColorStop(0, "#FDFEFF"); bg.addColorStop(.55, "#D3DCF2"); bg.addColorStop(1, "#8B97BC");
  cx.fillStyle = bg;
  cx.beginPath();
  cx.moveTo(34, 0); cx.quadraticCurveTo(16, -11, -20, -9);
  cx.lineTo(-20, 9); cx.quadraticCurveTo(16, 11, 34, 0); cx.closePath(); cx.fill();

  // nose + window
  cx.fillStyle = "#E0556F";
  cx.beginPath(); cx.moveTo(34, 0); cx.quadraticCurveTo(20, -8, 14, -7);
  cx.lineTo(14, 7); cx.quadraticCurveTo(20, 8, 34, 0); cx.closePath(); cx.fill();
  cx.fillStyle = "#6FE7FF";
  cx.beginPath(); cx.arc(2, 0, 4.4, 0, 7); cx.fill();
  cx.strokeStyle = "rgba(255,255,255,.75)"; cx.lineWidth = 1.2; cx.stroke();
  cx.restore();
}

function drawAstronaut(o) {
  cx.save();
  cx.translate(o.x, o.y); cx.rotate(o.rot); cx.scale(o.scale, o.scale);
  cx.globalAlpha = o.fade;

  // tether, drifting loosely behind
  cx.strokeStyle = "rgba(190, 205, 255, .35)"; cx.lineWidth = 1.4;
  cx.beginPath(); cx.moveTo(-6, 12);
  for (let i = 1; i <= 5; i++) {
    cx.lineTo(-6 - i * 11, 12 + Math.sin(o.t * 1.6 + i * .9) * 7);
  }
  cx.stroke();

  const suit = "#EEF2FF", shade = "rgba(120,135,175,.9)";
  // backpack
  cx.fillStyle = shade;
  cx.fillRect(-13, -9, 9, 20);
  // limbs
  cx.strokeStyle = suit; cx.lineWidth = 7; cx.lineCap = "round";
  cx.beginPath();
  cx.moveTo(-2, -2); cx.lineTo(13, -11);     // arm up
  cx.moveTo(-2, 3);  cx.lineTo(11, 12);      // arm out
  cx.moveTo(-2, 8);  cx.lineTo(6, 23);       // leg
  cx.moveTo(-4, 8);  cx.lineTo(-10, 23);     // leg
  cx.stroke();
  // torso
  cx.fillStyle = suit;
  cx.beginPath(); cx.roundRect(-9, -8, 15, 19, 6); cx.fill();
  cx.fillStyle = "rgba(255,120,150,.9)";
  cx.fillRect(-7, -3, 10, 2.5);
  // helmet
  cx.fillStyle = suit;
  cx.beginPath(); cx.arc(-1, -14, 10, 0, 7); cx.fill();
  const vis = cx.createLinearGradient(-9, -20, 7, -8);
  vis.addColorStop(0, "#0A1030"); vis.addColorStop(.6, "#1B3C86"); vis.addColorStop(1, "#7FE3FF");
  cx.fillStyle = vis;
  cx.beginPath(); cx.arc(0, -14, 7, 0, 7); cx.fill();
  cx.fillStyle = "rgba(255,255,255,.55)";
  cx.beginPath(); cx.ellipse(-2.5, -16.5, 2.6, 1.6, -.5, 0, 7); cx.fill();
  cx.restore();
}

/* ---------- timers ---------- */
let tAst = rnd(2, 6), tRocket = rnd(10, 25), tMan = rnd(18, 40);

function updateDrifters(dt, t) {
  tAst -= dt; tRocket -= dt; tMan -= dt;
  if (tAst <= 0) {
    if (drifters.filter(d => d.kind === "asteroid").length < SPACE.maxAsteroids) spawnAsteroid();
    tAst = rnd(...SPACE.asteroidEvery);
  }
  if (tRocket <= 0) { spawnRocket(); tRocket = rnd(...SPACE.rocketEvery); }
  if (tMan <= 0)    { spawnAstronaut(); tMan = rnd(...SPACE.astronautEvery); }

  for (let i = drifters.length - 1; i >= 0; i--) {
    const o = drifters[i];
    o.fade = Math.min(1, o.fade + dt * 1.2);
    o.t = (o.t || 0) + dt;
    o.x += o.vx * dt; o.y += o.vy * dt;
    if (o.spin !== undefined) o.rot += o.spin * dt;

    if (o.kind === "rocket") {
      o.puffs.push({ x: o.x - Math.cos(o.ang) * 26 * o.scale, y: o.y - Math.sin(o.ang) * 26 * o.scale, r: 4, life: 1 });
      for (const p of o.puffs) { p.life -= dt * .5; p.r += dt * 26; }
      o.puffs = o.puffs.filter(p => p.life > 0);
      if (o.puffs.length > 90) o.puffs.splice(0, o.puffs.length - 90);
    }
    const pad = 260;
    if (o.x < -pad || o.x > W + pad || o.y < -pad || o.y > H + pad) drifters.splice(i, 1);
  }
}

function drawDrifters() {
  // far things first
  const order = { asteroid: 0, astronaut: 1, rocket: 2 };
  [...drifters].sort((a, b) => order[a.kind] - order[b.kind]).forEach(o => {
    cx.save();
    if (o.depth) cx.globalAlpha = .35 + o.depth * .55;
    if (o.kind === "asteroid") drawAsteroid(o);
    else if (o.kind === "rocket") drawRocket(o);
    else drawAstronaut(o);
    cx.restore();
  });
}

function frame(ms) {
  const t = ms / 1000;
  const dt = Math.min(.05, last ? t - last : .016);
  last = t;

  cx.clearRect(0, 0, W, H);
  cx.globalCompositeOperation = "lighter";
  warp > 0 ? drawWarp() : drawStars(t);
  cx.globalCompositeOperation = "source-over";

  if (warp === 0) { updateDrifters(dt, t); drawDrifters(); }
  requestAnimationFrame(frame);
}

if (reduce) {
  // one quiet static frame: stars, a rock and a drifting astronaut
  drawStars(0);
  spawnAsteroid(); spawnAstronaut();
  drifters.forEach(o => { o.fade = 1; o.x = W * rnd(.2, .8); o.y = H * rnd(.2, .8); });
  drawDrifters();
} else {
  requestAnimationFrame(frame);
}

/* ---------- Launch: warp + portal, then open the app ---------- */
const portal = document.getElementById("portal");
const portalName = document.getElementById("portalName");

function launch(e, app, a) {
  if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return; // allow open-in-new-tab
  if (reduce) return;
  e.preventDefault();
  const r = a.getBoundingClientRect();
  const x = e.clientX || (r.left + r.width / 2);
  const y = e.clientY || (r.top + r.height / 2);
  portal.style.setProperty("--x", x + "px");
  portal.style.setProperty("--y", y + "px");
  portal.style.setProperty("--h", app.hue);
  portalName.textContent = app.name;
  a.classList.add("chosen");
  document.body.classList.add("launching");
  warp = 1;
  requestAnimationFrame(() => portal.classList.add("on"));
  setTimeout(() => { location.href = app.href; }, 1250);
}

// Reset if a friend comes back with the browser's back button
addEventListener("pageshow", e => {
  if (!e.persisted) return;
  document.body.classList.remove("launching");
  document.querySelectorAll(".app.chosen").forEach(el => el.classList.remove("chosen"));
  portal.classList.remove("on");
  warp = 0;
  drifters.length = 0;
});
</script>
</body>
