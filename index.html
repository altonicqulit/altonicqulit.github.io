<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Apps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #050714;
    --ink: #E8ECFF;
    --mute: #8A93B8;
    --line: rgba(160, 175, 255, 0.14);
    --ease: cubic-bezier(.7, 0, .2, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: 100%; }
  body {
    min-height: 100%;
    background: var(--void);
    color: var(--ink);
    font-family: Manrope, system-ui, sans-serif;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Background: nebula clouds + deep space canvas ---------- */
  .aurora { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .blob {
    position: absolute; border-radius: 50%;
    filter: blur(110px); opacity: .3; mix-blend-mode: screen;
    animation: pulse 14s ease-in-out infinite, drift 40s ease-in-out infinite alternate;
  }
  .b1 { width: 62vmax; height: 62vmax; left: -20vmax; top: -24vmax; background: #1F5CFF; }
  .b2 { width: 50vmax; height: 50vmax; right: -16vmax; top: 6vh;    background: #8B3DFF; animation-delay: -5s, -12s; }
  .b3 { width: 46vmax; height: 46vmax; left: 22vw; bottom: -28vmax; background: #00B4C7; animation-delay: -9s, -22s; }
  .b4 { width: 34vmax; height: 34vmax; right: 8vw; bottom: 4vh;     background: #FF3D8B; opacity: .16; animation-delay: -3s, -30s; }
  @keyframes pulse {
    0%, 100% { opacity: .16; transform: scale(1); }
    50%      { opacity: .34; transform: scale(1.14); }
  }
  @keyframes drift {
    from { translate: 0 0; }
    to   { translate: 7vw -5vh; }
  }
  #field { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  .vignette {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 38%, rgba(2, 3, 10, .8) 100%);
  }

  /* ---------- Layout ---------- */
  main {
    position: relative; z-index: 3;
    max-width: 1100px; margin: 0 auto;
    padding: max(12vh, 72px) clamp(20px, 5vw, 48px) 64px;
    padding-top: calc(max(12vh, 72px) + env(safe-area-inset-top, 0px));
    padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px));
    min-height: 100vh; display: flex; flex-direction: column;
  }
  h1 {
    font-family: Unbounded, sans-serif; font-weight: 700;
    font-size: clamp(44px, 11vw, 132px); line-height: .95; letter-spacing: -.03em;
    background: linear-gradient(100deg, #FFFFFF 20%, #A9C4FF 55%, #C79BFF 90%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 28px rgba(120, 140, 255, .35));
  }
  .sub {
    margin-top: 20px; max-width: 46ch;
    color: var(--mute); font-size: clamp(15px, 1.6vw, 18px); line-height: 1.6;
    opacity: 0; animation: fadeIn 1s .9s forwards;
  }
  @keyframes fadeIn { to { opacity: 1; } }

  /* ---------- App rows ---------- */
  .apps { list-style: none; margin-top: clamp(48px, 9vh, 96px); border-bottom: 1px solid var(--line); }
  .app {
    --h: 200;
    position: relative;
    padding: clamp(22px, 3.5vw, 36px) clamp(8px, 2vw, 20px);
    border-top: 1px solid var(--line);
    overflow: hidden;
    clip-path: inset(0 100% 0 0);
    animation: wipe 1.1s var(--ease) forwards;
    transition: opacity .5s var(--ease), filter .5s var(--ease), transform .6s var(--ease);
    backdrop-filter: blur(2px);
    transform-origin: center;
  }
  @keyframes wipe { to { clip-path: inset(0 0 0 0); } }

  .trigger {
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 24px;
    width: 100%; padding: 0; background: none; border: none;
    color: inherit; font: inherit; text-align: left; cursor: pointer; outline: none;
  }

  /* cursor spotlight */
  .app::before {
    content: ""; position: absolute; inset: 0; z-index: 0; opacity: 0; pointer-events: none;
    background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 50%), hsla(var(--h), 100%, 60%, .18), transparent 60%);
    transition: opacity .4s;
  }
  /* glowing scan line */
  .app::after {
    content: ""; position: absolute; left: 0; top: -1px; height: 2px; width: 100%; pointer-events: none;
    background: linear-gradient(90deg, transparent, hsl(var(--h), 100%, 65%), transparent);
    box-shadow: 0 0 16px hsl(var(--h), 100%, 60%);
    transform: scaleX(0); transform-origin: left; transition: transform .7s var(--ease);
  }
  .app:hover::before, .app:focus-within::before, .app.asking::before { opacity: 1; }
  .app:hover::after, .app:focus-within::after, .app.asking::after { transform: scaleX(1); }
  .app > * { position: relative; z-index: 1; }

  .app-name {
    display: block;
    font-family: Unbounded, sans-serif; font-weight: 300;
    font-size: clamp(28px, 6.2vw, 76px); line-height: 1; letter-spacing: -.02em;
    transition: transform .6s var(--ease), letter-spacing .6s var(--ease), color .4s, text-shadow .4s;
  }
  .app:hover .app-name, .app:focus-within .app-name, .app.asking .app-name {
    color: hsl(var(--h), 100%, 78%);
    text-shadow: 0 0 24px hsla(var(--h), 100%, 60%, .7), 0 0 60px hsla(var(--h), 100%, 50%, .4);
    transform: translateX(14px); letter-spacing: .01em;
  }
  .app-desc { display: block; margin-top: 12px; color: var(--mute); font-size: 15px; line-height: 1.5; max-width: 52ch; }
  .app-note { color: hsl(var(--h), 70%, 70%); }
  .lock {
    display: inline-flex; align-items: center; gap: 6px; margin-left: 10px;
    font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
    color: hsl(var(--h), 80%, 72%); border: 1px solid hsla(var(--h), 80%, 60%, .4);
    border-radius: 999px; padding: 3px 9px; vertical-align: 3px;
  }

  .ring { width: clamp(44px, 6vw, 64px); height: auto; flex-shrink: 0; overflow: visible; }
  .ring .orbit { fill: none; stroke: hsla(var(--h), 100%, 70%, .5); stroke-width: 1.2; stroke-dasharray: 3 6; transform-origin: center; animation: spin 14s linear infinite; }
  .ring .core { fill: hsl(var(--h), 100%, 70%); transform-origin: center; transform: scale(.35); transition: transform .5s var(--ease), filter .5s; }
  .app:hover .ring .orbit, .app:focus-within .ring .orbit, .app.asking .ring .orbit { animation-duration: 2.5s; stroke: hsl(var(--h), 100%, 72%); }
  .app:hover .ring .core, .app:focus-within .ring .core, .app.asking .ring .core { transform: scale(1); filter: drop-shadow(0 0 8px hsl(var(--h), 100%, 60%)); }
  @keyframes spin { to { transform: rotate(360deg); } }

  .trigger:focus-visible { box-shadow: 0 0 0 2px hsl(var(--h), 100%, 70%); border-radius: 6px; }

  /* ---------- Access code panel ---------- */
  .codebox {
    display: grid; grid-template-rows: 0fr; opacity: 0;
    transition: grid-template-rows .5s var(--ease), opacity .35s var(--ease), margin-top .45s var(--ease);
    margin-top: 0;
  }
  .app.asking .codebox { grid-template-rows: 1fr; opacity: 1; margin-top: 20px; }
  .codebox > .inner { overflow: hidden; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .code {
    background: rgba(255, 255, 255, .05);
    border: 1px solid hsla(var(--h), 90%, 62%, .45);
    color: var(--ink); padding: 11px 15px; border-radius: 10px;
    font: inherit; font-size: 15px; letter-spacing: .22em; text-transform: uppercase;
    width: min(260px, 62vw);
  }
  .code::placeholder { color: var(--mute); letter-spacing: .12em; opacity: .7; }
  .code:focus { outline: none; border-color: hsl(var(--h), 100%, 70%); box-shadow: 0 0 0 3px hsla(var(--h), 100%, 60%, .22); }
  .go {
    font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    padding: 11px 20px; border-radius: 10px; border: none;
    background: hsl(var(--h), 85%, 58%); color: #060810;
    transition: filter .25s, transform .25s var(--ease);
  }
  .go:hover { filter: brightness(1.12); transform: translateY(-1px); }
  .err { flex-basis: 100%; font-size: 13px; color: #FF8AA0; opacity: 0; transition: opacity .3s; }
  .codebox.bad .err { opacity: 1; }
  .codebox.bad .code { border-color: #FF5C7A; animation: shake .5s; }
  @keyframes shake {
    10%, 90% { translate: -2px; } 20%, 80% { translate: 4px; }
    30%, 50%, 70% { translate: -7px; } 40%, 60% { translate: 7px; }
  }

  /* ---------- Launch: crumple into a ball, then the portal ---------- */
  body.launching .app:not(.crumpling) { opacity: 0; filter: blur(10px); transform: translateX(-60px) scale(.96); }
  body.launching h1, body.launching .sub, body.launching footer { opacity: 0; filter: blur(8px); transition: all .5s var(--ease); }

  .app.crumpling {
    z-index: 5; border-color: transparent;
    background: radial-gradient(circle at 50% 50%, hsla(var(--h), 100%, 70%, .3), transparent 70%);
    animation: crumple .95s cubic-bezier(.6, .02, .3, 1) forwards;
  }
  .app.crumpling .trigger, .app.crumpling .codebox {
    opacity: 0; filter: blur(5px); transition: opacity .4s, filter .4s;
  }
  @keyframes crumple {
    0%   { transform: translate(0, 0) scale(1, 1) rotate(0deg); border-radius: 4px; }
    16%  { transform: translate(calc(var(--tx) * .04), calc(var(--ty) * .04)) scale(.97, .8) rotate(-1.5deg); border-radius: 14px; }
    32%  { transform: translate(calc(var(--tx) * .16), calc(var(--ty) * .16)) scale(.74, .5) rotate(3deg);    border-radius: 34px; }
    50%  { transform: translate(calc(var(--tx) * .38), calc(var(--ty) * .38)) scale(.48, .3) rotate(-6deg);   border-radius: 70px; }
    68%  { transform: translate(calc(var(--tx) * .66), calc(var(--ty) * .66)) scale(.26, .18) rotate(10deg);  border-radius: 50%; }
    84%  { transform: translate(calc(var(--tx) * .88), calc(var(--ty) * .88)) scale(.12, .1) rotate(-14deg);  border-radius: 50%; }
    100% { transform: translate(var(--tx), var(--ty)) scale(.035, .03) rotate(22deg); border-radius: 50%; filter: blur(1px); }
  }

  .ball {
    position: fixed; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px;
    border-radius: 50%; z-index: 45; opacity: 0; pointer-events: none;
    background: radial-gradient(circle at 34% 32%, #fff 0%, hsl(var(--h), 100%, 64%) 55%, hsl(var(--h), 90%, 32%) 100%);
    box-shadow: 0 0 34px 8px hsla(var(--h), 100%, 60%, .75);
  }
  .ball.on { animation: ballIn .6s var(--ease) forwards, ballHum 1s .6s ease-in-out infinite; }
  @keyframes ballIn {
    0%   { opacity: 0; transform: scale(.15); }
    50%  { opacity: 1; transform: scale(1.7); }
    75%  { transform: scale(.85); }
    100% { opacity: 1; transform: scale(1.2); }
  }
  @keyframes ballHum {
    0%, 100% { box-shadow: 0 0 34px 8px hsla(var(--h), 100%, 60%, .75); }
    50%      { box-shadow: 0 0 60px 16px hsla(var(--h), 100%, 65%, .95); }
  }

  .portal {
    position: fixed; inset: 0; z-index: 50; pointer-events: none;
    background:
      radial-gradient(circle at var(--x, 50%) var(--y, 50%), hsl(var(--h), 100%, 82%) 0%, hsl(var(--h), 95%, 55%) 18%, hsl(var(--h), 80%, 22%) 48%, var(--void) 80%);
    clip-path: circle(0 at var(--x, 50%) var(--y, 50%));
    transition: clip-path 1s var(--ease);
  }
  .portal.on { clip-path: circle(160vmax at var(--x, 50%) var(--y, 50%)); }
  .portal-name {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px;
    font-family: Unbounded, sans-serif; font-weight: 700;
    font-size: clamp(36px, 10vw, 140px); color: #fff;
    text-shadow: 0 0 40px hsla(var(--h), 100%, 70%, .9);
    opacity: 0; transform: scale(.7); letter-spacing: .4em; filter: blur(12px);
    transition: all .8s var(--ease) .4s;
  }
  .portal.on .portal-name { opacity: 1; transform: scale(1); letter-spacing: -.02em; filter: blur(0); }

  footer { margin-top: auto; padding-top: 56px; color: var(--mute); font-size: 13px; opacity: .7; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .app { clip-path: none; }
    .sub { opacity: 1; }
  }
</style>
</head>
<body>

<div class="aurora" aria-hidden="true">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
</div>
<canvas id="field" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>

<main>
  <h1 id="title" data-text="Leveler">Leveler</h1>
  <p class="sub">Different apps to help with JEE prep and more. Each one needs its access code.</p>

  <ul class="apps" id="apps"></ul>

  <footer>Apps update here automatically. If something looks out of date, refresh the page.</footer>
</main>

<div class="ball" id="ball" aria-hidden="true"></div>
<div class="portal" id="portal" aria-hidden="true"><div class="portal-name" id="portalName"></div></div>

<script>
/* =========================================================
   EDIT YOUR APPS HERE
   name: shown on the page
   desc: one line about what it does
   href: folder name for apps in this repo ("math-atlas/"),
         or a full link for apps hosted elsewhere
   hue:  glow colour, 0–360
         (0 red, 155 emerald, 174 turquoise, 275 violet, 330 pink, 38 amber)
   code: the access code someone must type to get in.
         Case and spaces don't matter.
   note: optional small extra line
   ========================================================= */
const APPS = [
  { name: "Kinetix",    desc: "Probelms from Physics Tutorials and other places", href: "phy_problem_book", hue: 358, code: "IMPULSE" },
  { name: "Math Atlas", desc: "Collection of questions for Math",                 href: "math_atlas",       hue: 155, code: "EULER"   },
  { name: "Atom Map",   desc: "The ultimate mind map for chemistry",              href: "ult_mind_map",     hue: 174, code: "ORBITAL" },
  // { name: "New app", desc: "What it does.", href: "new-app/", hue: 275, code: "SECRET" },
];

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const tidy = s => (s || "").replace(/[\s-]/g, "").toUpperCase();

/* ---------- Build the list ---------- */
const list = document.getElementById("apps");
APPS.forEach((app, i) => {
  const li = document.createElement("li");
  li.className = "app";
  li.style.setProperty("--h", app.hue);
  li.style.animationDelay = (0.5 + i * 0.15) + "s";
  li.innerHTML = `
    <button class="trigger" type="button" aria-expanded="false">
      <span>
        <span class="app-name"></span>
        <span class="app-desc"></span>
      </span>
      <svg class="ring" viewBox="0 0 64 64" aria-hidden="true">
        <circle class="orbit" cx="32" cy="32" r="28"/>
        <circle class="core" cx="32" cy="32" r="9"/>
      </svg>
    </button>
    <div class="codebox">
      <div class="inner">
        <input class="code" type="text" inputmode="text" autocomplete="off" spellcheck="false"
               placeholder="access code" aria-label="Access code">
        <button class="go" type="button">Enter</button>
        <span class="err">That code isn't right. Try again.</span>
      </div>
    </div>`;

  li.querySelector(".app-name").textContent = app.name;
  const desc = li.querySelector(".app-desc");
  desc.textContent = app.desc;
  if (app.note) {
    const n = document.createElement("span");
    n.className = "app-note";
    n.textContent = " " + app.note + ".";
    desc.appendChild(n);
  }
  const lock = document.createElement("span");
  lock.className = "lock";
  lock.textContent = "code";
  desc.appendChild(lock);

  const trigger = li.querySelector(".trigger");
  const box     = li.querySelector(".codebox");
  const input   = li.querySelector(".code");
  const go      = li.querySelector(".go");

  const open = () => {
    document.querySelectorAll(".app.asking").forEach(o => {
      if (o !== li) { o.classList.remove("asking"); o.querySelector(".trigger").setAttribute("aria-expanded", "false"); }
    });
    const was = li.classList.contains("asking");
    li.classList.toggle("asking", !was);
    trigger.setAttribute("aria-expanded", String(!was));
    if (!was) setTimeout(() => input.focus(), 320);
  };

  const check = () => {
    if (tidy(input.value) === tidy(app.code)) {
      box.classList.remove("bad");
      launch(app, li);
    } else {
      box.classList.remove("bad");
      void box.offsetWidth;          // restart the shake
      box.classList.add("bad");
      input.select();
    }
  };

  trigger.addEventListener("click", open);
  go.addEventListener("click", check);
  input.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
  input.addEventListener("input", () => box.classList.remove("bad"));

  li.addEventListener("pointermove", e => {
    const r = li.getBoundingClientRect();
    li.style.setProperty("--mx", (e.clientX - r.left) + "px");
    li.style.setProperty("--my", (e.clientY - r.top) + "px");
  });

  list.appendChild(li);
});

/* ---------- Title decode effect ---------- */
(function scramble() {
  const el = document.getElementById("title");
  const final = el.dataset.text;
  el.setAttribute("aria-label", final);
  if (reduce) return;
  const glyphs = "∑∫∞∂πλΔΩ01ABCDEFGHJKLMNPRSTUVXYZ";
  let frame = 0;
  const total = final.length * 4 + 12;
  (function tick() {
    let out = "";
    for (let i = 0; i < final.length; i++) {
      const lock = i * 4 + 12;
      out += (frame >= lock || final[i] === " ") ? final[i] : glyphs[Math.floor(Math.random() * glyphs.length)];
    }
    el.textContent = out;
    if (++frame <= total) requestAnimationFrame(tick);
  })();
})();

/* =========================================================
   DEEP SPACE
   A parallax starfield, drifting asteroids, the occasional
   rocket, and now and then a stranded astronaut.
   Tune the numbers in SPACE below.
   ========================================================= */
const SPACE = {
  stars:          260,       // how many stars
  asteroidEvery:  [.8, 1.2], // seconds between asteroids (min, max)
  maxAsteroids:   28,
  rocketEvery:    [16, 34],  // seconds between ships
  astronautEvery: [30, 50]   // seconds between astronauts
};

const cv = document.getElementById("field");
const cx = cv.getContext("2d");
let W, H, warp = 0, mouseX = 0, mouseY = 0, last = 0;

function size() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W + "px"; cv.style.height = H + "px";
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
size();
addEventListener("resize", size);
addEventListener("pointermove", e => { mouseX = e.clientX / W - .5; mouseY = e.clientY / H - .5; });

const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

/* ---------- stars (three parallax depths) ---------- */
const stars = Array.from({ length: SPACE.stars }, () => {
  const depth = Math.random();
  return {
    x: Math.random(), y: Math.random(),
    z: depth,
    r: .4 + depth * 1.5,
    tw: Math.random() * Math.PI * 2,
    tws: rnd(.6, 2.2),
    hue: pick([210, 210, 210, 196, 44, 280]),
    sat: Math.random() < .25 ? 60 : 12
  };
});
const warpStars = Array.from({ length: 140 }, () => ({
  x: Math.random() * 2 - 1, y: Math.random() * 2 - 1, z: Math.random() * .9 + .1
}));

function drawStars(t) {
  const px = mouseX * 26, py = mouseY * 26;
  for (const s of stars) {
    const sx = s.x * W - px * s.z, sy = s.y * H - py * s.z;
    const flicker = .55 + .45 * Math.sin(t * s.tws + s.tw);
    const a = (.25 + s.z * .7) * flicker;
    cx.fillStyle = `hsla(${s.hue}, ${s.sat}%, 88%, ${a})`;
    cx.beginPath(); cx.arc(sx, sy, s.r, 0, 7); cx.fill();
    if (s.z > .82) {
      cx.fillStyle = `hsla(${s.hue}, ${s.sat}%, 80%, ${a * .18})`;
      cx.beginPath(); cx.arc(sx, sy, s.r * 5, 0, 7); cx.fill();
    }
  }
}
function drawWarp() {
  const cxm = W / 2, cym = H / 2;
  for (const s of warpStars) {
    s.z -= .028;
    if (s.z <= .02) { s.x = Math.random() * 2 - 1; s.y = Math.random() * 2 - 1; s.z = 1; }
    const sx = cxm + (s.x / s.z) * W * .5, sy = cym + (s.y / s.z) * H * .5;
    const pz = s.z + .22;
    const tx = cxm + (s.x / pz) * W * .5, ty = cym + (s.y / pz) * H * .5;
    cx.strokeStyle = `rgba(200, 218, 255, ${Math.min(1, (1 - s.z) * 1.5) * .8})`;
    cx.lineWidth = 1.5;
    cx.beginPath(); cx.moveTo(tx, ty); cx.lineTo(sx, sy); cx.stroke();
  }
}

/* ---------- drifting things ---------- */
const drifters = [];

function entry(margin = 140) {
  const side = Math.floor(Math.random() * 4);
  if (side === 0) return { x: -margin,     y: rnd(0, H),  vx:  1, vy: rnd(-.35, .35) };
  if (side === 1) return { x: W + margin,  y: rnd(0, H),  vx: -1, vy: rnd(-.35, .35) };
  if (side === 2) return { x: rnd(0, W),   y: -margin,    vx: rnd(-.35, .35), vy:  1 };
  return                 { x: rnd(0, W),   y: H + margin, vx: rnd(-.35, .35), vy: -1 };
}

/* an icosahedron, knocked out of shape, tumbling through depth */
const ICO_V = (() => {
  const t = (1 + Math.sqrt(5)) / 2;
  return [[-1,t,0],[1,t,0],[-1,-t,0],[1,-t,0],[0,-1,t],[0,1,t],
          [0,-1,-t],[0,1,-t],[t,0,-1],[t,0,1],[-t,0,-1],[-t,0,1]];
})();
const ICO_F = [[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],
               [11,10,2],[10,7,6],[7,1,8],[3,9,4],[3,4,2],[3,2,6],[3,6,8],
               [3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];
const FOCAL = 620;   // smaller = stronger perspective

function spawnAsteroid() {
  const r = rnd(104, 361);
  // deform the sphere: every vertex pushed in or out by its own amount
  const verts = ICO_V.map(v => {
    const L = Math.hypot(v[0], v[1], v[2]), k = r * rnd(.62, 1.3) / L;
    return [v[0] * k, v[1] * k, v[2] * k];
  });
  // a heading anywhere on the sphere: up, down, left, right,
  // towards the screen, away from it, or any mix of those
  const th = Math.random() * Math.PI * 2;
  const ph = Math.acos(rnd(-1, 1));
  const sp = rnd(70, 330);
  const dir = [Math.sin(ph) * Math.cos(th), Math.sin(ph) * Math.sin(th), Math.cos(ph)];
  drifters.push({
    kind: "asteroid", verts, r,
    wx: rnd(-W, W) * 1.3, wy: rnd(-H, H) * 1.3, z: rnd(-120, 3400),
    vwx: dir[0] * sp, vwy: dir[1] * sp, vz: dir[2] * sp * 2.4,
    rx: Math.random() * 7, ry: Math.random() * 7, rz: Math.random() * 7,
    sx: rnd(-.5, .5), sy: rnd(-.45, .45), sz: rnd(-.35, .35),
    tint: pick([[118,126,158],[136,124,132],[104,122,150],[128,132,128]]),
    fade: 0
  });
}

function spawnRocket() {
  const dir = Math.random() < .5 ? 1 : -1;
  drifters.push({
    kind: "rocket", dir,
    x: dir === 1 ? -340 : W + 340,
    y: rnd(H * .14, H * .8),
    vx: dir * rnd(24, 42), vy: 0,   // far away, so it crawls
    scale: rnd(.72, 1.05),
    ring: 0, t: 0, fade: 0, puffs: [],
    decided: false, hyper: false, hyperT: 0, streak: 0
  });
}

function spawnAstronaut() {
  const e = entry(120);
  const sp = rnd(10, 26);
  drifters.push({
    kind: "astronaut", x: e.x, y: e.y, vx: e.vx * sp, vy: e.vy * sp,
    rot: Math.random() * 7, spin: rnd(-.5, .5), scale: rnd(.55, 1),
    t: Math.random() * 10, fade: 0
  });
}

/* ---------- renderers ---------- */
function drawAsteroid(o) {
  const cosx = Math.cos(o.rx), sinx = Math.sin(o.rx);
  const cosy = Math.cos(o.ry), siny = Math.sin(o.ry);
  const cosz = Math.cos(o.rz), sinz = Math.sin(o.rz);

  // tumble every vertex, then project it with its own depth
  const P = o.verts.map(([x, y, z]) => {
    let ya = y * cosx - z * sinx, za = y * sinx + z * cosx;          // about X
    let xb = x * cosy + za * siny; za = -x * siny + za * cosy;       // about Y
    const xc = xb * cosz - ya * sinz, yc = xb * sinz + ya * cosz;    // about Z
    const depth = o.z + za;
    const k = FOCAL / Math.max(60, FOCAL + depth);
    return {
      v: [xc, yc, za],
      sx: W / 2 + (o.wx + xc) * k - mouseX * 40 * k,
      sy: H / 2 + (o.wy + yc) * k - mouseY * 40 * k,
      d: depth
    };
  });

  const L = [-.45, -.62, -.64];                                      // light direction
  const faces = ICO_F.map(f => {
    const a = P[f[0]].v, b = P[f[1]].v, c = P[f[2]].v;
    const u = [b[0]-a[0], b[1]-a[1], b[2]-a[2]];
    const w = [c[0]-a[0], c[1]-a[1], c[2]-a[2]];
    let n = [u[1]*w[2]-u[2]*w[1], u[2]*w[0]-u[0]*w[2], u[0]*w[1]-u[1]*w[0]];
    const len = Math.hypot(n[0], n[1], n[2]) || 1;
    n = [n[0]/len, n[1]/len, n[2]/len];
    const mid = [(a[0]+b[0]+c[0])/3, (a[1]+b[1]+c[1])/3, (a[2]+b[2]+c[2])/3];
    if (n[0]*mid[0] + n[1]*mid[1] + n[2]*mid[2] < 0) n = [-n[0], -n[1], -n[2]];
    return { f, n, z: (P[f[0]].d + P[f[1]].d + P[f[2]].d) / 3 };
  }).sort((p, q) => q.z - p.z);                                      // far faces first

  // only dissolve once it is a very long way off; near ones just sweep past
  let a = o.fade;
  if (o.z < -140) a *= Math.max(0, (o.z + 340) / 200);
  if (o.z > 3600) a *= Math.max(0, (4900 - o.z) / 1300);
  if (a <= .01) return;

  const [tr, tg, tb] = o.tint;
  for (const { f, n } of faces) {
    const lit = Math.max(0, -(n[0]*L[0] + n[1]*L[1] + n[2]*L[2]));
    const sh = .22 + .9 * lit;
    const col = `rgba(${Math.round(tr*sh)}, ${Math.round(tg*sh)}, ${Math.round(tb*sh)}, ${a})`;
    cx.fillStyle = col; cx.strokeStyle = col; cx.lineWidth = 1;
    cx.beginPath();
    cx.moveTo(P[f[0]].sx, P[f[0]].sy);
    cx.lineTo(P[f[1]].sx, P[f[1]].sy);
    cx.lineTo(P[f[2]].sx, P[f[2]].sy);
    cx.closePath(); cx.fill(); cx.stroke();
  }
}

function drawRocket(o) {
  const sc = o.scale;
  const back = o.x - o.dir * 132 * sc;                 // where the engines sit

  // long blue exhaust trail
  cx.save();
  cx.globalCompositeOperation = "lighter";
  o.puffs.forEach(p => {
    cx.fillStyle = `rgba(70, 175, 255, ${p.life * p.life * .16 * o.fade})`;
    cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 7); cx.fill();
  });

  // hyperdrive streak
  if (o.streak > 0) {
    const len = 260 + 2600 * o.streak;
    const g = cx.createLinearGradient(back, 0, back - o.dir * len, 0);
    g.addColorStop(0, `rgba(235, 250, 255, ${.9 * (1 - o.streak * .3)})`);
    g.addColorStop(.12, `rgba(90, 190, 255, ${.7 * (1 - o.streak * .3)})`);
    g.addColorStop(1, "rgba(40, 110, 255, 0)");
    cx.fillStyle = g;
    const hh = 16 * sc * (1 - o.streak * .55) + 2;
    cx.beginPath();
    cx.moveTo(back, o.y - hh);
    cx.lineTo(back - o.dir * len, o.y - hh * .25);
    cx.lineTo(back - o.dir * len, o.y + hh * .25);
    cx.lineTo(back, o.y + hh);
    cx.closePath(); cx.fill();
  }
  cx.restore();

  cx.save();
  cx.translate(o.x, o.y);
  if (o.dir === -1) cx.scale(-1, 1);
  cx.scale(sc * (1 + o.streak * 7), sc * (1 - o.streak * .35));
  cx.globalAlpha = o.fade * .9;

  /* ---- engine plume ---- */
  const flick = (.82 + .18 * Math.sin(o.t * 17)) * (1 + o.streak * 6);
  const pl = cx.createLinearGradient(-124, 0, -124 - 190 * flick, 0);
  pl.addColorStop(0,   "rgba(236, 251, 255, .95)");
  pl.addColorStop(.25, "rgba(120, 205, 255, .75)");
  pl.addColorStop(.6,  "rgba(45, 130, 255, .35)");
  pl.addColorStop(1,   "rgba(30, 90, 255, 0)");
  cx.save(); cx.globalCompositeOperation = "lighter"; cx.fillStyle = pl;
  cx.beginPath();
  cx.moveTo(-122, -15);
  cx.quadraticCurveTo(-130 - 200 * flick, 0, -122, 15);
  cx.closePath(); cx.fill();
  cx.restore();

  /* ---- hull ---- */
  const body = cx.createLinearGradient(0, -18, 0, 18);
  body.addColorStop(0,   "#5A6E97");
  body.addColorStop(.35, "#36456A");
  body.addColorStop(.7,  "#1C2440");
  body.addColorStop(1,   "#0E1427");
  cx.fillStyle = body;
  cx.beginPath();
  cx.moveTo(126, 0);
  cx.lineTo(96, -8); cx.lineTo(48, -13); cx.lineTo(-36, -16); cx.lineTo(-122, -15);
  cx.lineTo(-122, 15); cx.lineTo(-36, 16); cx.lineTo(48, 13); cx.lineTo(96, 8);
  cx.closePath(); cx.fill();

  // segment seams and plating
  cx.strokeStyle = "rgba(10, 16, 32, .75)"; cx.lineWidth = 1.4;
  [-96, -62, -24, 12, 54, 88].forEach(x => {
    cx.beginPath(); cx.moveTo(x, -15); cx.lineTo(x, 15); cx.stroke();
  });
  cx.fillStyle = "rgba(96, 120, 165, .55)";
  cx.fillRect(-104, -20, 26, 5); cx.fillRect(-18, -21, 30, 6); cx.fillRect(30, 16, 36, 5);
  cx.fillRect(-70, 16, 22, 4);

  // dorsal mast
  cx.strokeStyle = "rgba(120, 150, 200, .8)"; cx.lineWidth = 2;
  cx.beginPath(); cx.moveTo(66, -14); cx.lineTo(66, -36); cx.stroke();
  cx.fillStyle = "#8FE6FF";
  cx.beginPath(); cx.arc(66, -38, 2.2, 0, 7); cx.fill();

  // window lights
  for (let x = -104; x < 100; x += 11) {
    const a = .35 + .55 * Math.abs(Math.sin(x * .7 + o.t * 1.3));
    cx.fillStyle = `rgba(150, 225, 255, ${a})`;
    cx.fillRect(x, -5, 4, 2);
  }

  /* ---- rotating rings ---- */
  const rings = [[-92, 23], [-44, 25], [16, 23], [72, 17]];
  rings.forEach(([rxp, ry], idx) => {
    const spin = o.ring * (idx % 2 ? -1 : 1) + idx;
    cx.strokeStyle = "rgba(128, 180, 240, .45)"; cx.lineWidth = 2;
    cx.beginPath(); cx.ellipse(rxp, 0, 7, ry, 0, 0, 7); cx.stroke();
    for (let j = 0; j < 9; j++) {
      const a = spin + j * (Math.PI * 2 / 9);
      const front = Math.cos(a) > 0;
      cx.fillStyle = front ? "rgba(170, 235, 255, .95)" : "rgba(90, 130, 190, .3)";
      cx.beginPath();
      cx.arc(rxp + Math.cos(a) * 7, Math.sin(a) * ry, front ? 2.4 : 1.6, 0, 7);
      cx.fill();
    }
  });

  // nose glow
  cx.save(); cx.globalCompositeOperation = "lighter";
  cx.fillStyle = "rgba(120, 210, 255, .5)";
  cx.beginPath(); cx.arc(120, 0, 5, 0, 7); cx.fill();
  cx.restore();

  cx.restore();
}

function drawAstronaut(o) {
  cx.save();
  cx.translate(o.x, o.y); cx.rotate(o.rot); cx.scale(o.scale, o.scale);
  cx.globalAlpha = o.fade;

  cx.strokeStyle = "rgba(190, 205, 255, .35)"; cx.lineWidth = 1.4;
  cx.beginPath(); cx.moveTo(-6, 12);
  for (let i = 1; i <= 5; i++) cx.lineTo(-6 - i * 11, 12 + Math.sin(o.t * 1.6 + i * .9) * 7);
  cx.stroke();

  const suit = "#EEF2FF", shade = "rgba(120,135,175,.9)";
  cx.fillStyle = shade; cx.fillRect(-13, -9, 9, 20);
  cx.strokeStyle = suit; cx.lineWidth = 7; cx.lineCap = "round";
  cx.beginPath();
  cx.moveTo(-2, -2); cx.lineTo(13, -11);
  cx.moveTo(-2, 3);  cx.lineTo(11, 12);
  cx.moveTo(-2, 8);  cx.lineTo(6, 23);
  cx.moveTo(-4, 8);  cx.lineTo(-10, 23);
  cx.stroke();
  cx.fillStyle = suit;
  cx.beginPath(); cx.roundRect(-9, -8, 15, 19, 6); cx.fill();
  cx.fillStyle = "rgba(255,120,150,.9)"; cx.fillRect(-7, -3, 10, 2.5);
  cx.fillStyle = suit;
  cx.beginPath(); cx.arc(-1, -14, 10, 0, 7); cx.fill();
  const vis = cx.createLinearGradient(-9, -20, 7, -8);
  vis.addColorStop(0, "#0A1030"); vis.addColorStop(.6, "#1B3C86"); vis.addColorStop(1, "#7FE3FF");
  cx.fillStyle = vis;
  cx.beginPath(); cx.arc(0, -14, 7, 0, 7); cx.fill();
  cx.fillStyle = "rgba(255,255,255,.55)";
  cx.beginPath(); cx.ellipse(-2.5, -16.5, 2.6, 1.6, -.5, 0, 7); cx.fill();
  cx.restore();
}

/* ---------- timers ---------- */
let tAst = rnd(2, 6), tRocket = rnd(10, 25), tMan = rnd(18, 40);

function updateDrifters(dt) {
  tAst -= dt; tRocket -= dt; tMan -= dt;
  if (tAst <= 0) {
    if (drifters.filter(d => d.kind === "asteroid").length < SPACE.maxAsteroids) spawnAsteroid();
    tAst = rnd(...SPACE.asteroidEvery);
  }
  if (tRocket <= 0) { spawnRocket(); tRocket = rnd(...SPACE.rocketEvery); }
  if (tMan <= 0)    { spawnAstronaut(); tMan = rnd(...SPACE.astronautEvery); }

  for (let i = drifters.length - 1; i >= 0; i--) {
    const o = drifters[i];
    o.fade = Math.min(1, o.fade + dt * 1.2);
    o.t = (o.t || 0) + dt;

    if (o.kind === "asteroid") {
      o.z  += o.vz  * dt;
      o.wx += o.vwx * dt; o.wy += o.vwy * dt;
      o.rx += o.sx * dt;  o.ry += o.sy * dt;  o.rz += o.sz * dt;
      if (o.z < -350 || o.z > 4950 || Math.abs(o.wx) > W * 4 || Math.abs(o.wy) > H * 4) drifters.splice(i, 1);
      continue;
    }

    o.x += o.vx * dt; o.y += o.vy * dt;
    if (o.spin !== undefined) o.rot += o.spin * dt;

    if (o.kind === "rocket") {
      o.ring += dt * 1.5;

      // halfway across, it either carries on or lights the hyperdrive
      if (!o.decided && ((o.dir === 1 && o.x > W * .5) || (o.dir === -1 && o.x < W * .5))) {
        o.decided = true;
        o.hyper = Math.random() < .5;
      }
      if (o.hyper) {
        o.hyperT += dt;
        o.vx *= Math.pow(11, dt);                 // builds up fast
        o.streak = Math.min(1, o.hyperT * 1.7);
        if (o.hyperT > 1.5) o.fade = Math.max(0, o.fade - dt * 2.2);
      }

      const bx = o.x - o.dir * 132 * o.scale;
      const puffs = o.hyper ? 3 : 1;
      for (let k = 0; k < puffs; k++) {
        o.puffs.push({ x: bx - o.dir * k * 14, y: o.y + rnd(-3, 3), r: 5 * o.scale, life: 1 });
      }
      for (const p of o.puffs) { p.life -= dt * (o.hyper ? .34 : .18); p.r += dt * (o.hyper ? 34 : 15); }
      o.puffs = o.puffs.filter(p => p.life > 0);
      if (o.puffs.length > 260) o.puffs.splice(0, o.puffs.length - 260);

      if (o.fade <= 0 || o.x < -2200 || o.x > W + 2200) { drifters.splice(i, 1); }
      continue;
    }
    const pad = 260;
    if (o.x < -pad || o.x > W + pad || o.y < -pad || o.y > H + pad) drifters.splice(i, 1);
  }
}

function drawDrifters() {
  const order = { asteroid: 0, astronaut: 1, rocket: 2 };
  [...drifters].sort((a, b) => {
    if (a.kind === "asteroid" && b.kind === "asteroid") return b.z - a.z;  // far first
    return order[a.kind] - order[b.kind];
  }).forEach(o => {
    cx.save();
    if (o.kind === "asteroid") drawAsteroid(o);
    else if (o.kind === "rocket") drawRocket(o);
    else drawAstronaut(o);
    cx.restore();
  });
}

function frame(ms) {
  const t = ms / 1000;
  const dt = Math.min(.05, last ? t - last : .016);
  last = t;

  cx.clearRect(0, 0, W, H);
  cx.globalCompositeOperation = "lighter";
  warp > 0 ? drawWarp() : drawStars(t);
  cx.globalCompositeOperation = "source-over";

  if (warp === 0) { updateDrifters(dt); drawDrifters(); }
  requestAnimationFrame(frame);
}

if (reduce) {
  drawStars(0);
  spawnAsteroid(); spawnAstronaut();
  drifters.forEach(o => { o.fade = 1; if (o.kind === 'asteroid') { o.z = 700; o.wx = W * .22; o.wy = -H * .2; } else { o.x = W * rnd(.2, .8); o.y = H * rnd(.2, .8); } });
  drawDrifters();
} else {
  requestAnimationFrame(frame);
}

/* =========================================================
   LAUNCH
   Correct code → the row crumples into a glowing ball at the
   centre of the screen → the portal opens out of that ball.
   ========================================================= */
const portal = document.getElementById("portal");
const portalName = document.getElementById("portalName");
const ball = document.getElementById("ball");

function launch(app, li) {
  if (document.body.classList.contains("launching")) return;

  if (reduce) { location.href = app.href; return; }

  // where the row has to travel to reach the middle of the screen
  const r = li.getBoundingClientRect();
  li.style.setProperty("--tx", (innerWidth / 2 - (r.left + r.width / 2)) + "px");
  li.style.setProperty("--ty", (innerHeight / 2 - (r.top + r.height / 2)) + "px");

  ball.style.setProperty("--h", app.hue);
  portal.style.setProperty("--h", app.hue);
  portal.style.setProperty("--x", "50%");
  portal.style.setProperty("--y", "50%");
  portalName.textContent = app.name;

  document.body.classList.add("launching");
  li.classList.remove("asking");
  li.classList.add("crumpling");

  setTimeout(() => ball.classList.add("on"), 780);          // ball forms as the row finishes crumpling
  setTimeout(() => { warp = 1; portal.classList.add("on"); }, 1280);  // portal opens out of the ball
  setTimeout(() => { location.href = app.href; }, 2350);
}

// Reset if someone comes back with the browser's back button
addEventListener("pageshow", e => {
  if (!e.persisted) return;
  document.body.classList.remove("launching");
  document.querySelectorAll(".app.crumpling").forEach(el => el.classList.remove("crumpling"));
  portal.classList.remove("on");
  ball.classList.remove("on");
  warp = 0;
  drifters.length = 0;
});

// Escape closes an open code panel
addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  document.querySelectorAll(".app.asking").forEach(o => {
    o.classList.remove("asking");
    o.querySelector(".trigger").setAttribute("aria-expanded", "false");
  });
});
</script>
