<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Problem Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --board:#151A26; --panel:#1B2233; --panel-2:#212A3E; --line:#2D3852;
  --ink:#E9ECF4; --ink-2:#9AA5BE; --ink-3:#6B7593;
  --amber:#F2B441; --cyan:#57C7E8; --magenta:#E86BA8; --mint:#68D3A7;
  --grid:rgba(120,140,190,.10); --radius:10px; --shadow:0 14px 34px rgba(5,8,18,.45);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="light"]){color-scheme:dark}
:root[data-theme="light"]{
  color-scheme:light;
  --board:#F2F5FB; --panel:#FFFFFF; --panel-2:#EDF1F9; --line:#D5DCEB;
  --ink:#171D2C; --ink-2:#56607A; --ink-3:#818CA6;
  --amber:#B57708; --cyan:#0F7C9E; --magenta:#B8397A; --mint:#1E8A62;
  --grid:rgba(30,60,120,.07); --shadow:0 12px 28px rgba(30,45,90,.12);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--board);color:var(--ink);
  font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
::selection{background:var(--amber);color:#141824}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px 80px}
header.top{padding:34px 0 18px;border-bottom:1px solid var(--line)}
.title-row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
h1{font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:clamp(28px,4.6vw,44px);
  line-height:1.05;margin:0;letter-spacing:-.015em}
h1 em{font-style:italic;color:var(--amber)}
.sub{margin:8px 0 0;color:var(--ink-2);max-width:58ch;font-size:14.5px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.strip{margin:22px 0 0}
.strip-ticks{display:flex;gap:3px;align-items:flex-end;height:46px;flex-wrap:wrap}
.tick{width:7px;border-radius:2px;background:var(--ink-3);opacity:.9;transform-origin:bottom;
  transition:height .35s cubic-bezier(.2,.8,.3,1),opacity .25s}
.tick.e{background:var(--mint)}.tick.m{background:var(--amber)}.tick.h{background:var(--magenta)}
.tick.off{opacity:.16}
.strip-legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;color:var(--ink-2);font-size:12.5px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:-1px}
.layout{display:grid;grid-template-columns:238px 1fr;gap:30px;margin-top:26px;align-items:start}
@media(max-width:900px){.layout{grid-template-columns:1fr;gap:18px}}
.side{position:sticky;top:calc(14px + env(safe-area-inset-top,0px));max-height:calc(100dvh - 40px);overflow:auto}
@media(max-width:900px){.side{position:static;max-height:none}}
.side h2{font-size:12.5px;font-weight:600;color:var(--ink-3);margin:0 0 10px}
.chapters{display:flex;flex-direction:column;gap:2px}
@media(max-width:900px){.chapters{flex-direction:row;overflow-x:auto;padding-bottom:6px;gap:6px}}
.chap{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 10px;border-radius:8px;
  border:1px solid transparent;color:var(--ink-2);transition:background .18s,color .18s,border-color .18s;white-space:nowrap}
.chap:hover{background:var(--panel);color:var(--ink)}
.chap.active{background:var(--panel-2);color:var(--ink);border-color:var(--line)}
.chap .bar{width:3px;height:16px;border-radius:2px;background:var(--line);flex:none;transition:background .2s}
.chap.active .bar{background:var(--amber)}
.chap .nm{flex:1;font-size:13.5px;overflow:hidden;text-overflow:ellipsis}
.chap .ct{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.chap[draggable="true"]{cursor:grab}
.side-foot{margin-top:14px;display:flex;gap:6px;flex-wrap:wrap}
.controls{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:16px}
.ctl-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ctl-row+.ctl-row{margin-top:11px;padding-top:11px;border-top:1px dashed var(--line)}
.search{flex:1 1 230px;position:relative;display:flex;align-items:center}
.search input{width:100%;background:var(--board);border:1px solid var(--line);border-radius:8px;
  padding:9px 11px 9px 32px;font-size:14px;transition:border-color .18s,box-shadow .18s}
.search input:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px rgba(242,180,65,.16)}
.search svg{position:absolute;left:10px;opacity:.5;pointer-events:none}
select{background:var(--board);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13.5px}
select:focus{outline:none;border-color:var(--amber)}
.chip{padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:transparent;
  color:var(--ink-2);font-size:12.5px;font-weight:500;transition:all .18s}
.chip:hover{color:var(--ink);border-color:var(--ink-3)}
.chip.on{color:#141824;font-weight:600;border-color:transparent}
.chip.on.e{background:var(--mint)}.chip.on.m{background:var(--amber)}.chip.on.h{background:var(--magenta)}
.chip.on.plain{background:var(--ink);color:var(--board)}
:root[data-theme="light"] .chip.on{color:#fff}
.btn{padding:8px 13px;border-radius:8px;border:1px solid var(--line);color:var(--ink-2);font-size:13px;font-weight:500;transition:all .18s}
.btn:hover{color:var(--ink);border-color:var(--ink-3);background:var(--panel-2)}
.btn.primary{background:var(--amber);color:#181C28;border-color:transparent;font-weight:600}
.btn.primary:hover{filter:brightness(1.08);background:var(--amber);color:#181C28}
.btn.danger:hover{color:var(--magenta);border-color:var(--magenta)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:6px}
.count{color:var(--ink-3);font-size:13px;margin-left:auto;font-variant-numeric:tabular-nums}
.group{margin-bottom:26px}
.group-head{display:flex;align-items:baseline;gap:10px;margin:0 0 10px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.group-head h3{font-family:"Source Serif 4",serif;font-size:19px;font-weight:600;margin:0;letter-spacing:-.01em}
.group-head span{color:var(--ink-3);font-size:12.5px;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--ink-3);border-radius:var(--radius);
  padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;
  animation:in .3s cubic-bezier(.2,.8,.3,1) both;transition:border-color .18s,transform .18s}
.card.e{border-left-color:var(--mint)}.card.m{border-left-color:var(--amber)}.card.h{border-left-color:var(--magenta)}
.card:hover{border-top-color:var(--ink-3);border-right-color:var(--ink-3);border-bottom-color:var(--ink-3)}
.card.dragging{opacity:.35}
.card.drop-into{border-top:2px solid var(--amber)}
.card.flash{animation:flash .9s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes flash{0%{background:rgba(242,180,65,.22)}100%{background:var(--panel)}}
.grip{color:var(--ink-3);cursor:grab;padding-top:2px;line-height:1;user-select:none;font-size:15px}
.num{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;min-width:22px;text-align:center}
.card-main{min-width:0;cursor:pointer}
.q-title{font-weight:600;font-size:14.5px;margin:0;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.q-title .star{color:var(--amber)}
.q-text{font-family:"Source Serif 4",Georgia,serif;font-size:15px;line-height:1.62;color:var(--ink-2);
  margin:6px 0 0;max-width:78ch;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;align-items:center}
.pill{font-size:11.5px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink-3)}
.pill.d{font-weight:600;border-color:transparent}
.pill.d.e{background:rgba(104,211,167,.16);color:var(--mint)}
.pill.d.m{background:rgba(242,180,65,.16);color:var(--amber)}
.pill.d.h{background:rgba(232,107,168,.16);color:var(--magenta)}
.pill.src{color:var(--cyan);border-color:rgba(87,199,232,.3)}
.pill.fig{color:var(--ink-2)}
.acts{display:flex;gap:3px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.icon{width:29px;height:29px;display:grid;place-items:center;border-radius:7px;color:var(--ink-3);
  transition:background .16s,color .16s,transform .16s}
.icon:hover{background:var(--panel-2);color:var(--ink);transform:translateY(-1px)}
.icon.on{color:var(--amber)}
.icon.del:hover{color:var(--magenta)}
.empty{text-align:center;padding:60px 20px;color:var(--ink-3)}
.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:6px;font-family:"Source Serif 4",serif}
/* figures */
.fig{stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;
  width:100%;height:auto;max-width:440px;color:var(--ink-2)}
.fig text{font-family:"Source Serif 4",serif;font-style:italic;font-size:11px;fill:var(--ink-2);stroke:none}
.fig .acc{stroke:var(--amber)}
.fig text.acc{fill:var(--amber);stroke:none}
.fig .fill{fill:var(--panel-2);stroke:currentColor}
.fig .dash{stroke-dasharray:4 3;opacity:.6}
.figbox{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;justify-content:center}
/* detail page */
.detail{animation:in .28s cubic-bezier(.2,.8,.3,1) both;max-width:820px}
.crumbs{display:flex;align-items:center;gap:10px;margin:22px 0 14px;flex-wrap:wrap}
.detail h2{font-family:"Source Serif 4",serif;font-size:clamp(22px,3.4vw,30px);font-weight:600;margin:0 0 8px;letter-spacing:-.015em}
.statement{font-family:"Source Serif 4",Georgia,serif;font-size:17px;line-height:1.7;max-width:70ch;margin:16px 0 20px}
.block{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.block h4{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--ink-3)}
.block textarea{width:100%;min-height:150px;background:var(--board);border:1px solid var(--line);border-radius:8px;
  padding:12px;font-family:"Source Serif 4",serif;font-size:15.5px;line-height:1.65;resize:vertical}
.block textarea:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px rgba(242,180,65,.14)}
.saved{font-size:12px;color:var(--mint);opacity:0;transition:opacity .3s}
.saved.on{opacity:1}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:12px}
.shot{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--board)}
.shot img{display:block;width:100%;height:120px;object-fit:cover;cursor:zoom-in}
.shot button{position:absolute;top:5px;right:5px;background:rgba(10,14,24,.78);color:#fff;border-radius:6px;
  width:24px;height:24px;display:grid;place-items:center;font-size:13px}
.drop{border:1.5px dashed var(--line);border-radius:9px;padding:18px;text-align:center;color:var(--ink-3);font-size:13.5px;
  transition:border-color .18s,background .18s;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--amber);background:var(--panel-2);color:var(--ink-2)}
.sol{overflow:hidden}
.sol-body{font-family:"Source Serif 4",serif;font-size:16px;line-height:1.7;white-space:pre-wrap;
  animation:reveal .4s cubic-bezier(.2,.8,.3,1) both;border-left:2px solid var(--amber);padding-left:14px;margin-top:4px}
@keyframes reveal{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.veil{display:flex;align-items:center;gap:14px;flex-wrap:wrap;color:var(--ink-3);font-size:13.5px}
.scrim{position:fixed;inset:0;background:rgba(8,11,20,.62);backdrop-filter:blur(3px);display:grid;place-items:center;
  padding:18px;z-index:50;animation:fade .18s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  width:min(620px,100%);max-height:86dvh;overflow:auto;padding:20px;animation:pop .22s cubic-bezier(.2,.9,.3,1) both}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
.modal h2{font-family:"Source Serif 4",serif;font-size:21px;margin:0 0 16px;font-weight:600}
.modal img.big{max-width:100%;max-height:78dvh;border-radius:10px;display:block}
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;color:var(--ink-3);margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;background:var(--board);border:1px solid var(--line);
  border-radius:8px;padding:9px 11px;font-size:14px}
.field textarea{font-family:"Source Serif 4",serif;line-height:1.6;min-height:120px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px rgba(242,180,65,.14)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.two{grid-template-columns:1fr}}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;gap:12px;
  align-items:center;box-shadow:var(--shadow);z-index:60;font-size:13.5px;animation:rise .2s cubic-bezier(.2,.9,.3,1) both;max-width:92vw}
@keyframes rise{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.toast button{color:var(--amber);font-weight:600;font-size:13.5px}
/* ---- test mode ---- */
body.testing header.top{display:none}
.setup{max-width:880px;animation:in .3s cubic-bezier(.2,.8,.3,1) both}
.setup h2,.rhead h2{font-family:"Source Serif 4",serif;font-size:clamp(22px,3.4vw,30px);font-weight:600;margin:22px 0 6px;letter-spacing:-.015em}
.setup p.lead{color:var(--ink-2);max-width:62ch;margin-bottom:22px}
.sect{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.sect h4{margin:0 0 12px;font-size:12.5px;font-weight:600;color:var(--ink-3)}
.chipset{display:flex;gap:7px;flex-wrap:wrap}
.slider{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.slider input[type=range]{flex:1 1 180px;accent-color:var(--amber)}
.slider b{font-variant-numeric:tabular-nums;min-width:22px;text-align:center}
.matchline{color:var(--ink-2);font-size:13.5px;margin-top:10px}
.matchline b{color:var(--ink)}
.testbar{position:sticky;top:calc(8px + env(safe-area-inset-top,0px));z-index:20;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;padding:11px 14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:17px}
.timer.low{color:var(--magenta)}
.testgrid{display:grid;grid-template-columns:1fr 236px;gap:20px;margin-top:16px;align-items:start}
@media(max-width:880px){.testgrid{grid-template-columns:1fr}}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.qhead{display:flex;justify-content:space-between;gap:10px;color:var(--ink-3);font-size:12.5px;margin-bottom:12px;flex-wrap:wrap}
.qtext{font-family:"Source Serif 4",Georgia,serif;font-size:16.5px;line-height:1.68}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:18px}
.optbtn{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;
  border:1px solid var(--line);border-radius:10px;background:var(--board);
  font-family:"Source Serif 4",serif;font-size:15.5px;line-height:1.5;transition:border-color .18s,background .18s,transform .18s}
.optbtn:hover{border-color:var(--ink-3);transform:translateX(2px)}
.optbtn .key{font-family:Archivo,sans-serif;font-size:12px;font-weight:700;color:var(--ink-3);
  border:1px solid var(--line);border-radius:6px;width:22px;height:22px;display:grid;place-items:center;flex:none;margin-top:1px}
.optbtn.sel{border-color:var(--amber);background:rgba(242,180,65,.12)}
.optbtn.sel .key{background:var(--amber);color:#181C28;border-color:transparent}
.optbtn.right{border-color:var(--mint);background:rgba(104,211,167,.13)}
.optbtn.wrong{border-color:var(--magenta);background:rgba(232,107,168,.13)}
.navrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.palette{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;
  position:sticky;top:calc(74px + env(safe-area-inset-top,0px))}
@media(max-width:880px){.palette{position:static}}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:7px;margin-top:10px}
.pal{height:36px;border-radius:8px;border:1px solid var(--line);font-size:13px;font-weight:600;
  color:var(--ink-2);background:var(--board);transition:transform .15s}
.pal:hover{transform:translateY(-2px)}
.pal.ans{background:var(--mint);color:#0B1A14;border-color:transparent}
.pal.mark{background:var(--amber);color:#1A1405;border-color:transparent}
.pal.ansmark{background:linear-gradient(135deg,var(--mint) 50%,var(--amber) 50%);color:#0B1A14;border-color:transparent}
.pal.cur{outline:2px solid var(--cyan);outline-offset:2px}
.legend{font-size:11.5px;color:var(--ink-3);display:flex;flex-direction:column;gap:5px;margin-top:14px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px;margin:18px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px}
.stat b{display:block;font-size:26px;font-family:"Source Serif 4",serif;line-height:1.1}
.stat span{font-size:12px;color:var(--ink-3)}
.barrow{display:grid;grid-template-columns:minmax(90px,160px) 1fr auto;gap:12px;align-items:center;margin-bottom:8px;font-size:13px}
.track{height:8px;background:var(--panel-2);border-radius:5px;overflow:hidden}
.track i{display:block;height:100%;background:var(--mint);border-radius:5px;transition:width .7s cubic-bezier(.2,.8,.3,1)}
.rev{border-top:1px solid var(--line);padding:13px 2px;display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:start}
.rev .mk{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700}
.mk.ok{background:rgba(104,211,167,.2);color:var(--mint)}
.mk.no{background:rgba(232,107,168,.2);color:var(--magenta)}
.mk.sk{background:var(--panel-2);color:var(--ink-3)}
.rev .ans{font-size:13px;color:var(--ink-2);margin-top:5px;font-family:"Source Serif 4",serif}
.attempt{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink-2)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="title-row">
      <div>
        <h1>The <em>problem board</em></h1>
        <p class="sub">Every question from the tutorial sheets and time-bound tests, sorted by chapter. Open one to keep notes, pin a photo of your work, and reveal the solution only when you want it.</p>
      </div>
      <div class="top-actions">
        <button class="btn" id="themeBtn">Light mode</button>
        <button class="btn" id="exportBtn">Export</button>
        <button class="btn" id="importBtn">Import</button>
        <button class="btn" id="addBtn">Add problem</button>
        <button class="btn primary" id="testBtn">Take a test</button>
      </div>
    </div>
    <div class="strip">
