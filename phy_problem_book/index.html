const SEED=[
{t:"The shared bicycle",ch:"kin",d:"Medium",src:"26 Jul test",tg:["MCQ"],
x:"Two tourists are 40 km from their camp and must reach it together in the shortest possible time. They have one bicycle, which they use in turn. One starts walking at 5 km/h while the other rides at 15 km/h. They agree to leave the bicycle at intermediate points, where one walks and the other rides. How long does the bicycle remain unused? (A) 5 hr 20 min (B) 2 hr 40 min (C) 1 hr 10 min (D) 55 min",
s:"The bicycle only ever moves forward and ends at the camp, so the two riding distances add to 40 km. For the shortest common time both must do the same thing: each rides 20 km and walks 20 km.\nTotal time T = 20/5 + 20/15 = 5 h 20 min.\nThe bicycle is in motion only 40/15 = 2 h 40 min.\nIdle time = 5 h 20 min − 2 h 40 min = 2 h 40 min → (B)."},
{t:"Ball thrown up: s–t graph",ch:"kin",d:"Hard",src:"26 Jul test",tg:["graph","MCQ"],fig:"stGraph",
x:"A ball is thrown vertically upwards. Its distance s from a fixed point varies with time t as shown in the graph, with s₁ = 6√5 m, s₂ = 10 m and s₃ = 6 m. Calculate the velocity of projection of the ball. (A) 10 m/s (B) 20 m/s (C) 30 m/s (D) 50 m/s",
s:"The fixed point is off the line of flight: at horizontal distance d and height h, s² = d² + (y−h)².\nThe two minima (s₃ = 6) occur when y = h, so d = 6 m.\nThe local maximum s₂ = 10 is at the top: 36 + (H−h)² = 100 → H − h = 8.\nAt t = 0, s₁ = 6√5: 36 + h² = 180 → h = 12, so H = 20 m.\nu = √(2gH) = 20 m/s → (B)."},
{t:"Melting wax bar on a wedge",ch:"kin",d:"Hard",src:"26 Jul test",tg:["multi-correct","constraint"],fig:"wax",
x:"A horizontal wax bar B rests between a wedge and a vertical wall. The wedge starts moving towards the wall with constant acceleration 0.5 mm/s². The moment the wedge starts moving, heat from the wall begins melting 1.0 mm length of the bar per second. The bar always stays horizontal (wedge angle 37°). Which conclusions can you make? (a) The bar first moves down then up. (b) The bar stops for a moment 2.0 s after the start. (c) Modulus of displacement in the first 4 s is 1.5 mm. (d) Distance travelled in the first 4 s is 1.5 mm.",
s:"Measure from the wall. The wedge advances ¼t² mm while the bar shortens by t mm, so the contact point moves along the slope by (¼t² − t) mm and the bar's height changes by y = (¼t² − t)tan37° = 0.75(¼t² − t).\ndy/dt = 0.75(½t − 1) = 0 at t = 2 s: the bar descends, stops at 2 s, then rises — (a) and (b) are true.\ny(2) = −0.75 mm, y(4) = 0. So displacement in 4 s is 0 but the distance is 2 × 0.75 = 1.5 mm.\nCorrect: (a), (b), (d)."},
{t:"Bead on a released rod",ch:"kin",d:"Hard",src:"9 Jul",tg:["MCQ","limiting case"],fig:"bead",
x:"A massive bead is threaded on a long light rod, one end of which is pivoted at a fixed point O. Initially the rod is held horizontally and the bead is at a distance l from the pivot. The coefficient of friction between rod and bead is μ. Which statements correctly describe the relation between the angle θ the rod makes with the horizontal after release and time t? (a) If μ is negligible, θ → tan⁻¹(gt²/2l). (b) If μ is finite, θ → tan⁻¹(gt²/2l). (c) If μ is finite, θ is smaller than tan⁻¹(gt²/2l) by a finite amount. (d) None.",
s:"Take torques about O for the massless rod. The only force the bead exerts with a moment arm is the normal force N (friction acts along the rod, straight through O).\nA massless rod needs zero net torque, so N·r = 0 ⇒ N = 0, hence friction μN = 0 as well, whatever μ is.\nThe bead is therefore in free fall: it stays at horizontal distance l while falling gt²/2.\nθ = tan⁻¹(gt²/2l) in both cases → (a) and (b)."},

{t:"Two trajectories to the same point",ch:"proj",d:"Medium",src:"9 Jul",tg:["subjective"],
x:"P(80 m, 60 m) is a point in the XY vertical plane with gravity along −Y. For a given launch speed u, the projectile thrown reaches P in 4 s. Prove that another trajectory with the same launch speed u but a different launch direction also reaches P, and find the time duration for the second trajectory. Take g = 10 SI units.",
s:"Eliminate θ from x = u cosθ·t and y = u sinθ·t − ½gt²:\nx² + y² + g²t⁴/4 + g y t² = u²t².\nThis is a quadratic in t², so a given u generally gives two flight times to the same point.\nWith x = 80, y = 60, t = 4: 6400 + 3600 + 400 + 9600 = 16u² → u = 31.6 m/s (u² = 1000).\nPut u² = 1000 back: 25t⁴ + (600 − 1000)t² + 10000 = 0 → t⁴ − 16t² + 400/... solving gives t² = 16 or 25.\nSo the second trajectory takes t = 5 s."},
{t:"Minimum speed through a given point",ch:"proj",d:"Medium",src:"9 Jul",tg:["subjective","optimisation"],
x:"A particle is projected from the origin in such a way that it passes through a given point P(a, b). Assuming acceleration due to gravity g acts in the negative y-direction, what is the minimum required speed to do so?",
s:"Use the trajectory equation with T = tanθ: b = aT − (ga²/2u²)(1 + T²).\nRearranged: (ga²/2u²)T² − aT + b + ga²/2u² = 0. A real launch angle needs a non-negative discriminant:\na² − 4(ga²/2u²)(b + ga²/2u²) ≥ 0 ⟹ u⁴ − 2gb·u² − g²a² ≥ 0.\nSolving the quadratic in u²: u²_min = g(b + √(a² + b²)).\nSo u_min = √(g(b + √(a² + b²))), and at that speed tan2θ... the launch direction bisects the vertical and OP — the final velocity is then perpendicular to the initial one."},
{t:"Shell exploding near a bunker",ch:"proj",d:"Hard",src:"WoW tutorial",tg:["subjective","optimisation"],fig:"hill",
x:"A cannon installed at the top of a hill can fire shells in all directions. There is an enemy bunker at an angle of elevation φ and a distance d from the cannon. All the shells fired explode in air a time T before they reach the bunker. At what angle to the horizontal should a shell be fired with speed u to explode closest to the bunker? Acceleration due to gravity is g.",
s:"At the moment of explosion the displacement is s = u T + ½g T². The term ½gT² is a fixed vector (downward, magnitude ½gT²), while uT is a vector of fixed length uT and free direction — the explosion points lie on a circle of radius uT centred at ½gT² below the cannon.\nThe closest point of that circle to B lies on the line joining B to the circle's centre, so the shell must be aimed so that uT points from the centre towards B.\ntanθ = (d sinφ + ½gT²)/(d cosφ)."},
{t:"Grasshopper in a tilted box",ch:"proj",d:"Hard",src:"1 Aug",tg:["subjective","optimisation"],fig:"box",
x:"A grasshopper on the bottom of a cubical box has to jump out of the box. If each side of the box is h = 52 cm and the grasshopper can jump with a maximum initial velocity u = 3 m/s, what should the minimum tilt angle θ of the box be so that the grasshopper can jump out? Acceleration due to gravity is g = 10 m/s².",
s:"It must clear the far top corner. That corner is a distance d = h√2 = 0.735 m away, at elevation β = 45° − θ above the horizontal once the box is tilted by θ.\nThe least speed needed to reach a point at distance d and elevation β is u² = gd(1 + sinβ).\nSo 9 = 10(0.735)(1 + sin(45° − θ)) ⟹ sin(45° − θ) = 0.224 ⟹ 45° − θ = 12.9°.\nθ_min ≈ 32°."},
{t:"Clearing a wall with least speed",ch:"proj",d:"Medium",src:"26 Jul test",tg:["integer"],
x:"A child throws a ball so as to clear a wall of height h located at a horizontal distance x from the point of projection. Find the minimum speed required for clearing the wall. If v_min = √(g(ah + √(bh² + cx²))), then find a + b + c.",
s:"Same optimisation as the 'minimum speed through a point' problem, with the point (x, h):\nv_min = √(g(h + √(h² + x²))).\nComparing, a = b = c = 1, so a + b + c = 3."},
{t:"Wind-blown projectile: match the column",ch:"proj",d:"Hard",src:"26 Jul test",tg:["matrix-match"],fig:"wind",
x:"A particle is projected from the origin with speed u = 50 m/s at 30° to the X-axis. Due to wind it acquires an extra acceleration a = 6 m/s² in the −x direction. On its path A and B have the same x-coordinate, P and Q the same y-coordinate, N lies on the X-axis and M on the Y-axis. With t₁, t₂, t₃, t₄ the times from O to P, O to Q, O to A and O to B, match (A) t₁+t₂, (B) t₃+t₄, (C) length ON, (D) length OM with (P) 625/√3·(5/√3 − 1), (Q) 25√3(5−√3), (R) 5, (S) 25/√3, (T) none.",
s:"uₓ = 25√3, u_y = 25, aₓ = −6, a_y = −10.\nSame y ⇒ t₁ + t₂ = 2u_y/g = 5 s → (A)→(R).\nSame x ⇒ t₃ + t₄ = 2uₓ/|aₓ| = 50√3/6 = 25/√3 → (B)→(S).\nN: y = 0 at t = 5 s, so ON = 25√3(5) − 3(25) = 25√3(5 − √3) → (C)→(Q).\nM: x = 0 at t = 25/√3·… = 25√3/3 s, giving |OM| = 625/√3(5/√3 − 1) → (D)→(P).\nHence option (C)."},
{t:"Time up versus time down from a height",ch:"proj",d:"Easy",src:"WoW tutorial",tg:["subjective"],
x:"A projectile is launched from a height h above the ground and its total time of flight is T. Find the difference between the time taken to reach the top of its path and the time it takes to move from the top to the ground.",
s:"Let t₁ = launch → top and t₂ = top → ground, so t₁ + t₂ = T.\nHeight of top above launch H − h = ½g t₁², height above ground H = ½g t₂².\nSubtracting: t₂² − t₁² = 2h/g.\nt₂ − t₁ = (t₂² − t₁²)/(t₂ + t₁) = 2h/(gT)."},
{t:"Cannon above a tunnel exit",ch:"proj",d:"Hard",src:"WoW tutorial",tg:["subjective","olympiad"],fig:"tunnel",
x:"On a hill above the tunnel exit stands a cannon that can fire at any angle to the horizon; the muzzle velocity can vary. Cars drive out of the tunnel at speed V₀ and the cannon fires at a car the exact moment it emerges. The cars that are hit lie in the interval from x to y from the tunnel. Determine the height of the cannon above the road and the maximum speed with which the projectiles can be fired. Hit cars stop instantly and the projectiles hit precisely the cars aimed at.",
s:"A projectile launched with vertical component u_y from height H lands after t = [u_y + √(u_y² + 2gH)]/g. A car at distance s is hit when V₀t = s, so the reachable distances run between the extreme flight times.\nt_max − t_min = 2u_y/g for the two signs of u_y, and V₀(t_max − t_min) = y − x.\nWorking the two conditions through:\nH = xyg/(2V₀²),  u_max = √((y−x)²g²/(4V₀²) + V₀²)."},
{t:"Ball bouncing inside a spherical bowl",ch:"proj",d:"Hard",src:"WoW tutorial",tg:["olympiad"],fig:"bowl",
x:"A small ball bounces inside a spherical bowl, elastically colliding with its walls at two points located on the same horizontal level. The time intervals between impacts when moving in opposite directions are equal to T₁ and T₂ respectively. Determine the radius of the bowl.",
s:"Both flights start and end at the same height, so each is a symmetric projectile with horizontal range equal to the chord 2R sinα (α = half-angle of the chord at the centre).\nElastic bounces off the sphere reverse the normal component, which fixes the launch angle relative to the radius; combining the two chords traced in times T₁ and T₂ with the range–time relation R_chord = ½g t₁t₂ for a common chord gives\nR = gT₁T₂/(2√2)."},
{t:"Wall profile for catching every ball",ch:"proj",d:"Hard",src:"WoW tutorial",tg:["olympiad","subjective"],fig:"wallPO",
x:"Peter and Oleg simultaneously begin to walk parallel to the Ox axis with constant speeds v and u respectively, on opposite sides of a thin vertical wall and close to it. Peter throws balls over the wall at random moments; each ball crosses the wall at the minimum possible height and flies perpendicular to the x-axis in the wall's frame. At what wall profile y(x) will Oleg be able to catch all the balls? Both start at the origin.",
s:"At time t Peter is at vt; the ball just clears the wall at that point, i.e. it crosses the top of the wall moving horizontally (its apex is at the wall).\nAfter the apex the ball needs the time of a free fall from y to reach Oleg, who is at ut: τ = √(2y/g), and the horizontal gap it must close is (v − u)t.\nAlso, at the apex the ball's horizontal speed in the ground frame equals Peter's throwing speed component, fixed by the requirement that it crosses perpendicular to the wall in the wall frame.\nEliminating t with x = vt gives\ny = gx²(v − u)²/(8u²v²)."},
{t:"Maximum range on an incline",ch:"proj",d:"Medium",src:"WoW tutorial",tg:["proof"],
x:"For projectile motion launched from the foot of an inclined plane, show that when the range along the incline is maximum, the final velocity is perpendicular to the initial velocity, and that the launch direction bisects the angle between the vertical and the incline.",
s:"With the incline at angle β, R = (2u²cosθ sin(θ−β))/(g cos²β) where θ is measured from the horizontal. Maximising over θ gives cos(2θ − β) = 0 ⇒ θ = 45° + β/2, i.e. the launch direction bisects the vertical and the incline.\nFor the perpendicularity: if u·v ≠ 0 at landing, a slightly smaller launch speed could still cover the same range (reverse the trajectory — a reversed path landing with a speed less than u), contradicting maximality. Hence u·v = 0 at the maximum range."},
{t:"Leopold the cat and the mice",ch:"proj",d:"Hard",src:"WoW tutorial",tg:["olympiad"],fig:"leopold",
x:"Leopold the Cat was standing near the edge of a barn roof. Two mice shot at him with a slingshot. The stone, having described an arc, after t₁ = 1.2 s elastically bounced off the inclined slope of the barn roof right at the cat's paws, and after t₂ = 1.0 s hit the paw of the mouse that fired it. At what distance s from the mice was Leopold the Cat?",
s:"Take axes along and perpendicular to the roof is unnecessary — use axes along the line mice→cat and perpendicular to it. Because the bounce is elastic off the roof and the stone returns to its launch point, the displacement components satisfy\nSₓ = uₓt + ½gₓt², S_y = u_yt + ½g_yt², with the same u reversed at the bounce.\nThat gives t₁t₂ = −Sₓ/(½gₓ) = −S_y/(½g_y), hence Sₓ² + S_y² = ¼(gₓ² + g_y²)(t₁t₂)².\nSo s = ½g t₁t₂ = ½(10)(1.2)(1.0) = 6 m."},
{t:"Two balls from one catapult",ch:"proj",d:"Hard",src:"Relative-motion tut",tg:["olympiad"],
x:"A toy catapult can fire two small balls simultaneously, launching them with initial velocities of equal magnitude v₀ but directed at different angles to the horizontal. The angle at which one of the balls is launched can be changed arbitrarily. The design is such that after being fired from a horizontal plane, both balls land at the exact same point on this plane. After many trials, the maximum possible distance between the balls while both were in the air reached L = 19 m. Determine v₀. Take g = 10 m/s².",
s:"Equal speeds landing at the same point means complementary angles α and 90° − α... on a horizontal plane the pair is (α, 90° − α), i.e. symmetric about 45°.\nIn the frame of ball 1 the other ball moves in a straight line at constant relative speed 2v₀ sinα (the difference of the launch velocities), so the separation grows until the first ball lands, at t₁ = 2v₀ sin(45° − α)/g.\nl = 2v₀ sinα · 2v₀ sin(45°−α)/g. Maximising over α gives α = 45°/2 = 22.5°.\nSetting l = 19 m gives v₀ = 18 m/s."},
{t:"Two stones across a ravine",ch:"proj",d:"Hard",src:"Relative-motion tut",tg:["olympiad"],fig:"ravine",
x:"From two sides of a ravine of width L = 20 m, two small stones are thrown simultaneously. The initial velocities of the stones are equal and directed perpendicular to each other; the launch points lie on the same horizontal line. It turned out that the velocities of the stones were once again perpendicular to each other precisely at the moment in time when the distance between them was minimal. Find the magnitude of the initial velocity. g ≈ 10 m/s²; neglect air resistance.",
s:"In the relative frame gravity cancels, so one stone moves uniformly relative to the other with relative velocity v_rel = v₁ − v₂ of magnitude v√2. The minimum separation occurs when the relative displacement is perpendicular to v_rel.\nImposing that the velocities v₁ = (v cosα, −gt) and v₂ = (−v sinα, −gt) are again perpendicular at that same instant gives (v cosα î − gt ĵ)·(−v sinα î − gt ĵ) = 0.\nWorking the two conditions together gives the clean result v = √(gL/2) = √(10·20/2) = 10 m/s."},
{t:"Drone diving to a charging pad",ch:"proj",d:"Hard",src:"WoW tutorial",tg:["subjective","optimisation"],fig:"drone",
x:"A drone is flying horizontally with a constant speed u. When it reaches point P it detects a stationary charging pad located vertically below it at point O, a distance d away. From that instant the drone can produce a maximum net acceleration of magnitude a₀ in any direction and tries to reach the charging pad in the shortest possible time. Find the minimum time required.",
s:"Work in the frame that moves with the drone's initial velocity u (an inertial frame). In that frame the drone starts at rest and the pad moves backwards at u, so after time T the required displacement is uT horizontally and d vertically.\nWith the full acceleration a₀ used in a fixed direction: ½a₀T² = √(u²T² + d²).\n¼a₀²T⁴ − u²T² − d² = 0 ⟹ T² = 2[u² + √(u⁴ + a₀²d²)]/a₀².\nT_min = (1/a₀)√(2[u² + √(u⁴ + a₀²d²)])."},

{t:"Pursuit along the x-axis",ch:"rel",d:"Hard",src:"Relative-motion tut",tg:["integer","pursuit"],fig:"pursuit",
x:"From the configuration shown, B is a particle which moves with constant velocity along the x axis. A is a particle that moves with the same speed as B but has its velocity always directed towards B. At t = 0, B is at (3a, 0) and A is at (0, −4a). The final distance between A and B is found to be constant and equal to x·a. Find x.",
s:"Let r be the A–B distance and Δx the x-separation. Then\ndr/dt = −u + u cosθ and d(Δx)/dt = u − u cosθ, so r + Δx is a constant of the motion.\nInitially r = 5a and Δx = 3a, so r + Δx = 8a always.\nFinally A trails directly behind B, so r = Δx ⟹ 2r = 8a ⟹ r = 4a.\nx = 4."},
{t:"Pointing method across a channel",ch:"rel",d:"Hard",src:"Relative-motion tut",tg:["MCQ","pursuit"],fig:"channel",
x:"Suppose you are anchored near the shore of a channel in which there is a steady current, and you are going to run your (motor) boat at constant throttle to a dock directly across the channel on the opposite shore. In the pointing method the nose of the boat is kept pointed directly at the dock. The boat's speed with respect to water is v, the water's speed is u and the width of the channel is b. The time taken by the boat to reach the dock is: (A) bv/(v²−u²) (B) b/√(v²−u²) (C) bu/v² (D) bv/u²",
s:"This is the classic pursuit problem. With r the distance to the dock and θ the angle between the boat's heading and the current,\ndr/dt = −v + u cosθ  and  d(component along the current)/dt = u − v cosθ.\nAdding the two suitably gives the invariant r·v + u·(along-current coordinate) — integrating from start (r = b) to finish (r = 0) gives\nt = bv/(v² − u²) → (A)."},
{t:"Fox chasing a rabbit with a lead",ch:"rel",d:"Hard",src:"Relative-motion tut",tg:["pursuit"],
x:"A rabbit is running along a straight road at a constant speed v₀. There is a fox at a distance L from the road. At the moment when the rabbit is closest to the fox, she notices him and gives chase. The speed of the fox is the same as that of the rabbit, but the fox runs with a 'lead' — the fox's speed vector is directed all the time to the point located in front of the rabbit at a distance d from him. Find the minimum distance between the race participants.",
s:"The fox is in an equal-speed pursuit of the virtual point that runs d ahead of the rabbit.\nFor equal-speed pursuit the quantity r + (separation measured along the prey's velocity) is conserved, where r is the fox-to-target distance.\nInitially r₀ = √(L² + d²) and the along-road separation is d, so the invariant is √(L²+d²) + d.\nFinally the fox trails the virtual point directly, so 2r∞ = √(L²+d²) + d.\nThe distance to the rabbit itself is r∞ − d = (√(L² + d²) − d)/2."},
{t:"Particle C between two approaching particles",ch:"rel",d:"Medium",src:"9 Jul",tg:["MCQ","paragraph"],
x:"Two particles A and B are moving towards each other on a straight line with equal speeds 5 m/s. At t = 0 the distance between them is 100 m. It is desired to move another particle C always maintaining a distance 40 m from A and 30 m from B. When and for how long can the particle C fulfil the given condition? (a) 3 ≤ t ≤ 9 s (b) 9 ≤ t ≤ 11 s (c) 11 ≤ t ≤ 17 s (d) 3 ≤ t ≤ 17 s",
s:"The separation is AB = 100 − 10t. A triangle with sides 40, 30 and AB exists only when\n|40 − 30| ≤ AB ≤ 40 + 30, i.e. 10 ≤ 100 − 10t ≤ 70.\nThat gives 3 s ≤ t ≤ 9 s → (a)."},
{t:"Speed of particle C at t = 5 s",ch:"rel",d:"Medium",src:"9 Jul",tg:["MCQ","paragraph"],
x:"For the same configuration — A and B approaching each other at 5 m/s from 100 m apart, with C always 40 m from A and 30 m from B — what is the speed of the particle C at the instant t = 5 s? (a) 3.5 m/s (b) 4.8 m/s (c) 5 m/s (d) 6 m/s",
s:"Put A at 5t and B at 100 − 5t, so D = AB = 100 − 10t and Ḋ = −10.\nThe foot of C from A is p = (40² + D² − 30²)/(2D) = 350/D + D/2 and its height y = √(1600 − p²).\nAt t = 5: D = 50, p = 32, y = 24 (the 30-40-50 triangle).\nṗ = (−350/D² + ½)Ḋ = −3.6, so ẋ_C = 5 + ṗ = 1.4 and ẏ_C = −pṗ/y = 4.8.\nSpeed = √(1.4² + 4.8²) = 5 m/s → (c)."},
{t:"Acceleration of particle C at t = 5 s",ch:"rel",d:"Hard",src:"9 Jul",tg:["MCQ","paragraph"],
x:"For the same configuration — A and B approaching each other at 5 m/s from 100 m apart, with C always 40 m from A and 30 m from B — what is the modulus of the acceleration of the particle C at t = 5 s? (a) 2.3 m/s² (b) 0.58 m/s² (c) 0.90 m/s² (d) 3.30 m/s²",
s:"Differentiate the same expressions once more (D̈ = 0):\np̈ = (700/D³)Ḋ² = (700/125000)(100) = 0.56, so ẍ_C = 0.56.\nFrom y² = 1600 − p²: ÿ = −[(ṗ² + p p̈) − ẏ²]/y = −2.25 (using p = 32, ṗ = −3.6, y = 24, ẏ = 4.8).\n|a| = √(0.56² + 2.25²) ≈ 2.3 m/s² → (a)."},
{t:"Anushka on the merry-go-round",ch:"rel",d:"Hard",src:"1 Aug",tg:["multi-correct","rotating frame"],fig:"merry",
x:"Anushka is sitting on the edge of a horizontal merry-go-round of radius 6 m that is rotating steadily. Virat stands still on the ground 12 m from the centre; their line of sight is horizontal. At one instant Virat observes Anushka moving directly towards him at 1 m/s, with no component of velocity perpendicular to the line joining them. At the same moment Anushka observes Virat moving at √n m/s, the distance between them decreasing at √m m/s, and Virat's velocity perpendicular to the line joining them equal to √p m/s. Choose the correct options. (A) m = 1 (B) n = 4 (C) p = 3 (D) The acceleration of Anushka as observed by Virat is constant.",
s:"Rate of change of separation is frame independent: √m = 1 ⟹ m = 1 — (A) correct.\nAnushka's frame rotates with ω = v/r. Since her velocity is entirely along the line of sight and the line of sight makes 90° at the tangent point, the geometry gives r = 6√3 for the line-of-sight length and ω = 1/6 rad/s.\nIn her (rotating) frame Virat picks up the extra term ω × r: v⊥ = ω(6√3) = √3 ⟹ p = 3 — (C) correct.\nSpeed² = 1² + (√3)² = 4 ⟹ n = 4 — (B) correct.\n(D) is false: her acceleration is centripetal of constant magnitude but continuously changing direction.\nCorrect: (A), (B), (C)."},
{t:"Disc on a conveyor belt: the path",ch:"rel",d:"Medium",src:"26 Jul test",tg:["MCQ","paragraph"],fig:"belt",
x:"A horizontal conveyor belt is running at a constant speed v_b = 3.0 m/s. A small disc enters the belt moving horizontally with a velocity v₀ = 4.0 m/s that is perpendicular to the velocity of the belt. The coefficient of friction between the disc and the belt is 0.50. What can you predict regarding the path of the disc? (a) Parabola relative to the belt (b) Straight line relative to the belt (c) Parabola relative to the ground (d) Both (b) and (c).",
s:"Relative to the belt the disc starts with velocity (−3, 4) and friction acts opposite to the relative velocity, so the relative motion is a straight line with constant deceleration μg = 5 m/s² — (b) is true.\nIn the ground frame the acceleration is that same constant vector while sliding lasts, and the initial velocity (0, 4) is not parallel to it, so the ground path is a parabola — (c) is true.\nAnswer (d)."},
{t:"Disc on a conveyor belt: belt width",ch:"rel",d:"Hard",src:"26 Jul test",tg:["MCQ","paragraph"],fig:"belt",
x:"For the same conveyor belt (v_b = 3.0 m/s, disc entering at v₀ = 4.0 m/s perpendicular to it, μ = 0.50), what should the minimum width of the belt be so that the disc always remains on the belt? (a) 0.9 m (b) 1.6 m (c) 2.0 m (d) 2.5 m",
s:"Relative speed at entry = √(3² + 4²) = 5 m/s, deceleration μg = 5 m/s².\nThe relative displacement before slipping stops = 5²/(2×5) = 2.5 m, along the fixed direction (−3, 4)/5.\nIts component across the belt (the v₀ direction) = 2.5 × 4/5 = 2.0 m.\nMinimum width 2.0 m → (c)."},
{t:"Disc on a conveyor belt: minimum speed",ch:"rel",d:"Medium",src:"26 Jul test",tg:["MCQ","paragraph"],fig:"belt",
x:"For the same conveyor belt (v_b = 3.0 m/s, disc entering at v₀ = 4.0 m/s perpendicular to it, μ = 0.50), what is the minimum speed of the disc relative to the ground? (a) 0.0 m/s (b) 1.8 m/s (c) 2.4 m/s (d) 3.0 m/s",
s:"Ground velocity = belt velocity + relative velocity = (3, 0) + s(−0.6, 0.8) with s running from 5 down to 0.\nThis traces a straight line in velocity space; the minimum |v| is the perpendicular distance from the origin to that line.\nMinimising: s = 1.8 gives v = (1.92, 1.44), |v| = 2.4 m/s → (c)."},
{t:"Boat, rafts and the river current",ch:"rel",d:"Medium",src:"26 Jul test",tg:["integer"],
x:"A motor-boat travelling upstream met rafts floating downstream. One hour after this, the engine of the boat stalled. It took 30 minutes to repair it, and during this time the boat freely floated downstream. When the engine was repaired, the boat travelled downstream with the same speed relative to the current as before and overtook the rafts at a distance s = 7.5 km from the point where they had first met. Determine the velocity of the river current, assuming it to be constant.",
s:"Work in the water frame: the rafts are at rest there, and the boat moves away at its constant relative speed for 1 h, is motionless during the 30 min repair, and then comes back — taking another 1 h to undo the 1 h of separation.\nSo the total time between meeting and overtaking is 1 + 0.5 + 1 = 2.5 h.\nIn the ground frame the rafts drifted the full 7.5 km in that time.\nv_current = 7.5/2.5 = 3 km/h ≈ 0.83 m/s."},

{t:"Driver on an elliptical track",ch:"circ",d:"Medium",src:"2 Aug",tg:["subjective","radius of curvature"],fig:"ellipse",
x:"The racing car travels with a constant speed of 240 km/h around the elliptical race track x²/16 + y²/4 = 1 (axes in km). Determine the acceleration experienced by the driver at B, the end of the minor axis.",
s:"Constant speed ⇒ only the normal component survives: a = v²/ρ.\nFor x²/a² + y²/b² = 1 the radius of curvature at the end of the minor axis (0, b) is ρ = a²/b = 16/2 = 8 km.\na = 240²/8 = 7200 km/h² ≈ 0.56 m/s², directed towards the centre of curvature.\n(You can also get it by differentiating the ellipse twice: x v_x = −4y v_y, then set v_y = 0 and a_x = 0 at B.)"},
{t:"Same point, twice the speed",ch:"circ",d:"Medium",src:"2 Aug",tg:["subjective","radius of curvature"],fig:"parabola",
x:"A particle is moving along the parabola y = 4x² + 8x + 10. At a certain point its speed is a constant 10 m/s and its acceleration is 5 m/s². If at the same point the particle instead moves with a constant speed of 20 m/s, what is its acceleration there?",
s:"The radius of curvature is a purely geometric property of the path, so it is the same in both cases.\nConstant speed ⇒ a = a⊥ = v²/ρ. From the first case ρ = 10²/5 = 20 m.\nWith v = 20 m/s: a = 20²/20 = 20 m/s², directed along the normal."},
{t:"Point kept collinear on a circular track",ch:"circ",d:"Hard",src:"2 Aug",tg:["subjective"],fig:"tangent",
x:"A straight track is tangent to a circular track of radius r. Two material points A and B start simultaneously from the common point of the tracks. The point A moves with uniform velocity u on the straight track whereas the point B on the circular track always keeps itself collinear with the centre of the circular track and the point A. Find a suitable expression for the magnitude of acceleration of the point B when it is at angular position θ.",
s:"With the tangent point as origin, A is at distance ut and tanθ = ut/r, so θ̇ = (u/r)cos²θ.\nDifferentiating: θ̈ = −2(u²/r²)cos³θ sinθ.\nB moves on the circle, so a⊥ = rθ̈ and a_c = rθ̇².\na = r√(θ̈² + θ̇⁴) = (u²/r)cos³θ·√(1 + 3sin²θ)."},
{t:"Disc on an incline with μ = tan α",ch:"circ",d:"Hard",src:"2 Aug",tg:["Irodov","subjective"],fig:"incline",
x:"A small disc A is placed on an inclined plane forming an angle α with the horizontal and is imparted an initial velocity v₀. Find how the velocity of the disc depends on the angle θ shown in the figure, if the friction coefficient μ = tan α and at the initial moment θ = π/2.",
s:"Along the path, the tangential equation is dv/dt = g sinα cosθ − μg cosα = g sinα(cosθ − 1).\nPerpendicular to the path, the normal equation gives v dθ/dt = −g sinα sinθ.\nDividing the two: dv/v = (cosθ − 1)/(−sinθ) dθ, which integrates to\nv(1 + cosθ) = constant.\nWith v = v₀ at θ = π/2: v = v₀/(1 + cosθ)... note that as θ → 0 the speed tends to v₀/2."},
{t:"Chaser starting from the centre",ch:"circ",d:"Hard",src:"2 Aug",tg:["subjective"],
x:"Starting from the centre of a circular path of radius R, a particle P chases another particle Q that is moving with a uniform speed v on the circular path. The chaser P moves with a constant speed u and always remains collinear with the centre and the location of the chased Q. (a) On which path will P eventually move and how long will it take to reach this path? Consider u < v, u = v and u > v. (b) If v = 4 m/s, u = 8 m/s and R = 84 m, how long will P take to reach Q? Use π = 22/7.",
s:"At radius r, P's tangential speed is forced to be ωr = vr/R, so its radial speed is ṙ = √(u² − v²r²/R²).\nt = ∫₀^r dr/√(u² − v²r²/R²) = (R/v)·sin⁻¹(vr/Ru).\n(a) If u > v, P reaches the circle (r = R) at t = (R/v)sin⁻¹(v/u). If u = v it approaches r = R asymptotically (t = πR/2v as a limit). If u < v it can never exceed r = Ru/v and finally moves on that smaller circle.\n(b) t = (84/4)sin⁻¹(1/2) = 21 × π/6 = 11 s — and since P is collinear with Q, arriving at the circle means arriving at Q."},

{t:"M and 2M on a table, block m below",ch:"nlm",d:"Medium",src:"NLM tutorial",tg:["pulley","constraint"],fig:"pulleyM2M",
x:"In the system (see figure) the thread is very light and inextensible. Loads whose masses are M and 2M are first held and then released. With what acceleration will the load of mass m begin to move? There is no friction in the system.",
s:"Constraint from the string: 2x₁ + 2x₂ − x₃ = 0 ⟹ 2(a₁ + a₂) = a₃.\nEquations of motion: 2T = 2Ma₁, 2T = Ma₂, mg − T = ma₃.\nSubstituting a₁ = T/M and a₂ = 2T/M into the constraint:\n2(T/M + 2T/M) = g − T/m ⟹ 6T/M = g − T/m ⟹ T = g/(6/M + 1/m).\nHence a₃ = g/(1 + M/6m)."},
{t:"Three equal weights on light pulleys",ch:"nlm",d:"Hard",src:"NLM tutorial",tg:["pulley","constraint"],fig:"pulleyEq",
x:"In the system shown in the figure the weights have equal masses, the pulleys and strings are very light and the strings are inextensible, with their free pieces vertical. Find the accelerations of the pulleys. The axis of the top pulley is fixed.",
s:"String constraint: x₁ + (x₁ − x₂) + x₂ + (x₃ − x₂) + (x₃ − x₁) = l ⟹ x₁ − x₂ + 2x₃ = const ⟹ a₁ − a₂ + 2a₃ = 0.\nNewton for each body: 2T − (T + mg) = ma₂ for the middle pulley, 2T + mg − T = mb₂, and 2mg − 4T = 2ma₃ for the bottom pulley, with a₁ + b₂ = 2a₃ linking them.\nSolving the set gives a₁ = −0.6g, a₂ = −g, a₃ = 0.2g (negative = upward)."},
{t:"Second pulley stack",ch:"nlm",d:"Hard",src:"NLM tutorial",tg:["pulley","constraint"],fig:"pulleyStack",
x:"For the pulley arrangement shown, the virtual-work relation for the strings reads −T x₁ + T x₂ − 4T x₃ = 0. Set up the constraint and the equations of motion and find the accelerations of the blocks and the tension in the string.",
s:"The virtual-work relation gives the constraint directly: x₁ + 4x₃ = x₂, so a₁ + 4a₃ = a₂.\nWrite Newton's law for each hanging body with tensions T, 2T and 4T (each movable pulley doubles the tension carried):\nmg − T = ma₁, mg − 2T = ma₂, mg − 4T = ma₃ (signs to be fixed from the chosen positive direction).\nSubstituting into the constraint gives one equation in T; solving it and back-substituting gives all three accelerations."},
{t:"Wedge tied to its own puck",ch:"nlm",d:"Hard",src:"NLM tutorial",tg:["olympiad","constraint"],fig:"wedgePuck",
x:"On a smooth horizontal surface there is a wedge with a height of h = 30 cm and a base width of d = 40 cm. On its smooth inclined plane sits a small puck, which is connected to the wedge by a weightless, inextensible string passed over two pulleys (see figure). The pulleys are weightless and rotate without friction. The mass of the wedge is n = 8 times greater than the mass of the puck. With what acceleration will the wedge begin to move after being released? Take g ≈ 9.8 m/s². The motion of the wedge is translational.",
s:"String constraint: 2x₁ + x₂ = l, so the puck's acceleration relative to the wedge is a₂ = 2a₁.\nSystem equation along the horizontal: 2T = na₁m + m(a₁ − a₂cosα), and along the incline for the puck: mg sinα + ... − T = ma₂.\nEliminating T gives\nA = g·2sinα/(n + 5 − 4cosα).\nWith tanα = 30/40 ⇒ sinα = 0.6, cosα = 0.8 and n = 8: A = 6g/49 = 1.2 m/s²."},
{t:"Infinite Atwood's machine",ch:"nlm",d:"Hard",src:"9 Jul",tg:["infinite series"],fig:"atwood",
x:"Consider the infinite Atwood's machine shown below. A string passes over each pulley, with one end attached to a mass and the other end attached to another pulley. All the masses are equal to m, and all the pulleys and strings are massless. The masses are held fixed and then simultaneously released. What is the acceleration of the top mass?",
s:"Effective-mass method: an Atwood machine with m on one side and effective mass M on the other presents an effective mass 4mM/(m+M) to its support. The machine below the first pulley is a copy of the whole machine, so\nM = 4mM/(m + M) ⟹ M = 3m.\nThe top mass then hangs opposite an effective 3m:\na = (3m − m)g/(3m + m) = g/2, directed upward.\n(Equivalently, ΣTᵢaᵢ = 0 with Tₙ = T/2ⁿ⁻¹ gives 2Tg = (4/3)T²/m ⟹ T = 3mg/2 ⟹ a = g/2 up. If instead the masses are m, 2m, 4m, … the same method gives T = 7mg/4 and a = 3g/4 up.)"},
{t:"Bar sliding across a friction boundary",ch:"nlm",d:"Hard",src:"22 Jul",tg:["continuous body","subjective"],fig:"barIncl",
x:"A homogeneous bar of mass m is released from rest on a fixed inclined plane of inclination θ above the horizontal. The upper part of the plane is not frictionless and the lower part is frictionless. The coefficient of friction between the bar and the upper part of the plane is μ. What will be the maximum tensile force in the bar while it is sliding on the plane? Acceleration of free fall is g.",
s:"Let a fraction of the bar of mass m₁ be on the rough part and m₂ = m − m₁ on the smooth part.\nWhole bar: a = [mg sinθ − μm₁g cosθ]/m.\nFor the smooth-side piece: m₂g sinθ − T = m₂a ⟹ T = μ m₁m₂ g cosθ/m.\nThis is maximum when m₁ = m₂ = m/2, i.e. the junction is at the middle of the bar, and the tension is always largest at the junction itself.\nT_max = μmg cosθ/4."},
{t:"Rope pulled off the ground at one end",ch:"nlm",d:"Hard",src:"27 Aug",tg:["subjective","variable mass"],fig:"rope",
x:"A homogeneous rope of mass per unit length λ and length l is kept on the ground with one end of the rope fixed to the ground at O. The left end of the rope (with respect to the fixed end) is pulled by an external agent which imparts a constant velocity V to it. Find the rate at which the length of the moving part is increasing, and the work done by the force in moving that end from the extreme left to the extreme right side.",
s:"If the pulled end is at x and the fold at x − y, the rope length condition is 2x − y = l, so 2ẋ = ẏ: the fold advances at V/2 and the moving portion grows at V/2 (the moving part travels at V/2 while the pulled end moves at V).\nMomentum of the moving part: p = λ(x − y)·V/… differentiating, F = dp/dt = λV²/2, a constant.\nThe pulled end travels 2l, so W = F × 2l = λV²l.\nNote ½(λl)V² ≠ W: the difference is the energy lost in picking the rope up at the fold, so the naive energy method fails here."},

{t:"No slipping anywhere: which masses?",ch:"fric",d:"Medium",src:"Friction tut",tg:["multi-correct"],fig:"fricMm",
x:"In the system shown, the coefficient of static friction between all the surfaces in contact is 0.2. For which sets of values of masses M and m is there no slipping anywhere? (A) 4 kg and 1 kg (B) 4 kg and 2 kg (C) 3 kg and 1 kg (D) 10 kg and 2 kg",
s:"For the hanging block, T = mg. For the big block M, the string pulls it while the ground presses with N = Mg + T.\nNo slipping needs T ≤ μ_s(Mg + T):\nmg(1 − μ_s) ≤ μ_s Mg ⟹ m ≤ μ_sM/(1 − μ_s) = M/4.\nCheck: (A) 1 ≤ 1 ✓ (B) 2 ≤ 1 ✗ (C) 1 ≤ 0.75 ✗ (D) 2 ≤ 2.5 ✓.\nAnswer: (A) and (D)."},
{t:"Blocks on a massless belt",ch:"fric",d:"Hard",src:"Friction tut",tg:["MCQ"],fig:"beltBlocks",
x:"Two 30 kg blocks rest on a massless belt which passes over a fixed pulley and is attached to a 40 kg block. If the coefficient of friction between the belt and the table as well as between the belt and the blocks B and C is μ and the system is released from rest from the position shown, the speed with which the block B falls off the belt is: (A) 2√2 m/s if μ = 0.2 (B) √2 m/s if μ = 0.2 (C) 4 m/s if μ = 0.5 (D) 2.5 m/s if μ = 0.5",
s:"If the blocks do not slip on the belt, the whole 100 kg moves together against the table friction under the 30+30 kg load:\na = [400 − μ(600)]/100 = 4 − 6μ.\nFor block B not to slip, the friction needed, 30(4 − 6μ), must not exceed μ(300): 4 − 6μ ≤ 10μ ⟹ μ ≥ ¼.\nSo for μ = 0.2 the blocks do slip; the belt slides under B, which is dragged by friction with a = μg = 2 m/s² and falls off after 2 m: v = √(2×2×2) = 2√2 m/s → (A)."},
{t:"Eraser dragged by a ruler",ch:"fric",d:"Hard",src:"Friction tut",tg:["subjective"],fig:"ruler",
x:"A long ruler AB and an eraser C lie on a horizontal rough table. The ruler is moved evenly and progressively in the direction shown by the arrow in the figure (top view) and moved a distance H. The angle between the ruler and this direction is equal to α. Find the magnitude and direction of the eraser's movement relative to the table. The coefficient of friction between the eraser and the ruler is μ.",
s:"The ruler pushes the eraser with a normal force N perpendicular to the ruler and a friction μN along it, so the total force on the eraser makes an angle β = tan⁻¹μ with the ruler's normal. The eraser slides steadily in that direction.\nIf μ > cot α the eraser is simply carried along with the ruler and moves H.\nIf μ < cot α the eraser slips along the ruler and its displacement is\nL = H sinα√(1 + μ²), directed at angle β = tan⁻¹μ from the normal to the ruler."},
{t:"Force on A through the pulley train",ch:"fric",d:"Hard",src:"Friction tut-2",tg:["matrix-match"],fig:"fricAB",
x:"In the shown diagram A is of mass 50 kg, B is of mass 5 kg. The coefficient of friction between A and the ground is 0.2 and friction is absent between B and the ground. A horizontal force F is applied on B. With f₁ the friction force between A and the ground, a₁ the acceleration of A and a₂ that of B, match Column I — (A) F = 100 N, (B) F = 125 N, (C) F = 192.5 N, (D) F = 80 N — with Column II — (P) f₁ = 80 N, (Q) a₁ = 0, (R) f₁ = 125 N, (S) a₁ = 1 m/s², (T) a₂ = 1 m/s².",
s:"The pulley arrangement gives the string tension T on A a vertical component, so the normal reaction on A is N = 500 + T and A only moves when\nT > μN = 0.2(500 + T) ⟹ 0.8T > 100 ⟹ T > 125 N.\nBelow that threshold nothing moves and the friction is purely static, f₁ = T.\nAbove it, F − T = 5a and T − 0.2(500 + T) = 50a.\nAnswer: (A)→(Q); (B)→(Q,R); (C)→(S,T); (D)→(P,Q)."},
{t:"Least force to start a three-block stack",ch:"fric",d:"Medium",src:"Friction tut-2",tg:["MCQ"],fig:"stack3",
x:"Find the least horizontal force P to start motion of any part of the system of the three blocks resting upon one another as shown in figure. The weight of blocks are A = 300 N, B = 100 N and C = 200 N. Between A and B, μ = 0.3. Between B and C, μ = 0.2. Between C and the ground, μ = 0.1. (A) 90 N (B) 60 N (C) 80 N (D) 100 N",
s:"Limiting friction at each surface:\nA on B: 0.3 × 300 = 90 N.\nB on C: 0.2 × 400 = 80 N.\nC on ground: 0.1 × 600 = 60 N.\nP has to overcome whichever of these blocks first, and the whole stack slides on the ground once P exceeds 60 N — the smallest of the three.\nLeast P = 60 N → (B)."},
{t:"Where does slipping start first?",ch:"fric",d:"Medium",src:"Friction tut-2",tg:["proof"],
x:"As the applied force F on a stack of blocks is increased, is it true that slipping first occurs at the surface with the least limiting friction (f_s)max? Prove or disprove.",
s:"Disprove — the claim compares the wrong pair of numbers. What matters is which surface first has its *required* friction exceed its *own* limit, and the required friction at each surface depends on the mass that surface has to accelerate.\nIn the three-block problem above, the required frictions while everything moves together with a = (P − 60)/60 are different fractions of P at each interface; the ground surface, with the smallest limit, is the first to give way only because its required force also grows fastest.\nA counterexample is easy to build: give the top interface a small limit but almost no mass above it, and it will never be the first to slip."},
{t:"Pulling the platform with a protrusion",ch:"fric",d:"Hard",src:"Friction tut-2",tg:["olympiad","subjective"],fig:"platform",
x:"A small body of mass m lies on a platform with a rectangular protrusion of height h. One end of a weightless, inextensible string is attached to it, passing over an ideal pulley mounted on the protrusion of the platform. The second end of the string is fixed to a vertical wall so that the section of the string between the pulley and the wall is horizontal. The platform is moved away from the wall at a constant speed v. With what force F must the platform be pulled at the moment when the section of the string above the platform makes an angle α with the horizontal? The force F is horizontal and in the plane of the drawing. The coefficient of friction between body and platform is μ; there is no friction between the platform and the floor.",
s:"Geometry: the body is at horizontal distance x = h cot α from the pulley, and the string length from wall to pulley grows at v, so the body approaches the pulley along the string at rate v.\nHence the body's speed relative to the platform is u = v/cosα, and differentiating x = h cotα with the string condition gives its relative acceleration and thus α̇.\nWrite Newton's law for the body (tension T at angle α, weight, normal N, kinetic friction μN) and for the platform (F, the pulley reactions, the reaction to N and friction).\nEliminating T and N between the two sets gives F; the key intermediate results are α̇ = (v sin²α)/(h cos α)·… and N = mg − T sinα."},

{t:"Disc winding onto a cylinder, with friction",ch:"wpe",d:"Hard",src:"27 Aug",tg:["subjective"],fig:"discCyl",
x:"A disc placed on a large horizontal floor is connected to a vertical cylinder of radius r fixed on the floor with the help of a light inextensible cord of length l as shown in the figure. The coefficient of friction between the disc and the floor is μ. The disc is given a velocity u parallel to the floor and perpendicular to the cord. How long will the disc slide on the floor before it hits the cylinder?",
s:"The cord stays perpendicular to the velocity as it winds, so the tension does no work and only friction decelerates the disc: dv/dt = −μg, a constant.\nPath length to the cylinder: with free length L, dL = −r dφ and ds = L dφ = −L dL/r, so s = ∫₀^l L dL/r = l²/2r.\nIf u² > 2μg·(l²/2r) = μgl²/r the disc reaches the cylinder at\nt = [u − √(u² − μgl²/r)]/(μg);\notherwise it stops first, at t = u/(μg)."},
{t:"Frictionless winding (Irodov 1.138)",ch:"wpe",d:"Medium",src:"27 Aug",tg:["Irodov"],fig:"discCyl",
x:"A horizontal plane supports a stationary vertical cylinder of radius R and a disc A attached to the cylinder by a horizontal thread AB of length l₀. An initial velocity v₀ is imparted to the disc as shown in the figure. How long will it move along the plane until it strikes against the cylinder? The friction is assumed to be absent.",
s:"The tension is always perpendicular to the velocity, so the speed stays v₀ throughout.\nWith free thread length L, a turn dφ shortens it by dL = −R dφ and the disc travels ds = L dφ.\ns = ∫₀^{l₀} L dL/R = l₀²/2R.\nt = s/v₀ = l₀²/(2Rv₀)."},
{t:"Spring network released from rest",ch:"wpe",d:"Hard",src:"27 Aug",tg:["energy","springs"],fig:"spring",
x:"All springs in the arrangement are initially unstretched and the block is then released from rest. Find the maximum downward displacement of the block.",
s:"Reduce the network to a single equivalent spring k_eff by combining the springs in series and parallel (equal tensions in series, equal extensions in parallel; here the pulley-linked springs share the load in the ratio the string constraint dictates).\nOnce that is done, energy conservation from rest to rest gives\nmg·x = ½k_eff x² ⟹ x_max = 2mg/k_eff,\nexactly twice the static equilibrium extension. (In this sheet's network the reduction works out to k_eff = k/33, giving x_max = 66mg/k — recheck the reduction against your own figure.)"},
{t:"Elastic cord lifted by hand",ch:"wpe",d:"Medium",src:"27 Aug",tg:["MCQ","springs"],fig:"cord",
x:"One end of an elastic cord is attached to a block of mass m and the other end is held keeping the cord relaxed and vertical. The relaxed length of the cord is l and there is a mark P at a height 0.8l from the lower end. If the upper end is slowly raised, the block leaves the ground when the mark P reaches the point where the upper end of the relaxed cord initially was. Expression for the work done by the force applied by the hand is (a) mgl/16 (b) mgl/8 (c) mgl/5 (d) mgl/4",
s:"When the cord is stretched by x, a point originally at height y from the bottom rises by (y/l)x. The mark P moves up by (0.8l/l)x = 0.8x, and it has to travel 0.2l:\n0.2l = 0.8x ⟹ x = l/4.\nThe block leaves the ground when kx = mg, so k = 4mg/l.\nThe hand's work equals the elastic energy stored (the block hasn't moved yet):\nW = ½kx² = ½(mg)(l/4) = mgl/8 → (b)."},
{t:"Tangential force on a spiral path",ch:"wpe",d:"Hard",src:"18 Aug",tg:["subjective","line integral"],fig:"spiral",
x:"A particle moves along the spiral r = r₀e^θ. There exists a tangential force F = F₀[1 + kS] t̂, where k is a positive constant and S is the distance travelled by the particle. What is the work done by the force till the particle crosses the x-axis for the first time?",
s:"Arc length on the spiral: ds = √((r dθ)² + dr²) and dr = r dθ, so ds = √2 r dθ.\nS₀ = √2∫₀^{2π} r₀e^θ dθ = √2 r₀(e^{2π} − 1).\nThe force is purely tangential, so\nW = ∫₀^{S₀} F₀(1 + kS) dS = F₀S₀ + ½kF₀S₀²,\nwith S₀ = √2 r₀(e^{2π} − 1)."},
{t:"Work by a rotational field on nested circles",ch:"wpe",d:"Hard",src:"18 Aug",tg:["series","line integral"],fig:"circles45",
x:"A particle is moving under the influence of a force F = k(−y î + x ĵ) along with many other forces. There exist a set of infinite circles C₁, C₂, C₃, …, ∞ as shown, each of half the radius of the previous one, arranged along a 45° line. If the work done by this force in completing the circular path in each circle is W₁, W₂, W₃, …, W∞, and the particle moves anticlockwise in every circle, find the value of W₁ + W₂ + W₃ + … + W∞.",
s:"F = k(−y î + x ĵ) is tangential with magnitude kr about the origin, and its curl is 2k (uniform).\nFor any closed anticlockwise loop, W = ∮F·ds = 2k × (area enclosed) — independent of where the loop sits.\nSo Wₙ = 2πkRₙ² with Rₙ = R₀/2ⁿ⁻¹.\nΣW = 2πkR₀²Σ(1/4)ⁿ⁻¹ = 2πkR₀²(4/3) = 8πkR₀²/3."},
{t:"Which statements about F = (y î − x ĵ)/(x²+y²) are wrong?",ch:"wpe",d:"Hard",src:"18 Aug",tg:["multi-correct","line integral"],fig:"fieldPaths",
x:"A particle is moving in the x–y plane; let F = (y î − x ĵ)/(x² + y²) be one of the forces acting on it. All coordinates are in SI units. Which of the following options is/are incorrect? (A) Work done by this F when the particle moves in the triangular loop ABCA is zero. (B) Work done by this force in the open path MNQ is π/2. (C) Work done by this force when the particle moves on the circle of radius 1 m centred at (5, 0) is zero.",
s:"Write F in polar form: F = −θ̂/r, so F·ds = −r dθ/r = −dθ.\nThe work along any path is simply −Δθ, minus the angle swept about the origin.\n(A) The triangle ABCA does not enclose the origin, so Δθ = 0 and W = 0 — correct.\n(B) MNQ runs from M(1,0) to Q(0,1), sweeping +π/2, so W = −π/2, not +π/2 — incorrect.\n(C) The circle at (5,0) of radius 1 does not enclose the origin, so W = 0 — correct.\nThe incorrect statement is (B)."},
{t:"Matching work done around two circles",ch:"wpe",d:"Hard",src:"18 Aug",tg:["matrix-match","line integral"],fig:"twoCircles",
x:"In the x–y plane there exist 2 circles C₁: (x−1)² + (y−2)² = 4 and C₂: (x−5)² + (y−2)² = 4. In the region there exist two variable forces F₁ = k{(1−y)î + (x−2)ĵ} and F₂ = k{(1−y)î + (x−2)ĵ}/[(1−y)² + (x−2)²]. Let W_ij represent the work done by F_i in a complete anticlockwise rotation along circle C_j. Match (P) W₁₁, (Q) W₁₂, (R) W₂₁, (S) W₂₂ with (1) 2πk (2) 4πk (3) 8πk (4) 16πk (5) 0.",
s:"Both fields circulate about the point (2, 1).\nF₁ has uniform curl 2k, so W = 2k × area = 2k(π·2²) = 8πk for either circle: P→3, Q→3.\nF₂ is the vortex field k θ̂/ρ about (2,1): its circulation is 2πk if the loop encloses (2,1) and 0 otherwise.\nDistance from (2,1) to C₁'s centre (1,2) is √2 < 2 — enclosed, so W₂₁ = 2πk: R→1.\nDistance to C₂'s centre (5,2) is √10 > 2 — not enclosed, so W₂₂ = 0: S→5.\nAnswer: (B) P−3, Q−3, R−1, S−5."},

{t:"Lifting a ball off the floor through a cord",ch:"com",d:"Hard",src:"23 Sep",tg:["subjective","C-frame"],fig:"balls",
x:"Two identical small balls A and B each of mass m connected by a light inextensible cord of length l are placed on a frictionless horizontal floor. With what velocity u must the ball B be projected vertically upwards so that the ball A leaves the floor? Acceleration of free fall is g.",
s:"Once the cord goes taut the pair moves as one; work in the centre-of-mass frame. At the moment A is about to lift off, with the cord at angle θ to the floor:\nT sinθ = mg (vertical equilibrium of A).\nEnergy: ½mu² = mv² + mv_cm² + mgl sinθ with v_cm = v cosθ, giving u² = 2(v² + v_cm²) + 2gl sinθ.\nUsing the circular motion of B about the centre of mass, the condition reduces to\nu² = gl[2/sinθ + sinθ].\nThe bracket is a decreasing function of sinθ on (0,1], so it is least at sinθ = 1 (θ = 90°):\nu² = 3gl ⟹ u ≥ √(3gl)."},
{t:"Three rods: relation between the accelerations",ch:"com",d:"Medium",src:"23 Sep",tg:["MCQ","C-frame"],fig:"rods",
x:"Ends of three light identical rods each of length l are connected to a light pivot that enables them to rotate in any direction. At the other ends of the rods, three particles A, B and C of masses m, 2m and 3m respectively are affixed. Initially the rods are coplanar, the angle between any two adjacent rods is 120° and the particles are at rest. Now the particle C is given a velocity u perpendicular to the rod connected to it and in the plane of the rods. Ignore gravitational interaction between the particles. Denoting the acceleration vectors by a_A, a_B and a_C, which conclusion can you make? (a) a_A + a_B + a_C = 0 (b) 3a_A + 2a_B + a_C = 0 (c) a_A + 2a_B + 3a_C = 0 (d) None",
s:"All the forces are internal (rod forces and the massless pivot), so the centre of mass has zero acceleration:\nm a_A + 2m a_B + 3m a_C = 0 ⟹ a_A + 2a_B + 3a_C = 0.\nAnswer (c)."},
{t:"Three rods: moduli of the accelerations",ch:"com",d:"Hard",src:"23 Sep",tg:["MCQ","C-frame"],fig:"rods",
x:"For the same three-rod system — particles m, 2m and 3m on light rods of length l at 120°, with C given a velocity u perpendicular to its rod — what are the moduli of the acceleration vectors of the particles A, B and C immediately after the particle C is given velocity u? (a) All equal to u²/l (b) 3u²/l, 3u²/2l and u²/l (c) 6u²/11l, 3u²/11l and 2u²/11l (d) 12u²/13l, 6u²/13l and 4u²/13l",
s:"The pivot is massless, so the three rod forces balance: T_A û_A + T_B û_B + T_C û_C = 0. With 120° between the rods, T_A = T_B = T_C = T.\nEach particle: aᵢ = −(T/mᵢ)ûᵢ. The rods are rigid, so the radial relative acceleration of particle i is −v_rel²/l:\n(aᵢ − a_P)·ûᵢ = −vᵢ²/l.\nA and B are at rest, C has speed u. Adding the three projections and using û_A + û_B + û_C = 0:\nT(1 + ½ + ⅓)/m = u²/l ⟹ T = 6mu²/11l.\na_A = 6u²/11l, a_B = 3u²/11l, a_C = 2u²/11l → (c)."},

{t:"Particle returning inside a ring after two bounces",ch:"coll",d:"Hard",src:"Tutorial 15",tg:["subjective","restitution"],fig:"ring",
x:"A smooth ring is kept on a smooth horizontal surface. From a point P of the ring a particle is projected at an angle α to the radius vector at P. If ½ is the coefficient of restitution between the ring and the particle, the particle will return to the point of projection after two reflections if α = ?",
s:"At a smooth surface the tangential velocity survives and the normal component is multiplied by e, so an impact turns an incidence angle θ (from the normal) into tanφ = tanθ/e.\nThe three chords P→Q→R→P subtend angles 2α, 2β, 2γ at the centre, and they must close the circle: 2(α + β + γ) = π, i.e. α + β + γ = π/2.\nThen tan(α+β+γ) is undefined, which forces its denominator to vanish:\n1 − tanα tanβ − tanβ tanγ − tanγ tanα = 0.\nWith e = ½, tanβ = 2tanα and tanγ = 2tanβ = 4tanα:\n1 − 2tan²α − 8tan²α − 4tan²α = 0 ⟹ 14tan²α = 1.\nα = tan⁻¹(1/√14)."},
{t:"Ball off a wall and back to the hand",ch:"coll",d:"Medium",src:"Tutorial 15",tg:["subjective","elastic"],fig:"wall",
x:"A small boy is throwing a ball towards a wall 6 m in front of him. He releases the ball at a height of 1.4 m from the ground. The ball bounces from the wall at a height of 3 m, rebounds from the ground and reaches the boy's hand exactly at the point of release. Assuming the two bounces (one from the wall and the other from the ground) to be perfectly elastic, how far ahead of the boy did the ball bounce from the ground?",
s:"Both bounces are elastic, so unfold them: reflect the path in the wall and in the ground, and the whole flight becomes a single projectile that starts and ends at the release height, with horizontal range R = 2 × 6 = 12 m.\nUse y = x tanθ(1 − x/R) measured from the launch point of the unfolded parabola. If the ground bounce is a distance d ahead of the boy,\n1.4 = d tanθ(1 − d/12)   …(1)\n3 = (6 + d) tanθ(1 − (6+d)/12)   …(2)\nDividing (1) by (2) eliminates tanθ:\n1.4/3 = d(1 − d/12)/[(6+d)(1 − (6+d)/12)].\nSolving gives d = 1.5 m."},
{t:"Maximum deflection of the heavier ball",ch:"coll",d:"Hard",src:"Tutorial 15",tg:["Irodov","elastic"],fig:"deflect",
x:"A particle of mass m₁ collides elastically with a stationary particle of mass m₂ (m₁ > m₂). Find the maximum angle through which the striking particle may deviate as a result of the collision. (Equivalently: a mass M collides elastically with a stationary mass m; if M < m it can bounce straight back, but if M > m there is a maximum deflection angle for M — find it.)",
s:"Go to the centre-of-mass frame. There the elastic collision only rotates each velocity: m₁ keeps the speed m₂u/(m₁+m₂) and its direction is free.\nTransforming back, the lab velocity of m₁ is the fixed vector v_cm = m₁u/(m₁+m₂) plus a vector of constant length m₂u/(m₁+m₂) pointing anywhere — the tip lies on a circle of radius m₂u/(m₁+m₂) centred at distance m₁u/(m₁+m₂) from the origin.\nSince m₁ > m₂ the origin lies outside the circle, so the deflection is bounded by the tangent line from the origin:\nsinθ_max = [m₂u/(m₁+m₂)] / [m₁u/(m₁+m₂)] = m₂/m₁.\nθ_max = sin⁻¹(m₂/m₁)."},
{t:"Restitution from the deformation and restitution impulses",ch:"coll",d:"Medium",src:"Tutorial 15",tg:["proof","restitution"],fig:"collide",
x:"Two particles of masses m₁ and m₂ approach along a line with speeds u₁ > u₂ and separate with speeds v₁ and v₂. Splitting the collision at the instant of maximum deformation (common velocity v), let I_D be the impulse of deformation and I_R the impulse of restitution. Show that I_R/I_D equals the coefficient of restitution (v₂ − v₁)/(u₁ − u₂).",
s:"At maximum deformation both bodies share the common velocity v = (m₁u₁ + m₂u₂)/(m₁ + m₂) by conservation of momentum.\nFor body 1, deformation phase: I_D = m₁v − m₁u₁; restitution phase: I_R = m₁v₁ − m₁v.\nTherefore\nI_R/I_D = (v₁ − v)/(v − u₁).\nSubstituting v = (m₁u₁ + m₂u₂)/(m₁+m₂) makes the m₂/(m₁+m₂) factors cancel top and bottom:\nI_R/I_D = (v₂ − v₁)/(u₁ − u₂) = e.\nSo the usual restitution rule is just the statement that the restitution impulse is e times the deformation impulse."},
{t:"Jerk through an almost inextensible cord",ch:"coll",d:"Hard",src:"Tutorial 15",tg:["subjective","restitution"],fig:"cordBlocks",
x:"Two blocks A and B of masses m_A and m_B placed on a frictionless horizontal floor are connected by a light, almost inextensible cord. The block A is given a velocity u away from the block B. If the coefficient of restitution defined for the cord has a value e, find the velocity with which block B begins to move.",
s:"The cord goes taut and jerks the blocks exactly like a collision: the 'deformation' phase is the cord stretching to its maximum, the 'restitution' phase is it pulling back.\nAt maximum stretch both blocks move with the common velocity\nv = m_A u/(m_A + m_B).\nFor block B: I_D = m_B v − 0 and I_R = m_B v_B − m_B v.\nSetting I_R/I_D = e:\n(m_B v_B − m_B v)/(m_B v) = e ⟹ v_B = (1 + e)v.\nv_B = (1 + e)m_A u/(m_A + m_B).\n(With e = 0, a truly inextensible cord, both move together at v, as expected.)"},

{t:"Projectile inside a cylindrical room",ch:"proj",d:"Medium",src:"Surprise test",tg:["MCQ","elastic"],fig:"cylRoom",
x:"Q1. A particle projected at an angle θ with the horizontal from the centre of the floor of a cylindrical room of radius r returns to the point of projection after three elastic collisions with the walls and the ceiling. If the particle remains in air for time T, find the speed of projection. (a) 3r/(T cosθ) (b) 4r/(T cosθ) (c) 2√(gr/sin2θ) (d) > 2√(gr/sin2θ)",
s:"Elastic bounces off the vertical wall reverse only the horizontal velocity; the ceiling bounce reverses only the vertical one. So the horizontal speed u cosθ never changes in magnitude.\nThe three collisions are wall → ceiling → opposite wall. Horizontally the particle goes centre → wall (r) → opposite wall (2r) → centre (r), a total path of 4r.\n4r = (u cosθ)T ⟹ u = 4r/(T cosθ) → (b).\n(Option (d) is also a true statement — the ceiling bounce shortens the flight, so u must exceed the free-flight value — but (b) is the answer in terms of T.)"},
{t:"Shell bursting into three fragments: energy released",ch:"com",d:"Medium",src:"Surprise test",tg:["MCQ","paragraph"],
x:"Q2. A 30 kg shell in free space explodes into three identical fragments. After the explosion the fragments rush apart; the forces of mutual interaction between them are long-range attractive conservative forces. Immediately after the explosion, the velocities of the fragments relative to an inertial frame are (3î + 2ĵ) m/s, −2î m/s and (5î − 5ĵ) m/s. If the entire energy released in the explosion is converted into kinetic energy of the fragments, how much energy has been released? (a) 260 J (b) 290 J (c) 335 J (d) 410 J",
s:"Each fragment is 10 kg.\nKE just after = ½(10)(13 + 4 + 50) = 335 J.\nThe shell's own velocity before the burst follows from momentum: 10(3,2) + 10(−2,0) + 10(5,−5) = (60, −30), so v_shell = (2, −1) m/s and KE before = ½(30)(5) = 75 J.\nEnergy released = 335 − 75 = 260 J → (a)."},
{t:"Shell fragments: minimum kinetic energy later",ch:"com",d:"Medium",src:"Surprise test",tg:["MCQ","paragraph"],
x:"Q3. For the same 30 kg shell bursting into three 10 kg fragments with velocities (3î + 2ĵ), −2î and (5î − 5ĵ) m/s: after a sufficiently long time, when the forces of mutual interaction cease to act, what can be the minimum total kinetic energy of all the fragments? (a) 15 J (b) 45 J (c) 75 J (d) More information required",
s:"Split the kinetic energy as KE = KE_cm + KE(relative to the centre of mass). The attractive internal forces can drain the internal part but never the KE of the centre of mass, which is conserved because there is no external force.\nv_cm = (2, −1) m/s, so KE_cm = ½(30)(2² + 1²) = 75 J.\nThe least possible total is therefore 75 J, reached when the fragments end up moving together → (c)."},
{t:"T-shaped rod between two wedges",ch:"nlm",d:"Hard",src:"Surprise test",tg:["MCQ","constraint"],fig:"tRod",
x:"Q4. Figure shows an inverted 'T' shaped rod of mass m₀ constrained to move only in the vertical direction by two rigid supports. The rod touches two triangular wedges at its lower end, of masses m₁ and m₂ with base angles θ₁ and θ₂. The wedges can move horizontally, all contacts are smooth, and the system is released from rest. If the downward acceleration of the rod is a, the net force applied by the rigid supports on the rod is (A) (m₁cotθ₁ − m₂cotθ₂)a (B) (m₁tanθ₁ − m₂tanθ₂)a (C) (m₁cosθ₁ − m₂cosθ₂)a (D) zero",
s:"Wedge contact constraint: if the rod descends with a, wedge i slides outward with horizontal acceleration a cotθᵢ.\nTake the whole system. Horizontally the only external force is the one the supports apply to the rod (the floor is smooth), so\nF = Σ mᵢ aᵢₓ = −m₁a cotθ₁ + m₂a cotθ₂.\nIts magnitude is (m₁cotθ₁ − m₂cotθ₂)a → (A).\nNote it is not zero in general: the two wedges are pushed apart with different accelerations, and the supports supply the imbalance."},
{t:"Propelling a car with thrown baseballs",ch:"com",d:"Hard",src:"Surprise test",tg:["MCQ","variable mass"],
x:"Q5. For some odd reason, you decide to throw baseballs at a car of mass M, which is free to move frictionlessly on the ground. You throw the balls at the back of the car at speed u and at a mass rate of σ kg/s (assume the rate is continuous). If the car starts at rest, find its speed as a function of time, assuming the back window is open so that the balls collect inside the car. (A) uσt/(M+σt) (B) u(1 − 1/√(1+σt/M)) (C) u(1 − 1/√(1+2σt/M)) (D) u(1 − 1/(1+2σt/M))",
s:"Momentum over the interval in which a mass dm enters the car:\n(dm)u + mv = (m + dm)(v + dv) ⟹ dm(u − v) = m dv.\nIntegrating from M to m and 0 to v gives m = Mu/(u − v) — note m → ∞ as v → u, as it must.\nMass arrives at the rate dm/dt = σ(u − v)/u, since the balls close on the car only at relative speed (u − v). Substituting m:\n∫₀^v dv/(u−v)³ = ∫₀^t σ dt/(Mu²) ⟹ 1/[2(u−v)²] − 1/(2u²) = σt/(Mu²).\nv(t) = u(1 − 1/√(1 + 2σt/M)) → (C).\nIntegrating once more, x(t) = ut − (Mu/σ)√(1 + 2σt/M) + Mu/σ: the car's speed tends to u, yet it falls arbitrarily far behind a ball that keeps moving at u."},
{t:"What is true in the centre-of-mass frame",ch:"com",d:"Easy",src:"Surprise test",tg:["multi-correct","C-frame"],
x:"Q6. Consider a system of particles observed relative to the centre-of-mass frame of reference. (A) Net force on the system is zero (B) Work done by all the forces is zero (C) Total momentum is zero (D) Work done by internal forces is zero",
s:"In the C-frame a_cm = 0 and v_cm = 0 by definition.\nF_net = M_total a_cm = 0 → (A) is correct.\nP_cm = M_total v_cm = 0 → (C) is correct.\n(B) is false: the total work equals the change in the system's kinetic energy measured in this frame, which is generally non-zero.\n(D) is false: internal forces do work whenever the separations change — that is exactly how a spring or an explosion transfers energy.\nCorrect: (A) and (C)."},
{t:"Particles converging on the origin",ch:"com",d:"Medium",src:"Surprise test",tg:["multi-correct","C-frame"],
x:"Q7. Initially all the particles of a system are situated at a distance R from the origin and each particle is moving towards the origin with some random speeds (equal or unequal). Then for this moment: (A) The distance of the centre of mass from the origin is R (B) The distance of the centre of mass from the origin is less than or equal to R (C) Velocity of the centre of mass is towards the origin (D) Speed of the centre of mass is zero",
s:"All the particles lie on a sphere of radius R, and the centre of mass is a weighted average of points on that sphere — which lies inside or on it. So its distance from the origin is ≤ R, with equality only if every particle sits at the same point: (B) is correct and (A) is not.\nThe velocities all point towards the origin but from different directions, and the speeds are random, so their mass-weighted sum has no fixed direction and no reason to vanish — (C) and (D) are both false.\nCorrect: (B)."},
{t:"Person walking across two roped planks",ch:"com",d:"Hard",src:"Surprise test",tg:["multi-correct","graph"],fig:"planks",
x:"Q8. Two long planks each of mass 60 kg are connected by a long massless string and placed on a smooth horizontal surface. A person of mass 60 kg stands on one end of plank A. Initially both planks are at rest. The person starts to move from one end of plank A towards plank B (taken as the positive direction) such that the velocity of the person relative to the ground rises linearly to 2 m/s in 1 s, stays at 2 m/s until 3 s, and falls linearly to zero at 4 s. During 0 to 4 s: (A) Displacement of the centre of mass of (plank A + plank B + person) is zero (B) Displacement of the centre of mass of (plank A + plank B) is −3 m (C) Displacement of plank A is −3 m (D) Displacement of plank B is −3.5 m",
s:"No external horizontal force, so the centre of mass of the whole system never moves — (A) is correct.\n0–1 s: the person pulls both planks, so they move together. 60(1) + 120(−x₁) = 0 ⟹ x₁ = 0.5 m back, and the planks reach 1 m/s backwards.\n1–3 s: 60(4) + 120(−x₂) = 0 ⟹ x₂ = 2 m back.\n3–4 s: the person retards, so he pushes the planks; the string can pull but not push, so only plank A is affected. Plank B carries on at 1 m/s and moves 1 m; the person moves 1 m, and 60(1) + 60(−1) + 60(−x₃) = 0 gives x₃ = 0.\nTotals: plank A 2.5 m back, plank B 3.5 m back, person 6 m forward.\nSo (C) is wrong (A moves −2.5 m), (D) is right, and the two planks' centre of mass moves (2.5+3.5)/2 = 3 m back → (B) right.\nCorrect: (A), (B), (D)."},
{t:"Rope sliding onto a semicircular surface",ch:"com",d:"Hard",src:"Surprise test",tg:["multi-correct","continuous body"],fig:"ropeArc",
x:"Q9. A vertical surface AB is connected smoothly at B to a semicircular surface BCD in a vertical plane. A uniform rope of mass M and length πR is released on the vertical surface when its lower end is touching point B. At the moment the rope is completely on the semicircular part: (A) Speed of the rope is √(2gR(π/2 + 2/π)) (B) Resultant of all the normal forces on the rope by the surface is Mg(3 + 8/π²) (C) Momentum of the rope is (2M/π)√(2gR(π/2 + 2/π)) (D) Net force on the rope is Mg(3 + π)",
s:"Energy: the rope's centre of mass falls from πR/2 above B to 2R/π below the level of B, so Mg(πR/2 + 2R/π) = ½Mv² ⟹ v = √(2gR(π/2 + 2/π)) — (A) correct.\nω_cm = v/R, and the centre of mass moves on a circle of radius 2R/π, so\na_cm = ω²(2R/π) = 2g(1 + 4/π²), directed upward.\nNewton: N − Mg = Ma_cm ⟹ N = Mg(3 + 8/π²) — (B) correct.\nP = Mv_cm = Mω(2R/π) = (2M/π)√(2gR(π/2 + 2/π)) — (C) correct.\nNet force = Ma_cm = 2Mg(1 + 4/π²) ≠ Mg(3 + π) — (D) wrong.\nCorrect: (A), (B), (C)."},
{t:"Filling a cubical box with water",ch:"com",d:"Hard",src:"Surprise test",tg:["multi-correct","optimisation"],
x:"Q10. Consider a uniform cubical box of mass 1000 kg and edge length 1 m with one of its faces horizontal; the walls are of negligible thickness. Water of density 1000 kg/m³ is slowly added inside such that the level rises with a small but constant velocity. During the process from the box being empty to the water completely filling it, mark the correct option regarding the centre of mass of (box + water): (A) The centre of mass continuously rises (B) The total displacement of the centre of mass is zero (C) The maximum displacement of the centre of mass is (√2 − 1) m (D) The maximum displacement of the centre of mass is (√3 − √2) m",
s:"Take the base as origin. With water to height h, the masses are 1000 kg of box at 0.5 m and 1000h kg of water at h/2:\ny_cm = 0.5(1 + h²)/(1 + h).\nSetting dy_cm/dh = 0: h² + 2h − 1 = 0 ⟹ h = √2 − 1 m, where y_cm = √2 − 1 ≈ 0.414 m — a minimum, so the centre of mass first falls and then rises: (A) is false.\nAt h = 0 and h = 1 the centre of mass is at 0.5 m, so over the whole process its net displacement is zero → (B) correct.\nThe largest excursion is 0.5 − (√2 − 1) = 1.5 − √2 ≈ 0.086 m, which matches neither (C) nor (D).\nCorrect: (B)."},
{t:"L-shaped tube with two blocks",ch:"com",d:"Hard",src:"Surprise test",tg:["multi-correct","constraint"],fig:"Ltube",
x:"Q11. Figure shows an 'L' shaped tube of mass M, free to move horizontally inside a cylindrical handle rigidly fixed to the ceiling. Two blocks of the same mass m are connected with a massless string passing over a massless pulley attached to the tube. The blocks exactly fit inside the tube, all contact surfaces are smooth, and the system is released from rest. After block B descends by height h: (A) The horizontal displacement of A has magnitude mh/(2m+M) (B) The horizontal displacement of B has magnitude (m+M)h/(2m+M) (C) The horizontal displacement of the pipe has magnitude (m+M)h/(2m+M) (D) The horizontal displacement of the centre of mass of the complete system is zero",
s:"Let the pipe move x to the left; block B sits in the vertical arm so it moves x to the left as well, and let A move y to the right.\nNo horizontal external force, so the centre of mass cannot move horizontally — (D) is correct, and it gives\nmy − (m + M)x = 0 ⟹ y = x(m + M)/m.\nThe string constraint (B descends h as A slides along the tube) gives x + y = h, so\nx = mh/(2m + M)  and  y = (m + M)h/(2m + M).\nSo the pipe and B each move mh/(2m+M) and A moves (m+M)h/(2m+M) — which is the opposite assignment to what (A), (B) and (C) claim.\nCorrect: (D)."},
{t:"Diya on a thali during aarti",ch:"circ",d:"Hard",src:"Surprise test",tg:["multi-correct","friction"],
x:"Q12. During an aarti, a thali (a horizontal disc) performs circular motion of constant angular velocity in a vertical plane, the plane of the thali always remaining horizontal. A diya (a small block) of mass m rests on the thali, the radius of its circular motion being r and the constant angular velocity ω₀. Mark the correct option. (A) The minimum normal force on the diya is m(g − ω₀²r) (B) The maximum frictional force between diya and thali is mω₀²r (C) Minimum coefficient of friction for no slipping is ω₀²r/(g − ω₀²r) (D) Minimum coefficient of friction for no slipping is √(ω₀²r/(g² − (ω₀²r)²))",
s:"Every point of the thali has the same acceleration ω₀²r, whose direction sweeps right round the vertical plane while the thali stays horizontal.\nVertically: N − mg = m(vertical component of ω₀²r), which ranges over ±ω₀²r, so N_min = m(g − ω₀²r) → (A) correct.\nHorizontally the friction must supply the horizontal component, at most mω₀²r → (B) correct.\nFor no slipping at every instant the required friction must stay inside μN. The worst case occurs when the acceleration vector is tilted, giving\nmω₀²r ≤ μmg/√(1 + μ²) ⟹ (ω₀²r)²/(g² − (ω₀²r)²) ≤ μ²,\nwhich is the form printed in (D), not (C).\nCorrect: (A), (B), (D)."},
{t:"Object breaking at the top of its flight",ch:"com",d:"Hard",src:"Surprise test",tg:["multi-correct"],fig:"cmPath",
x:"Q13. An object is projected in air. As it reaches its topmost point it breaks into two unequal parts A and B. The lighter part A moves downwards with non-zero speed just after breaking. Assuming the parts do not rebound after colliding with the ground, mark the correct option(s). (A) The acceleration of the centre of mass just after the break is g vertically downwards (B) The acceleration of the centre of mass just before B strikes the ground is g vertically downwards (C) The centre of mass lands where the unbroken object would have landed (D) The path of the centre of mass while it is in air is the kinked dotted curve shown",
s:"Just after the break both parts are in free flight, so a_cm = g → (A) correct.\nA is thrown downwards, so it lands first; once it is on the ground the normal force acts on the system and a_cm < g. So (B) is false.\nThe centre of mass therefore stops following the original parabola from the instant A lands — it does not land at the undisturbed landing point, so (C) is false, and its path shows an abrupt change of curvature at that moment, as the figure shows → (D) correct.\nCorrect: (A) and (D)."},
{t:"Sand falling onto an inclined conveyor belt",ch:"com",d:"Hard",src:"Surprise test",tg:["integer","variable mass"],fig:"conveyor",
x:"Q14. A conveyor belt is inclined at an angle θ with the horizontal. The length of a straight portion of the belt is l, resistive forces in the belt mechanism are negligible and the radii of the end cylinders are negligible compared to l. Sand falls on the belt with negligible speed at a constant rate at the top and leaves at the bottom. Friction between belt and sand is high enough to stop sliding of sand particles almost in no time. The inertia of the belt mechanism is negligible compared to that of the total sand on it. Find the steady speed acquired by the belt. Take l = 20 m, θ = 30° and g = 10 m/s².",
s:"Let the sand arrive at rate q kg/s and the belt run at steady speed v. The sand on the belt at any moment is m = q(l/v), since each grain spends l/v on the belt.\nThe belt mechanism has negligible inertia and no resistive force, so the force driving it (the component of the sand's weight along the incline) must exactly equal the thrust needed to bring the newly arriving sand up to speed v:\nmg sinθ = qv ⟹ (ql/v)g sinθ = qv ⟹ v² = gl sinθ.\nv = √(10 × 20 × 0.5) = 10 m/s.\n(Note the paper lists this in the single-digit integer section, so check the intended rounding or units against the key.)"},
{t:"Point on the string that moves in a straight line",ch:"com",d:"Hard",src:"Surprise test",tg:["integer"],fig:"ringRod",
x:"Q15. The ring R in the arrangement shown has mass 2m and can slide along a smooth fixed horizontal rod x-y. It is attached to a block B of mass m by a light string of length l. The block is released from rest with the string horizontal. It is observed that a point P on the string follows a straight-line path as the block descends. The distance of point P from the ring is nl/6. The value of n is",
s:"There is no horizontal external force, so the horizontal position of the centre of mass of (ring + block) never moves. The point that stays on a fixed vertical line is therefore the centre of mass itself — and because the string stays straight, that point lies on the string.\nMeasuring from the ring, x_cm = [2m(0) + m(l)]/3m = l/3 = 2l/6.\nn = 2."},
{t:"Circle with an inscribed right triangle removed",ch:"com",d:"Medium",src:"Surprise test",tg:["integer"],fig:"circTri",
x:"Q16. From a circle of radius a, an isosceles right-angled triangle with the hypotenuse as the diameter of the circle is removed. The distance of the centre of mass of the remaining portion from the centre of the circle is a/(xπ − y). Find the value of (x + y).",
s:"The triangle has legs a√2, so its area is a² and its centroid lies a/3 from the centre, on the side the triangle occupies.\nTaking σ as the mass per unit area and the centre of the circle as origin with the triangle on the +y side:\ny_cm = [σ(πa²)(0) − σ(a²)(a/3)]/[σ(πa²) − σ(a²)] = −a/(3(π − 1)).\nSo the distance is a/(3π − 3), giving x = 3 and y = 3.\nx + y = 6."},
{t:"Power of a wind-powered generator",ch:"com",d:"Easy",src:"Surprise test",tg:["integer","variable mass"],
x:"Q17. A wind-powered generator converts wind energy into electrical energy. Assume that the generator converts a fixed fraction of the wind energy intercepted by its blades into electrical energy. For wind speed v, the electrical power output will be proportional to vⁿ. Calculate n.",
s:"Mass flux through the blades of area A: dm/dt = ρ(dV/dt) = ρAv.\nThe thrust is F = v(dm/dt) = ρAv².\nPower P = Fv = ρAv³.\nSo P ∝ v³ and n = 3."},
{t:"Force between the halves of a spinning sphere",ch:"com",d:"Hard",src:"Surprise test",tg:["integer"],
x:"Q18. In gravity-free space, a uniform solid sphere of mass M and radius R is rotating about its diameter with constant angular velocity ω₀. An imaginary plane containing the axis of rotation separates the sphere into two identical hemispheres. The force applied by one hemisphere on the other is (k/32)Mω₀²R. Find the value of k.",
s:"The centre of mass of a solid hemisphere lies 3R/8 from the flat face's centre, and it travels in a circle of that radius with angular velocity ω₀.\nApplying Newton's second law to one hemisphere, of mass M/2:\nF_net = (M/2)ω₀²(3R/8) = (3/16)Mω₀²R.\nThis net force is supplied entirely by the other hemisphere, and (3/16) = 6/32.\nk = 6."}
];
