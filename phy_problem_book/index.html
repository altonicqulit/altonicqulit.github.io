/* ===================== state ===================== */
const KEY="prob-board-v6";
const uid=()=>Math.random().toString(36).slice(2,9);
/* dates of the sheets the problems came from; the undated sheets sort last */
const DATES={"9 Jul":"2026-07-09","22 Jul":"2026-07-22","26 Jul test":"2026-07-26",
  "1 Aug":"2026-08-01","2 Aug":"2026-08-02","18 Aug":"2026-08-18","27 Aug":"2026-08-27",
  "23 Sep":"2026-09-23","Tutorial 15":"2026-10-04","Surprise test":"2026-10-04"};
function seedState(){
  const lvlOf = d => ({Easy:3, Medium:6, Hard:8})[d] || 5;
  return {chapters:CH.map(([id,name])=>({id,name})), attempts:[],
    questions:SEED.map(q=>({id:uid(),title:q.t,text:q.x,ch:q.ch,diff:q.d,src:q.src,date:DATES[q.src]||"",tags:q.tg||[],
      fig:q.fig||"",sol:q.s||"",notes:"",imgs:[],star:false,done:false,
      opts:(OPT[q.t]||{}).a||[], lvl:(OPT[q.t]||{}).lvl||lvlOf(q.d)}))};
}
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){const p=JSON.parse(raw);if(p&&p.questions&&p.chapters)return p;}}catch(e){}
  return seedState();
}
let state=load();
if(!state.attempts) state.attempts=[];
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state));return true;}
  catch(e){toast("Out of browser storage — try removing a photo or two");return false;}
}
let filters={q:"",diffs:new Set(),tag:"",chapter:"all",star:false,todo:false,sort:"custom"};
let openId=null;      // detail page
let solShown=false;   // per-visit

/* ===================== helpers ===================== */
const $=s=>document.querySelector(s);
const el=(t,c,txt)=>{const n=document.createElement(t);if(c)n.className=c;if(txt!=null)n.textContent=txt;return n;};
const dc=d=>d==="Easy"?"e":d==="Medium"?"m":"h";
const chName=id=>(state.chapters.find(c=>c.id===id)||{name:"Unsorted"}).name;
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const allTags=()=>[...new Set(state.questions.flatMap(q=>q.tags))].sort();
function matches(q){
  if(filters.chapter==="__un"){if(state.chapters.some(c=>c.id===q.ch))return false;}
  else if(filters.chapter!=="all"&&q.ch!==filters.chapter)return false;
  if(filters.diffs.size&&!filters.diffs.has(q.diff))return false;
  if(filters.tag&&!q.tags.includes(filters.tag))return false;
  if(filters.star&&!q.star)return false;
  if(filters.todo&&q.done)return false;
  if(filters.q){
    const s=(q.title+" "+q.text+" "+q.tags.join(" ")+" "+chName(q.ch)).toLowerCase();
    if(!filters.q.toLowerCase().split(/\s+/).every(w=>s.includes(w)))return false;
  }
  return true;
}
function fmtDate(d){
  if(!d)return "";
  const p=d.split("-");if(p.length!==3)return d;
  const M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return (+p[2])+" "+M[(+p[1])-1]+" "+p[0];
}
function sorted(list){
  const rank={Easy:0,Medium:1,Hard:2};const l=[...list];
  if(filters.sort==="hard")l.sort((a,b)=>rank[b.diff]-rank[a.diff]);
  else if(filters.sort==="easy")l.sort((a,b)=>rank[a.diff]-rank[b.diff]);
  else if(filters.sort==="az")l.sort((a,b)=>a.title.localeCompare(b.title));
  else if(filters.sort==="new"||filters.sort==="old"){
    const dir=filters.sort==="new"?-1:1;
    l.sort((a,b)=>{
      if(!a.date&&!b.date)return 0;
      if(!a.date)return 1;           /* undated always last */
      if(!b.date)return -1;
      return a.date<b.date?dir:a.date>b.date?-dir:0;
    });
  }
  return l;
}
function toast(msg,undoFn){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const t=el("div","toast");t.appendChild(el("span",null,msg));
  if(undoFn){const b=el("button",null,"Undo");b.onclick=()=>{undoFn();t.remove();};t.appendChild(b);}
  document.body.appendChild(t);setTimeout(()=>t.remove(),undoFn?6500:2600);
}

/* ===================== strip ===================== */
function renderStrip(){
  const s=$("#strip");s.innerHTML="";
  const c={Easy:0,Medium:0,Hard:0};
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  state.questions.forEach((q,i)=>{
    c[q.diff]=(c[q.diff]||0)+1;
    const t=el("div","tick "+dc(q.diff)+((openId||matches(q))?"":" off"));
    const h=q.diff==="Easy"?18:q.diff==="Medium"?30:44;
    t.style.height=reduce?h+"px":"0px";t.title=q.title;
    t.onclick=()=>{openId=q.id;solShown=false;render();window.scrollTo({top:0,behavior:"smooth"});};
    t.style.cursor="pointer";
    s.appendChild(t);
    if(!reduce)setTimeout(()=>t.style.height=h+"px",i*8);
  });
  $("#cE").textContent=c.Easy;$("#cM").textContent=c.Medium;$("#cH").textContent=c.Hard;
}

/* ===================== board page ===================== */
function boardPage(){
  const root=el("div","layout");
  /* sidebar */
  const side=el("aside","side");
  side.appendChild(el("h2",null,"Chapters"));
  const box=el("div","chapters");
  const mk=(id,name,count)=>{
    const b=el("button","chap"+(filters.chapter===id?" active":""));
    b.appendChild(el("span","bar"));b.appendChild(el("span","nm",name));b.appendChild(el("span","ct",String(count)));
    b.onclick=()=>{filters.chapter=id;render();};
    if(id!=="all"&&id!=="__un"){
      b.draggable=true;b.title="Double-click to rename · drag to reorder";
      b.ondblclick=()=>renameChapter(id);
      b.ondragstart=e=>{e.dataTransfer.setData("chap",id);e.dataTransfer.effectAllowed="move";};
      b.ondragover=e=>{if(e.dataTransfer.types.includes("chap")||e.dataTransfer.types.includes("q")){e.preventDefault();b.style.background="var(--panel-2)";}};
      b.ondragleave=()=>{b.style.background="";};
      b.ondrop=e=>{
        e.preventDefault();b.style.background="";
        const from=e.dataTransfer.getData("chap"),qid=e.dataTransfer.getData("q");
        if(qid){const q=state.questions.find(x=>x.id===qid);if(q){q.ch=id;save();render();toast("Moved to "+name);}return;}
        if(from&&from!==id){
          const a=state.chapters.findIndex(c=>c.id===from),bi=state.chapters.findIndex(c=>c.id===id);
          const [m]=state.chapters.splice(a,1);state.chapters.splice(bi,0,m);save();render();
        }
      };
    }
    return b;
  };
  box.appendChild(mk("all","All chapters",state.questions.length));
  state.chapters.forEach(c=>box.appendChild(mk(c.id,c.name,state.questions.filter(q=>q.ch===c.id).length)));
  const un=state.questions.filter(q=>!state.chapters.some(c=>c.id===q.ch));
  if(un.length)box.appendChild(mk("__un","Unsorted",un.length));
  side.appendChild(box);
  const foot=el("div","side-foot");
  const nb=el("button","btn","New chapter");
  nb.onclick=()=>{const c={id:uid(),name:"New chapter"};state.chapters.push(c);save();render();renameChapter(c.id);};
  const rb=el("button","btn danger","Reset board");
  rb.onclick=()=>{const old=state;state=seedState();save();render();
    toast("Board reset to the original "+SEED.length+" problems",()=>{state=old;save();render();});};
  foot.append(nb,rb);side.appendChild(foot);
  root.appendChild(side);

  /* main */
  const main=el("main");
  const ctl=el("div","controls");
  ctl.innerHTML=`
    <div class="ctl-row">
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search problems and topics…" autocomplete="off" value="${esc(filters.q)}">
      </div>
      <select id="tagSel" aria-label="Filter by topic tag"><option value="">All topics</option>${allTags().map(s=>`<option ${filters.tag===s?"selected":""}>${esc(s)}</option>`).join("")}</select>
      <select id="sortSel" aria-label="Sort order">
        <option value="custom">My order</option>
        <option value="new">Newest sheet first</option><option value="old">Oldest sheet first</option>
        <option value="hard">Hardest first</option>
        <option value="easy">Easiest first</option><option value="az">A–Z</option>
      </select>
    </div>
    <div class="ctl-row">
      <button class="chip e" data-diff="Easy">Easy</button>
      <button class="chip m" data-diff="Medium">Medium</button>
      <button class="chip h" data-diff="Hard">Hard</button>
      <button class="chip plain" id="starChip">Starred</button>
      <button class="chip plain" id="todoChip">Not done</button>
      <button class="btn" id="clearBtn">Clear filters</button>
      <span class="count" id="count"></span>
    </div>`;
  main.appendChild(ctl);
  const board=el("div");board.id="board";main.appendChild(board);
  root.appendChild(main);
  return root;
}
function wireControls(){
  $("#q").oninput=e=>{filters.q=e.target.value;renderBoard();renderStrip();};
  $("#tagSel").onchange=e=>{filters.tag=e.target.value;render();};
  $("#sortSel").value=filters.sort;
  $("#sortSel").onchange=e=>{filters.sort=e.target.value;renderBoard();};
  document.querySelectorAll("[data-diff]").forEach(b=>{
    b.classList.toggle("on",filters.diffs.has(b.dataset.diff));
    b.onclick=()=>{const d=b.dataset.diff;filters.diffs.has(d)?filters.diffs.delete(d):filters.diffs.add(d);render();};
  });
  $("#starChip").classList.toggle("on",filters.star);
  $("#starChip").onclick=()=>{filters.star=!filters.star;render();};
  $("#todoChip").classList.toggle("on",filters.todo);
  $("#todoChip").onclick=()=>{filters.todo=!filters.todo;render();};
  $("#clearBtn").onclick=()=>{filters={q:"",diffs:new Set(),tag:"",chapter:"all",star:false,todo:false,sort:"custom"};render();};
}
function card(q,idx){
  const c=el("div","card "+dc(q.diff));
  c.dataset.id=q.id;c.style.animationDelay=Math.min(idx,14)*14+"ms";
  const left=el("div");left.style.cssText="display:flex;flex-direction:column;align-items:center;gap:4px";
  const grip=el("div","grip","⠿");grip.title="Drag to reorder, or drop on a chapter";
  left.append(grip,el("div","num",String(idx+1)));c.appendChild(left);

  const main=el("div","card-main");
  const h=el("p","q-title");h.appendChild(document.createTextNode(q.title));
  if(q.star)h.appendChild(el("span","star","★"));
  if(q.done){const d=el("span","pill","done");d.style.color="var(--mint)";h.appendChild(d);}
  main.appendChild(h);
  main.appendChild(el("p","q-text",q.text));
  const m=el("div","meta");
  m.appendChild(el("span","pill d "+dc(q.diff),q.diff));
  m.appendChild(el("span","pill",chName(q.ch)));
  if(q.date)m.appendChild(el("span","pill",fmtDate(q.date)));
  if(q.fig&&F[q.fig])m.appendChild(el("span","pill fig","figure"));
  if(q.notes)m.appendChild(el("span","pill fig","notes"));
  if(q.imgs&&q.imgs.length)m.appendChild(el("span","pill fig",q.imgs.length+" photo"+(q.imgs.length>1?"s":"")));
  q.tags.forEach(t=>m.appendChild(el("span","pill",t)));
  main.appendChild(m);
  main.onclick=()=>{openId=q.id;solShown=false;render();window.scrollTo({top:0,behavior:"smooth"});};
  c.appendChild(main);

  const acts=el("div","acts");
  const ic=(svg,title,fn,cls)=>{const b=el("button","icon "+(cls||""));b.innerHTML=svg;b.title=title;b.setAttribute("aria-label",title);b.onclick=e=>{e.stopPropagation();fn();};return b;};
  acts.appendChild(ic('<svg width="15" height="15" viewBox="0 0 24 24" fill="'+(q.star?"currentColor":"none")+'" stroke="currentColor" stroke-width="1.8"><path d="m12 3 2.6 5.6 6 .8-4.4 4.2 1.1 6-5.3-3-5.3 3 1.1-6L3.4 9.4l6-.8Z"/></svg>',
    q.star?"Remove star":"Star this problem",()=>{q.star=!q.star;save();render();},q.star?"on":""));
  acts.appendChild(ic('<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 12 5 5L20 7"/></svg>',
    q.done?"Mark as not done":"Mark as done",()=>{q.done=!q.done;save();render();},q.done?"on":""));
  acts.appendChild(ic('<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17v3Z"/></svg>',"Edit",()=>openEditor(q)));
  acts.appendChild(ic('<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m18 9-6 6-6-6"/></svg>',"Move down",()=>move(q.id,1)));
  acts.appendChild(ic('<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m6 15 6-6 6 6"/></svg>',"Move up",()=>move(q.id,-1)));
  acts.appendChild(ic('<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13"/></svg>',"Delete",()=>del(q.id),"del"));
  c.appendChild(acts);

  grip.draggable=true;
  grip.ondragstart=e=>{e.dataTransfer.setData("q",q.id);e.dataTransfer.effectAllowed="move";c.classList.add("dragging");};
  grip.ondragend=()=>c.classList.remove("dragging");
  c.ondragover=e=>{if(e.dataTransfer.types.includes("q")){e.preventDefault();c.classList.add("drop-into");}};
  c.ondragleave=()=>c.classList.remove("drop-into");
  c.ondrop=e=>{
    e.preventDefault();c.classList.remove("drop-into");
    const id=e.dataTransfer.getData("q");if(!id||id===q.id)return;
    const from=state.questions.findIndex(x=>x.id===id);const item=state.questions[from];
    state.questions.splice(from,1);
    const to=state.questions.findIndex(x=>x.id===q.id);
    item.ch=q.ch;state.questions.splice(to,0,item);save();render();flash(id);
  };
  return c;
}
function move(id,dir){
  const me=state.questions.find(q=>q.id===id);
  const grouping=filters.chapter==="all"&&filters.sort==="custom";
  const list=sorted(state.questions.filter(q=>matches(q)&&(!grouping||q.ch===me.ch)));
  const pos=list.findIndex(q=>q.id===id);const target=list[pos+dir];if(!target)return;
  const a=state.questions.findIndex(q=>q.id===id),b=state.questions.findIndex(q=>q.id===target.id);
  const [m]=state.questions.splice(a,1);state.questions.splice(b,0,m);save();render();flash(id);
}

function shrink(file,cb){
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const k=Math.min(1,1100/Math.max(img.width,img.height));
      const c=document.createElement("canvas");
      c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      cb(c.toDataURL("image/jpeg",0.72));
    };
    img.onerror=()=>toast("That file couldn't be read as an image");
    img.src=r.result;
  };
  r.readAsDataURL(file);
}

/* =========================================================
   TEST MODE
   Pick chapters and a difficulty band, sit the paper in a
   focused runner, then get the breakdown and the solutions.
   ========================================================= */
let T = null;            // the running test
let lastResult = null;   // the finished one

const fmtClock = s => {
  s = Math.max(0, Math.round(s));
  const m = Math.floor(s / 60);
  return (m < 10 ? "0" : "") + m + ":" + (s % 60 < 10 ? "0" : "") + (s % 60);
};
const testable = () => state.questions.filter(q => q.opts && q.opts.length === 4);
const ask = msg => { try { return confirm(msg); } catch(e) { return true; } };
const lvlOf = q => q.lvl || ({Easy:3, Medium:6, Hard:8})[q.diff] || 5;

let setup = { chaps:new Set(), lo:1, hi:10, count:10, perQ:150 };

function poolFor(cfg){
  return testable().filter(q =>
    (cfg.chaps.size === 0 || cfg.chaps.has(q.ch)) &&
    lvlOf(q) >= cfg.lo && lvlOf(q) <= cfg.hi);
}

function setupPage(){
  const d = el("div","setup");

  const cr = el("div","crumbs");
  const back = el("button","btn","← Back to the board");
  back.onclick = () => { mode = null; render(); };
  cr.appendChild(back);
  d.appendChild(cr);

  d.appendChild(el("h2",null,"Set your paper"));
  const lead = el("p","lead","Choose the chapters, set the difficulty band, and pick how many questions. Every paper is drawn fresh and the options are reshuffled, so sitting the same chapters twice won't give you the same answer key.");
  d.appendChild(lead);

  /* chapters */
  const s1 = el("div","sect");
  s1.appendChild(el("h4",null,"Chapters — none selected means all of them"));
  const cs = el("div","chipset");
  const allChip = el("button","chip plain" + (setup.chaps.size === 0 ? " on" : ""), "All topics");
  allChip.onclick = () => { setup.chaps.clear(); render(); };
  cs.appendChild(allChip);
  state.chapters.forEach(c => {
    const n = testable().filter(q => q.ch === c.id).length;
    if(!n) return;
    const b = el("button","chip plain" + (setup.chaps.has(c.id) ? " on" : ""), c.name + " · " + n);
    b.onclick = () => { setup.chaps.has(c.id) ? setup.chaps.delete(c.id) : setup.chaps.add(c.id); render(); };
    cs.appendChild(b);
  });
  s1.appendChild(cs);
  d.appendChild(s1);

  /* difficulty */
  const s2 = el("div","sect");
  s2.appendChild(el("h4",null,"Difficulty, on a scale of 1 to 10"));
  const mk = (label, key, onIn) => {
    const row = el("div","slider");
    row.appendChild(el("span",null,label));
    const r = el("input"); r.type = "range"; r.min = 1; r.max = 10; r.step = 1; r.value = setup[key];
    const b = el("b",null,String(setup[key]));
    r.oninput = () => { b.textContent = r.value; onIn(+r.value); };
    row.append(r,b);
    return row;
  };
  s2.appendChild(mk("Easiest","lo",v => { setup.lo = v; if(setup.hi < v) setup.hi = v; refresh(); }));
  s2.appendChild(mk("Hardest","hi",v => { setup.hi = v; if(setup.lo > v) setup.lo = v; refresh(); }));
  d.appendChild(s2);

  /* length and timing */
  const s3 = el("div","sect");
  s3.appendChild(el("h4",null,"Length and timing"));
  const row = el("div","slider");
  row.appendChild(el("span",null,"Questions"));
  const cr2 = el("input"); cr2.type = "range"; cr2.min = 3; cr2.max = 40; cr2.step = 1; cr2.value = setup.count;
  const cb = el("b",null,String(setup.count));
  cr2.oninput = () => { cb.textContent = cr2.value; setup.count = +cr2.value; refresh(); };
  row.append(cr2,cb);
  s3.appendChild(row);
  const tsel = el("div","slider"); tsel.style.marginTop = "12px";
  tsel.appendChild(el("span",null,"Time"));
  const sel = el("select");
  [["150","2½ minutes a question"],["180","3 minutes a question"],["120","2 minutes a question"],["0","No timer"]]
    .forEach(([v,t]) => { const o = el("option",null,t); o.value = v; if(+v === setup.perQ) o.selected = true; sel.appendChild(o); });
  sel.onchange = () => { setup.perQ = +sel.value; refresh(); };
  tsel.appendChild(sel);
  s3.appendChild(tsel);
  const line = el("div","matchline"); s3.appendChild(line);
  d.appendChild(s3);

  const go = el("button","btn primary","Start the test");
  go.style.cssText = "padding:12px 22px;font-size:15px";
  go.onclick = startTest;
  d.appendChild(go);

  function refresh(){
    const pool = poolFor(setup);
    const n = Math.min(setup.count, pool.length);
    line.innerHTML = "";
    line.appendChild(document.createTextNode("Matching problems: "));
    const b1 = el("b",null,String(pool.length)); line.appendChild(b1);
    line.appendChild(document.createTextNode(" — your paper will have "));
    const b2 = el("b",null,String(n)); line.appendChild(b2);
    line.appendChild(document.createTextNode(setup.perQ ? ", with " + fmtClock(n * setup.perQ) + " on the clock." : ", untimed."));
    go.disabled = n < 1;
    go.style.opacity = n < 1 ? .4 : 1;
  }
  refresh();

  /* past attempts */
  if(state.attempts && state.attempts.length){
    const s4 = el("div","sect");
    s4.appendChild(el("h4",null,"Recent attempts"));
    state.attempts.slice(-6).reverse().forEach(at => {
      const r = el("div","attempt");
      r.appendChild(el("span",null, new Date(at.date).toLocaleString([], {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"}) + " · " + at.n + " questions · levels " + at.lo + "–" + at.hi));
      r.appendChild(el("b",null, at.score + "/" + at.max));
      s4.appendChild(r);
    });
    d.appendChild(s4);
  }
  return d;
}

function startTest(){
  const pool = poolFor(setup);
  for(let i = pool.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  const chosen = pool.slice(0, Math.min(setup.count, pool.length));
  if(!chosen.length) return;

  T = {
    qs: chosen.map(q => {
      const order = [0,1,2,3];
      for(let i = 3; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
      return {
        id:q.id, title:q.title, text:q.text, fig:q.fig, ch:q.ch, lvl:lvlOf(q), src:q.src,
        opts: order.map(k => q.opts[k]),
        correct: order.indexOf(0),
        chosen: null, marked:false, seen:false, time:0
      };
    }),
    i:0, lo:setup.lo, hi:setup.hi, perQ:setup.perQ,
    left: setup.perQ ? setup.perQ * Math.min(setup.count, pool.length) : null,
    started: Date.now(), mark: Date.now()
  };
  mode = "test";
  render();
  if(T.left !== null){
    clearInterval(T.int);
    T.int = setInterval(() => {
      T.left--;
      const el2 = document.getElementById("clock");
      if(el2){ el2.textContent = fmtClock(T.left); el2.classList.toggle("low", T.left < 60); }
      if(T.left <= 0){ clearInterval(T.int); finishTest(true); }
    }, 1000);
  }
}

function stamp(){ const now = Date.now(); T.qs[T.i].time += (now - T.mark) / 1000; T.mark = now; }

function testPage(){
  const d = el("div");

  const bar = el("div","testbar");
  const title = el("b",null,"Test in progress");
  const clock = el("span","timer"); clock.id = "clock";
  clock.textContent = T.left === null ? "no timer" : fmtClock(T.left);
  const counter = el("span"); counter.id = "counter"; counter.style.color = "var(--ink-3)";
  const sub = el("button","btn primary","Submit");
  sub.onclick = () => {
    const n = T.qs.filter(q => q.chosen === null).length;
    if(n && !ask(n + " question" + (n > 1 ? "s are" : " is") + " unanswered. Submit anyway?")) return;
    finishTest(false);
  };
  const quit = el("button","btn danger","Abandon");
  quit.onclick = () => { if(ask("Abandon this test? Nothing will be saved.")){ clearInterval(T.int); T = null; mode = null; render(); } };
  bar.append(title, clock, counter, sub, quit);
  bar.style.justifyContent = "space-between";
  d.appendChild(bar);

  const grid = el("div","testgrid");
  const card = el("div","qcard"); card.id = "qcard";
  const pal = el("div","palette");
  pal.appendChild(el("h4",null,"Questions"));
  pal.firstChild.style.cssText = "margin:0;font-size:12.5px;color:var(--ink-3)";
  const pg = el("div","pgrid"); pg.id = "pgrid"; pal.appendChild(pg);
  const lg = el("div","legend");
  lg.innerHTML = '<span><i style="background:var(--mint)"></i>Answered</span>' +
                 '<span><i style="background:var(--amber)"></i>Marked for review</span>' +
                 '<span><i style="background:var(--board);border:1px solid var(--line)"></i>Not answered</span>';
  pal.appendChild(lg);
  grid.append(card, pal);
  d.appendChild(grid);

  setTimeout(paint, 0);
  return d;
}

function paint(){
  const q = T.qs[T.i];
  q.seen = true;
  const card = document.getElementById("qcard");
  if(!card) return;
  card.innerHTML = "";

  const head = el("div","qhead");
  head.appendChild(el("span",null,"Question " + (T.i + 1) + " of " + T.qs.length + " · " + chName(q.ch) + " · level " + q.lvl));
  head.appendChild(el("span",null,"+4 correct · −1 wrong"));
  card.appendChild(head);

  card.appendChild(el("p","qtext",q.text));
  if(q.fig && F[q.fig]){
    const fb = el("div","figbox"); fb.style.margin = "16px 0 0"; fb.innerHTML = F[q.fig];
    card.appendChild(fb);
  }

  const box = el("div","opts");
  q.opts.forEach((text,k) => {
    const b = el("button","optbtn" + (q.chosen === k ? " sel" : ""));
    b.appendChild(el("span","key","ABCD"[k]));
    b.appendChild(el("span",null,text));
    b.onclick = () => { q.chosen = (q.chosen === k ? null : k); paint(); };
    box.appendChild(b);
  });
  card.appendChild(box);

  const nav = el("div","navrow");
  const mk = (label, fn, cls) => { const b = el("button","btn " + (cls||""), label); b.onclick = fn; return b; };
  nav.appendChild(mk("← Previous", () => { if(T.i > 0){ stamp(); T.i--; paint(); } }));
  nav.appendChild(mk(q.marked ? "Unmark" : "Mark for review", () => { q.marked = !q.marked; paint(); }));
  nav.appendChild(mk("Clear", () => { q.chosen = null; paint(); }));
  nav.appendChild(mk(T.i === T.qs.length - 1 ? "Save" : "Save & next", () => {
    if(T.i < T.qs.length - 1){ stamp(); T.i++; } paint();
  }, "primary"));
  card.appendChild(nav);

  /* palette + counter */
  const pg = document.getElementById("pgrid");
  pg.innerHTML = "";
  T.qs.forEach((x,n) => {
    let cls = "pal";
    if(x.chosen !== null && x.marked) cls += " ansmark";
    else if(x.chosen !== null) cls += " ans";
    else if(x.marked) cls += " mark";
    if(n === T.i) cls += " cur";
    const b = el("button",cls,String(n + 1));
    b.onclick = () => { stamp(); T.i = n; paint(); };
    pg.appendChild(b);
  });
  const c = document.getElementById("counter");
  if(c) c.textContent = T.qs.filter(x => x.chosen !== null).length + " answered · " + T.qs.filter(x => x.marked).length + " marked";
}

function finishTest(auto){
  stamp();
  clearInterval(T.int);
  let score = 0, right = 0, wrong = 0, skipped = 0;
  T.qs.forEach(q => {
    if(q.chosen === null){ skipped++; return; }
    if(q.chosen === q.correct){ right++; score += 4; } else { wrong++; score -= 1; }
  });
  const secs = (Date.now() - T.started) / 1000;
  lastResult = {
    date: Date.now(), qs: T.qs, n: T.qs.length, score, max: T.qs.length * 4,
    right, wrong, skipped, secs, lo: T.lo, hi: T.hi, auto
  };
  state.attempts = state.attempts || [];
  state.attempts.push({ date: lastResult.date, n: lastResult.n, score, max: lastResult.max, lo: T.lo, hi: T.hi });
  if(state.attempts.length > 20) state.attempts = state.attempts.slice(-20);
  save();
  T = null;
  mode = "result";
  render();
  window.scrollTo({ top:0 });
}

function resultPage(){
  const R = lastResult;
  const d = el("div","setup");

  const cr = el("div","crumbs");
  const back = el("button","btn","← Back to the board");
  back.onclick = () => { mode = null; render(); };
  const again = el("button","btn","Set another paper");
  again.onclick = () => { mode = "setup"; render(); };
  cr.append(back, again);
  d.appendChild(cr);

  d.appendChild(el("h2",null, R.auto ? "Time — here's how it went" : "Paper submitted"));
  const acc = R.right + R.wrong ? Math.round(100 * R.right / (R.right + R.wrong)) : 0;
  const stats = el("div","stats");
  const stat = (big, small) => { const s = el("div","stat"); s.appendChild(el("b",null,big)); s.appendChild(el("span",null,small)); return s; };
  stats.append(
    stat(R.score + " / " + R.max, "score, at +4 and −1"),
    stat(acc + "%", "accuracy on attempts"),
    stat(R.right + " / " + R.n, "correct"),
    stat(String(R.wrong), "wrong"),
    stat(String(R.skipped), "left blank"),
    stat(fmtClock(R.secs), "time taken"),
    stat(fmtClock(R.secs / R.n), "average a question")
  );
  d.appendChild(stats);

  /* by chapter */
  const byCh = {};
  R.qs.forEach(q => {
    const k = chName(q.ch);
    byCh[k] = byCh[k] || { n:0, right:0, time:0 };
    byCh[k].n++; byCh[k].time += q.time;
    if(q.chosen === q.correct) byCh[k].right++;
  });
  const s1 = el("div","sect");
  s1.appendChild(el("h4",null,"By chapter"));
  Object.entries(byCh).sort((a,b) => (a[1].right/a[1].n) - (b[1].right/b[1].n)).forEach(([k,v]) => {
    const row = el("div","barrow");
    row.appendChild(el("span",null,k));
    const t = el("div","track"); const i = el("i");
    i.style.width = "0%";
    i.style.background = v.right / v.n < .4 ? "var(--magenta)" : v.right / v.n < .75 ? "var(--amber)" : "var(--mint)";
    t.appendChild(i); row.appendChild(t);
    row.appendChild(el("span",null,v.right + "/" + v.n + " · " + fmtClock(v.time / v.n)));
    s1.appendChild(row);
    setTimeout(() => i.style.width = Math.round(100 * v.right / v.n) + "%", 60);
  });
  d.appendChild(s1);

  /* by difficulty */
  const bands = [[1,4,"Levels 1–4"],[5,7,"Levels 5–7"],[8,10,"Levels 8–10"]];
  const s2 = el("div","sect");
  s2.appendChild(el("h4",null,"By difficulty"));
  bands.forEach(([lo,hi,label]) => {
    const set = R.qs.filter(q => q.lvl >= lo && q.lvl <= hi);
    if(!set.length) return;
    const got = set.filter(q => q.chosen === q.correct).length;
    const row = el("div","barrow");
    row.appendChild(el("span",null,label));
    const t = el("div","track"); const i = el("i"); i.style.width = "0%";
    i.style.background = got / set.length < .4 ? "var(--magenta)" : got / set.length < .75 ? "var(--amber)" : "var(--mint)";
    t.appendChild(i); row.appendChild(t);
    row.appendChild(el("span",null,got + "/" + set.length));
    s2.appendChild(row);
    setTimeout(() => i.style.width = Math.round(100 * got / set.length) + "%", 60);
  });
  d.appendChild(s2);

  /* slowest question, a nudge */
  const slow = [...R.qs].sort((a,b) => b.time - a.time)[0];
  const note = el("div","sect");
  note.appendChild(el("h4",null,"Worth a look"));
  const bits = [];
  if(R.wrong > R.right && R.right + R.wrong > 2) bits.push("More attempts went wrong than right — at +4 and −1 you'd have scored better leaving the shaky ones blank.");
  if(slow && slow.time > R.secs / R.n * 2) bits.push("“" + slow.title + "” swallowed " + fmtClock(slow.time) + ", about " + (slow.time / (R.secs / R.n)).toFixed(1) + "× your average.");
  const weakest = Object.entries(byCh).sort((a,b) => (a[1].right/a[1].n) - (b[1].right/b[1].n))[0];
  if(weakest && weakest[1].right / weakest[1].n < .6) bits.push("Weakest chapter this time: " + weakest[0] + ".");
  if(R.skipped > R.n / 3) bits.push("You left " + R.skipped + " blank — worth a second pass at the end next time.");
  if(!bits.length) bits.push("Clean run — nothing stands out as a weak spot in this paper.");
  bits.forEach(b => { const p = el("p",null,b); p.style.cssText = "color:var(--ink-2);font-size:14px;margin-bottom:7px"; note.appendChild(p); });
  d.appendChild(note);

  /* question by question */
  d.appendChild(el("h2",null,"Question by question"));
  R.qs.forEach((q,n) => {
    const row = el("div","rev");
    const ok = q.chosen === q.correct, blank = q.chosen === null;
    const mk = el("div","mk " + (blank ? "sk" : ok ? "ok" : "no"), blank ? "–" : ok ? "✓" : "✕");
    row.appendChild(mk);

    const mid = el("div");
    const h = el("b",null,(n + 1) + ". " + q.title);
    h.style.fontSize = "14.5px";
    mid.appendChild(h);
    const a = el("div","ans");
    a.textContent = blank
      ? "Not attempted — the answer was: " + q.opts[q.correct]
      : ok ? "Your answer: " + q.opts[q.correct]
           : "You chose: " + q.opts[q.chosen] + "   ·   Correct: " + q.opts[q.correct];
    mid.appendChild(a);

    const full = state.questions.find(x => x.id === q.id);
    const tools = el("div","navrow"); tools.style.marginTop = "9px";
    if(full && full.sol){
      const sb = el("button","btn","Show solution");
      const sol = el("div","sol-body"); sol.textContent = full.sol; sol.style.display = "none"; sol.style.marginTop = "10px";
      sb.onclick = () => {
        const open = sol.style.display === "none";
        sol.style.display = open ? "block" : "none";
        sb.textContent = open ? "Hide solution" : "Show solution";
      };
      tools.appendChild(sb);
      mid.appendChild(tools);
      mid.appendChild(sol);
    } else { mid.appendChild(tools); }
    const ob = el("button","btn","Open problem");
    ob.onclick = () => { mode = null; openId = q.id; solShown = false; render(); window.scrollTo({top:0}); };
    tools.appendChild(ob);

    row.appendChild(mid);
    row.appendChild(el("span","pill","lvl " + q.lvl + " · " + fmtClock(q.time)));
    d.appendChild(row);
  });

  return d;
}

/* keys while sitting the paper */
document.addEventListener("keydown", e => {
  if(mode !== "test" || !T) return;
  if(/input|textarea|select/i.test(e.target.tagName)) return;
  if(["1","2","3","4"].includes(e.key)){ const k = +e.key - 1; const q = T.qs[T.i]; q.chosen = q.chosen === k ? null : k; paint(); }
  if(e.key === "ArrowRight" && T.i < T.qs.length - 1){ stamp(); T.i++; paint(); }
  if(e.key === "ArrowLeft" && T.i > 0){ stamp(); T.i--; paint(); }
});

/* ===================== top bar ===================== */
$("#addBtn").onclick=()=>openEditor(null);
$("#testBtn").onclick=()=>{mode="setup";openId=null;render();window.scrollTo({top:0});};
$("#themeBtn").onclick=()=>{
  const light=document.documentElement.dataset.theme!=="light";
  document.documentElement.dataset.theme=light?"light":"dark";
  $("#themeBtn").textContent=light?"Dark mode":"Light mode";
  try{localStorage.setItem(KEY+"-theme",light?"light":"dark");}catch(e){}
};
$("#exportBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="problem-board.json";a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast("Exported problem-board.json");
};
$("#importBtn").onclick=()=>{
  const i=document.createElement("input");i.type="file";i.accept="application/json";
  i.onchange=()=>{
    const f=i.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const p=JSON.parse(r.result);if(!p.questions||!p.chapters)throw 0;
        const old=state;state=p;openId=null;save();render();
        toast("Imported "+p.questions.length+" problems",()=>{state=old;save();render();});
      }catch(e){toast("That file isn't a board export");}
    };
    r.readAsText(f);
  };
  i.click();
};
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    const sc=document.querySelector(".scrim");
    if(sc)sc.remove();
    else if(openId){openId=null;render();}
    return;
  }
  if(e.key==="/"&&!/input|textarea|select/i.test(e.target.tagName)){
    const box=$("#q");if(box){e.preventDefault();box.focus();}
  }
});
try{const th=localStorage.getItem(KEY+"-theme");
  if(th==="light"){document.documentElement.dataset.theme="light";$("#themeBtn").textContent="Dark mode";}}catch(e){}
render();
</script>
